// XTF v1 segment-storage schema.
//
// These messages describe the uncompressed logical bytes persisted in an XTF
// segment. They are storage framing, not XTP transport messages; XTF envelopes
// reuse the already-validated XTP recording-event representation.

syntax = "proto3";

package xtf.v1;

import "xtp-agent/v1/recording.proto";

// Metadata for one ordered XTF segment. The surrounding XTF framing defines
// how this protobuf message is length-delimited and where it appears on disk.
message XtfHeader {
    // XTF major format version. Readers reject unsupported major versions.
    uint32 format_major = 1;
    // XTF minor format version for forward-compatible additions.
    uint32 format_minor = 2;
    // Owning project identifier; exactly 16 bytes by the storage contract.
    bytes project_id = 3;
    // Recording identifier; exactly 16 bytes by the storage contract.
    bytes recording_id = 4;
    // Zero-based ordinal within the recording.
    uint32 segment_ordinal = 5;
    // Sequence number of the first enclosed event.
    uint64 first_recording_seq = 6;
    // Sequence number of the last enclosed event.
    uint64 last_recording_seq = 7;
    // Number of enclosed event envelopes.
    uint64 event_count = 8;
}

// One event in an XTF segment. The sequence is duplicated from the enclosed
// event so the store can verify segment ordering before persisting it.
message XtfEventEnvelope {
    // Strictly increasing sequence number within the recording.
    uint64 recording_seq = 1;
    // Event payload generated by X-trace's protobuf encoder.
    xtp.agent.v1.RecordingEvent event = 2;
}
