openapi: 3.1.0
info:
  title: X-trace Experimental Local Viewer API
  version: 1.0.0
  description: >-
    Same-origin, loopback-only read API for persisted recording metadata and
    bounded verified event windows with typed source and frame-navigation
    availability. Recording details include producer-declared duration and
    persisted terminal capture-completion evidence, including unavailable
    states. Captured values, an active execution line, and independently
    verified application or HTTP outcomes remain unavailable; a producer
    summary is not outcome proof. It also exposes a finite persisted
    observed-endpoint projection for the exact Spring fixture policy; it does
    not claim framework discovery or catalog completeness. Every
    request must carry the exact Host authority printed by viewer readiness,
    Sec-Fetch-Site: same-origin, and X-XTrace-Client: viewer-v1. There is no
    CORS support. Authentication POST requests require an exact same-origin
    Origin; API GET requests accept an absent Origin only with the required
    same-origin Fetch Metadata and client header, and reject any supplied
    Origin that does not exactly match the viewer origin.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: '0'
paths:
  /api/v1/auth/exchange:
    post:
      operationId: exchangeViewerBootstrap
      summary: Exchange a one-use fragment bootstrap token for a viewer session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 43
                  maxLength: 43
                  pattern: '^[A-Za-z0-9_-]{43}$'
                  description: >-
                    Unpadded base64url encoding of exactly 32 CSPRNG bytes.
                    The token is delivered in the URL fragment and consumed
                    once within 60 seconds.
      parameters:
        - $ref: '#/components/parameters/ViewerHost'
        - $ref: '#/components/parameters/ViewerFetchSite'
        - $ref: '#/components/parameters/ViewerClient'
        - $ref: '#/components/parameters/ExchangeOrigin'
      responses:
        '200':
          description: >-
            Authenticated. Sets a host-only HttpOnly SameSite=Strict browser-session
            cookie with no persistence attributes. The server enforces a 15-minute
            session lifetime.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/recordings:
    get:
      operationId: listRecordings
      security: [{ viewerCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ViewerHost'
        - $ref: '#/components/parameters/ViewerFetchSite'
        - $ref: '#/components/parameters/ViewerClient'
        - $ref: '#/components/parameters/OptionalApiOrigin'
        - in: query
          name: limit
          description: >-
            Legacy mode (unmatched absent): default 50, maximum 200. Observed
            unmatched mode (unmatched=true): default 25, maximum 50. Values
            outside the active mode's bounds are rejected.
          schema: { type: integer, minimum: 1, maximum: 200 }
        - in: query
          name: after
          description: >-
            Exclusive stable legacy recording identity cursor. Accepted only
            when unmatched is absent.
          schema: { type: string, format: uuid }
        - in: query
          name: unmatched
          description: >-
            When exactly true, selects the observed unmatched-recording projection,
            including legacy sidecar-absent recordings. When absent, the legacy
            recordings response and after cursor remain unchanged. Other values are
            rejected. This is an observed projection, not a complete endpoint catalog.
          schema: { type: boolean, const: true }
        - in: query
          name: cursor
          description: >-
            Opaque shared application cursor. Accepted only with unmatched=true;
            cannot be combined with after.
          schema: { type: string, maxLength: 2048, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '200':
          description: >-
            With unmatched absent, returns the unchanged legacy page. With
            unmatched=true, returns the shared observed-recording page in stable
            descending openedAt and recordingId order.
          headers:
            X-XTrace-Request-Id:
              description: Correlation ID shared with safe problem responses.
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RecordingList'
                  - $ref: '#/components/schemas/ObservedRecordingPage'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/endpoints:
    get:
      operationId: listObservedEndpoints
      summary: List bounded persisted endpoint observations.
      description: >-
        Lists only persisted observations accepted under the finite
        spring-orders-v1 operator-selected policy. The policy does not attest
        which adapter or application produced the event, and this endpoint does
        not claim framework handler discovery or catalog completeness.
      security: [{ viewerCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ViewerHost'
        - $ref: '#/components/parameters/ViewerFetchSite'
        - $ref: '#/components/parameters/ViewerClient'
        - $ref: '#/components/parameters/OptionalApiOrigin'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          description: Shared canonical query and project-bound continuation cursor.
          schema: { type: string, maxLength: 2048, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '200':
          description: Direct shared application page with no transport wrapper.
          headers:
            X-XTrace-Request-Id:
              description: Correlation ID shared with safe problem responses.
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservedEndpointPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/endpoints/{operationId}/recordings:
    get:
      operationId: listOperationRecordings
      summary: List recordings explicitly linked to one observed operation.
      security: [{ viewerCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ViewerHost'
        - $ref: '#/components/parameters/ViewerFetchSite'
        - $ref: '#/components/parameters/ViewerClient'
        - $ref: '#/components/parameters/OptionalApiOrigin'
        - in: path
          name: operationId
          required: true
          description: Canonical lowercase RFC UUIDv7 public operation identity.
          schema: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - in: query
          name: cursor
          description: Shared project and operation bound continuation cursor.
          schema: { type: string, maxLength: 2048, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '200':
          description: Direct shared application page of linked recordings.
          headers:
            X-XTrace-Request-Id:
              description: Correlation ID shared with safe problem responses.
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservedRecordingPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/recordings/{recordingId}:
    get:
      operationId: showRecording
      security: [{ viewerCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ViewerHost'
        - $ref: '#/components/parameters/ViewerFetchSite'
        - $ref: '#/components/parameters/ViewerClient'
        - $ref: '#/components/parameters/OptionalApiOrigin'
        - in: path
          name: recordingId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - in: query
          name: cursor
          description: Opaque project and recording scoped versioned continuation token.
          schema: { type: string, maxLength: 128 }
        - in: query
          name: aroundFrame
          description: >-
            Window of limit events centred on this frame. Mutually exclusive with
            cursor. Registered; answers 501 XTR-REPLAY-NOT-IMPLEMENTED until served.
          schema: { type: string, format: uuid }
        - in: query
          name: projection
          description: >-
            full (default) returns every event field; structure returns outline
            fields only. structure answers 501 XTR-REPLAY-NOT-IMPLEMENTED until served.
          schema: { type: string, enum: [full, structure], default: full }
      responses:
        '200':
          description: Bounded ordered event projection backed by verified XTF segments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/recordings/{recordingId}/frames/{frameId}/navigation:
    get:
      operationId: showFrameNavigation
      description: All navigation actions of one frame in a single call.
      security: [{ viewerCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ViewerHost'
        - $ref: '#/components/parameters/ViewerFetchSite'
        - $ref: '#/components/parameters/ViewerClient'
        - $ref: '#/components/parameters/OptionalApiOrigin'
        - in: path
          name: recordingId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: frameId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Navigation facts for the frame.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrameNavigationDocument' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/recordings/{recordingId}/navigate:
    get:
      operationId: navigateRecording
      description: >-
        Resolve one navigation action from a frame (action) or jump to the next or
        previous gap, error or interaction (kind and dir).
      security: [{ viewerCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ViewerHost'
        - $ref: '#/components/parameters/ViewerFetchSite'
        - $ref: '#/components/parameters/ViewerClient'
        - $ref: '#/components/parameters/OptionalApiOrigin'
        - in: path
          name: recordingId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: frame
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: action
          schema: { type: string, enum: [previous, next, into, over, out] }
        - in: query
          name: kinds
          description: Comma separated event kinds applied to previous and next.
          schema: { type: string, maxLength: 256 }
        - in: query
          name: kind
          schema: { type: string, enum: [gap, error, interaction] }
        - in: query
          name: dir
          schema: { type: string, enum: [next, previous] }
      responses:
        '200':
          description: Result of the requested navigation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NavigateDocument' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/recordings/{recordingId}/frames:
    get:
      operationId: listRecordingFrames
      description: Window of frames by ordinal under the structure or full projection.
      security: [{ viewerCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ViewerHost'
        - $ref: '#/components/parameters/ViewerFetchSite'
        - $ref: '#/components/parameters/ViewerClient'
        - $ref: '#/components/parameters/OptionalApiOrigin'
        - in: path
          name: recordingId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: fromOrdinal
          schema: { type: integer, minimum: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 2500 }
        - in: query
          name: kinds
          schema: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Frame window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/recordings/{recordingId}/graph:
    get:
      operationId: showRecordingGraph
      description: Async and frame graph derived from structure rows.
      security: [{ viewerCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ViewerHost'
        - $ref: '#/components/parameters/ViewerFetchSite'
        - $ref: '#/components/parameters/ViewerClient'
        - $ref: '#/components/parameters/OptionalApiOrigin'
        - in: path
          name: recordingId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Frame graph.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingGraph' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    ViewerHost:
      in: header
      name: Host
      required: true
      description: Exact 127.0.0.1 authority, including the viewer's assigned port.
      schema: { type: string }
    ViewerFetchSite:
      in: header
      name: Sec-Fetch-Site
      required: true
      description: Must be exactly same-origin.
      schema: { type: string, const: same-origin }
    ViewerClient:
      in: header
      name: X-XTrace-Client
      required: true
      description: Required browser-client marker; must be exactly viewer-v1.
      schema: { type: string, const: viewer-v1 }
    ExchangeOrigin:
      in: header
      name: Origin
      required: true
      description: Must exactly equal the printed viewer origin, including port.
      schema: { type: string, format: uri }
    OptionalApiOrigin:
      in: header
      name: Origin
      required: false
      description: >-
        If supplied, must exactly equal the printed viewer origin. It may be
        absent on browser GET requests only; Host, Sec-Fetch-Site, and
        X-XTrace-Client remain required.
      schema: { type: string, format: uri }
  securitySchemes:
    viewerCookie:
      type: apiKey
      in: cookie
      name: xtrace_viewer_session
  responses:
    Problem:
      description: Safe RFC 9457-like problem document.
      headers:
        X-XTrace-Request-Id:
          description: Correlation ID included in the problem body.
          schema: { type: string, format: uuid }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    AuthResponse:
      type: object
      required: [authenticated, requestId]
      properties:
        authenticated: { type: boolean, const: true }
        requestId: { type: string, format: uuid }
    RecordingList:
      type: object
      required: [schemaVersion, projectId, limit, after, nextAfter, recordings, unavailable, requestId]
      properties:
        schemaVersion: { type: integer, const: 3 }
        projectId: { type: string, format: uuid }
        limit: { type: integer }
        after: { type: [string, 'null'], format: uuid }
        nextAfter: { type: [string, 'null'], format: uuid }
        recordings:
          type: array
          items: { $ref: '#/components/schemas/Recording' }
        unavailable: { $ref: '#/components/schemas/Unavailable' }
        requestId: { type: string, format: uuid }
    Recording:
      type: object
      required: [recordingId, status, completion, openedAt, segmentCount, eventCount, incompleteEvidence]
      properties:
        recordingId: { type: string, format: uuid }
        status: { type: string, enum: [recording, finalizing, complete, partial, invalid] }
        completion: { $ref: '#/components/schemas/Completion' }
        openedAt: { type: string, format: date-time }
        segmentCount: { type: string, pattern: '^[0-9]+$' }
        eventCount: { type: string, pattern: '^[0-9]+$' }
        firstSequence: { type: [string, 'null'], pattern: '^[0-9]+$' }
        lastSequence: { type: [string, 'null'], pattern: '^[0-9]+$' }
        incompleteEvidence: { type: array, items: { type: string } }
        eventCap: { type: [integer, 'null'], minimum: 1, description: Event cap recorded in terminal evidence. }
        outcomeKind:
          type: [string, 'null']
          enum: [responded, exception, unobserved, null]
          description: Outcome kind from terminal evidence; null when no terminal evidence exists.
    ObservedEndpointPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ObservedEndpoint' }
        nextCursor: { type: [string, 'null'], maxLength: 2048 }
    ObservedEndpoint:
      type: object
      required: [operationId, projectId, applicationComponent, binding, method, routeTemplate, observation, observationPolicy]
      properties:
        operationId:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        projectId:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        applicationComponent: { type: string, const: spring-fixture }
        binding: { type: string, const: default }
        method: { type: string, const: POST }
        routeTemplate: { type: string, const: /orders }
        observation: { type: string, const: observed }
        observationPolicy:
          type: string
          const: spring-orders-v1
          description: Operator-selected policy; it does not attest the adapter or application.
    ObservedRecordingPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ObservedRecording' }
        nextCursor: { type: [string, 'null'], maxLength: 2048 }
    ObservedRecording:
      type: object
      required: [recordingId, status, completion, openedAt, segmentCount, eventCount, firstSequence, lastSequence, incompleteEvidence, operationId, observationPolicy, unmatchedReason]
      properties:
        recordingId: { type: string, format: uuid }
        status: { type: string, enum: [recording, finalizing, complete, partial, invalid] }
        completion: { $ref: '#/components/schemas/Completion' }
        openedAt: { type: string, format: date-time }
        segmentCount: { type: string, pattern: '^[0-9]+$' }
        eventCount: { type: string, pattern: '^[0-9]+$' }
        firstSequence: { type: [string, 'null'], pattern: '^[0-9]+$' }
        lastSequence: { type: [string, 'null'], pattern: '^[0-9]+$' }
        incompleteEvidence: { type: array, items: { type: string } }
        operationId: { type: [string, 'null'], format: uuid }
        observationPolicy: { type: [string, 'null'], enum: [spring-orders-v1, null] }
        unmatchedReason:
          type: [string, 'null']
          enum: [observation_policy_missing, observation_policy_invalid, identity_context_missing, identity_context_invalid, method_unsupported, route_unapproved, null]
    RecordingDetail:
      type: object
      required: [schemaVersion, projectId, recordingId, status, completion, adapterSummary, durationNs, dropCountsByPriority, limit, cursor, nextCursor, segmentCount, events, incompleteEvidence, unavailable, outcome, capacity, limitations, honesty, anchorFrameId, firstSequence, lastSequence, prevCursor, projection, requestId]
      properties:
        schemaVersion: { type: integer, const: 3 }
        projectId: { type: string, format: uuid }
        recordingId: { type: string, format: uuid }
        status: { type: string, enum: [recording, finalizing, complete, partial, invalid] }
        completion: { $ref: '#/components/schemas/Completion' }
        adapterSummary:
          description: Producer-declared privacy-safe summary; it is not independently correlated to a RESPONSE event and is not outcome proof.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AdapterSummary'
        durationNs: { type: [string, 'null'], pattern: '^[0-9]+$' }
        dropCountsByPriority:
          type: object
          maxProperties: 256
          additionalProperties: { type: string, pattern: '^[0-9]+$' }
        limit: { type: integer }
        cursor: { type: [string, 'null'] }
        nextCursor: { type: [string, 'null'] }
        segmentCount: { type: string, pattern: '^[0-9]+$' }
        events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        incompleteEvidence: { type: array, items: { type: string } }
        unavailable: { $ref: '#/components/schemas/Unavailable' }
        outcome:
          description: Adapter-observed outcome; null when terminal evidence is absent. Nothing is synthesized.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Outcome'
        capacity:
          description: Event capacity facts; null when terminal evidence is absent.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Capacity'
        limitations:
          type: array
          items: { type: string }
          description: Stable limitation codes, for example capture_policy_not_armed.
        honesty: { $ref: '#/components/schemas/Honesty' }
        anchorFrameId: { type: [string, 'null'], format: uuid }
        firstSequence: { type: [string, 'null'], pattern: '^[0-9]+$' }
        lastSequence: { type: [string, 'null'], pattern: '^[0-9]+$' }
        prevCursor: { type: [string, 'null'], maxLength: 128 }
        projection: { type: string, enum: [full, structure] }
        requestId: { type: string, format: uuid }
    Outcome:
      type: object
      required: [kind, httpStatus, exception, thrownFromEventId]
      properties:
        kind: { type: string, enum: [responded, exception, unobserved] }
        httpStatus: { type: [integer, 'null'], minimum: 100, maximum: 599 }
        exception:
          oneOf:
            - type: 'null'
            - type: object
              required: [exceptionType, message]
              properties:
                exceptionType: { type: string, maxLength: 256 }
                message: { type: [string, 'null'], maxLength: 512 }
        thrownFromEventId: { type: [string, 'null'], maxLength: 128 }
    Capacity:
      type: object
      required: [eventCap, eventCount, capacityDroppedEvents, dropsByPriority]
      properties:
        eventCap: { type: integer, minimum: 1 }
        eventCount: { type: integer, minimum: 0 }
        capacityDroppedEvents: { type: string, pattern: '^[0-9]+$' }
        dropsByPriority:
          type: object
          maxProperties: 256
          additionalProperties: { type: string, pattern: '^[0-9]+$' }
    Honesty:
      type: object
      required: [schemaVersion, recording, window]
      properties:
        schemaVersion: { type: integer, const: 1 }
        recording:
          type: object
          required: [completion, incomplete, capacityDroppedEvents, dropsByPriority, framesWithGap, framesWithRedacted, framesWithTruncated, framesWithUnavailable, framesWithDropped, framesWithOrphanParent, countsAvailable]
          properties:
            completion: { $ref: '#/components/schemas/Completion' }
            incomplete: { type: array, items: { type: string } }
            capacityDroppedEvents: { type: string, pattern: '^[0-9]+$' }
            dropsByPriority:
              type: object
              additionalProperties: { type: string, pattern: '^[0-9]+$' }
            framesWithGap: { type: [integer, 'null'], minimum: 0 }
            framesWithRedacted: { type: [integer, 'null'], minimum: 0 }
            framesWithTruncated: { type: [integer, 'null'], minimum: 0 }
            framesWithUnavailable: { type: [integer, 'null'], minimum: 0 }
            framesWithDropped: { type: [integer, 'null'], minimum: 0 }
            framesWithOrphanParent: { type: [integer, 'null'], minimum: 0 }
            countsAvailable:
              type: boolean
              description: False when frame counts cannot be computed; counts are then null, never zero.
        window:
          type: object
          required: [events, bindingsByState, unavailableByReason, droppedByReason, gaps, sourceBindings, sourceStatus]
          properties:
            events: { type: integer, minimum: 0 }
            bindingsByState: { type: object, additionalProperties: { type: integer, minimum: 0 } }
            unavailableByReason: { type: object, additionalProperties: { type: integer, minimum: 0 } }
            droppedByReason: { type: object, additionalProperties: { type: integer, minimum: 0 } }
            gaps:
              type: array
              items:
                type: object
                required: [sequence, reason, count, firstSequence, lastSequence]
                properties:
                  sequence: { type: string, pattern: '^[0-9]+$' }
                  reason: { type: string }
                  count: { type: string, pattern: '^[0-9]+$' }
                  firstSequence: { type: string, pattern: '^[0-9]+$' }
                  lastSequence: { type: string, pattern: '^[0-9]+$' }
            sourceBindings: { type: object, additionalProperties: { type: integer, minimum: 0 } }
            sourceStatus: { type: object, additionalProperties: { type: integer, minimum: 0 } }
    Binding:
      type: object
      required: [name, role, nameOrigin, value]
      properties:
        name: { type: string }
        role: { type: string }
        nameOrigin: { type: string }
        value:
          oneOf:
            - type: object
              required: [state, shape, preview, contentHash]
              properties:
                state: { type: string, const: captured }
                shape: { type: string }
                preview: { type: string, maxLength: 512 }
                contentHash: { type: string, pattern: '^b3:[0-9a-f]{64}$' }
            - type: object
              required: [state, ruleId, shapeHint]
              properties:
                state: { type: string, const: redacted }
                ruleId: { type: string }
                shapeHint: { type: [string, 'null'] }
            - type: object
              required: [state, preview, originalSizeLowerBound, limit]
              properties:
                state: { type: string, const: truncated }
                preview: { type: string, maxLength: 512 }
                originalSizeLowerBound: { type: string, pattern: '^[0-9]+$' }
                limit: { type: string, pattern: '^[0-9]+$' }
            - type: object
              required: [state, reason]
              properties:
                state: { type: string, const: unavailable }
                reason: { type: string }
            - type: object
              required: [state, reason]
              properties:
                state: { type: string, const: dropped }
                reason: { type: string }
    Gap:
      type: object
      required: [reason, count, firstSequence, lastSequence]
      description: >-
        Suppressed observations never receive a sequence. firstSequence and
        lastSequence bracket the nearest emitted events; count is the number
        suppressed and may exceed their distance.
      properties:
        reason: { type: string }
        count: { type: string, pattern: '^[0-9]+$' }
        firstSequence: { type: string, pattern: '^[0-9]+$' }
        lastSequence: { type: string, pattern: '^[0-9]+$' }
    FrameNavigationDocument:
      type: object
      required: [frameId, sequence, depth, parentFrameId, navigation]
      properties:
        frameId: { type: string, format: uuid }
        sequence: { type: string, pattern: '^[0-9]+$' }
        depth: { type: [integer, 'null'], minimum: 0 }
        parentFrameId: { type: [string, 'null'], format: uuid }
        navigation: { $ref: '#/components/schemas/FrameNavigation' }
    NavigateDocument:
      type: object
      required: [frameId, result]
      properties:
        frameId: { type: string, format: uuid }
        action: { type: string, enum: [previous, next, into, over, out] }
        result: { $ref: '#/components/schemas/NavigationResult' }
    RecordingGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [frameId, kind, depth]
            properties:
              frameId: { type: string, format: uuid }
              kind: { type: string }
              depth: { type: [integer, 'null'], minimum: 0 }
              count: { type: integer, minimum: 1 }
        edges:
          type: array
          items:
            type: object
            required: [from, to, relation]
            properties:
              from: { type: string, format: uuid }
              to: { type: string, format: uuid }
              relation: { type: string, enum: [parent, async_parent] }
    Event:
      type: object
      required: [sequence, frameId, navigation, monotonicNs, kind, sourceBinding, fieldTruncations, depth, parentFrameId, asyncParentFrameId, line, bindings, gap]
      properties:
        sequence: { type: string, pattern: '^[0-9]+$' }
        frameId:
          type: [string, 'null']
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        navigation: { $ref: '#/components/schemas/FrameNavigation' }
        monotonicNs: { type: string, pattern: '^[0-9]+$' }
        eventId: { type: [string, 'null'] }
        parentEventId: { type: [string, 'null'] }
        asyncParentEventId: { type: [string, 'null'] }
        kind: { type: string }
        symbol: { type: [string, 'null'] }
        interaction:
          type: [object, 'null']
          additionalProperties: { type: [string, 'null'] }
        sourceBinding:
          type: string
          description: Adapter-reported compile-time class-to-source binding result.
          enum: [unspecified, verified, attestation_missing, class_bytes_mismatch, debug_metadata_absent, source_metadata_invalid, observed_unattested, source_map_absent, source_map_unresolved]
        source:
          oneOf:
            - type: 'null'
            - type: object
              required: [path, startLine, endLine, status, excerpt, truncated]
              properties:
                path: { type: string, maxLength: 256 }
                startLine:
                  type: integer
                  minimum: 1
                  description: Lower bound of the fixture method debug-line extent, not an active execution cursor.
                endLine:
                  type: [integer, 'null']
                  minimum: 1
                  description: Inclusive upper bound of the fixture method debug-line extent, when available.
                status: { type: string, enum: [matched, mismatch, unavailable, missing_file] }
                excerpt: { type: [string, 'null'], maxLength: 16384 }
                truncated: { type: boolean }
        fieldTruncations:
          type: array
          items:
            type: object
            required: [field, originalBytes, representation]
            properties:
              field: { type: string }
              originalBytes: { type: string, pattern: '^[0-9]+$' }
              representation: { type: string, enum: [truncated, unavailable] }
        depth: { type: [integer, 'null'], minimum: 0, description: Null for legacy or unindexed rows. }
        parentFrameId: { type: [string, 'null'], format: uuid, description: Only when the parent was observed. }
        asyncParentFrameId: { type: [string, 'null'], format: uuid, description: Only when the async parent was observed. }
        line:
          type: [integer, 'null']
          minimum: 1
          description: Observed line; set only for line_cursor events and never a method extent.
        bindings:
          type: array
          items: { $ref: '#/components/schemas/Binding' }
          description: Empty means none observed.
        gap:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Gap'
    Completion:
      type: string
      enum: [complete, partial, invalid, unavailable]
    FrameNavigation:
      type: object
      required: [previous, next, into, over, out]
      properties:
        previous: { $ref: '#/components/schemas/NavigationResult' }
        next: { $ref: '#/components/schemas/NavigationResult' }
        into: { $ref: '#/components/schemas/NavigationResult' }
        over: { $ref: '#/components/schemas/NavigationResult' }
        out: { $ref: '#/components/schemas/NavigationResult' }
    NavigationResult:
      oneOf:
        - type: object
          required: [state, frameId]
          properties:
            state: { type: string, const: target }
            frameId: { type: string, format: uuid }
        - type: object
          required: [state]
          properties:
            state: { type: string, const: boundary }
        - type: object
          required: [state, reason]
          properties:
            state: { type: string, const: unavailable }
            reason:
              type: string
              enum: [partial_frontier, legacy_unindexed, depth_overflow, orphan_parent, not_navigable]
    AdapterSummary:
      description: No preview text or producer-supplied rule identifier is exposed until a verified policy registry exists.
      oneOf:
        - type: object
          required: [Redacted]
          properties:
            Redacted:
              type: object
              required: [rule_id, shape_hint]
              properties:
                rule_id: { type: string, const: unverified-producer-redaction }
                shape_hint: {}
        - type: object
          required: [Unavailable]
          properties:
            Unavailable:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [capability_unsupported, debug_metadata_absent, capture_budget_exhausted, source_artifact_missing, recorder_disconnected, privacy_policy_unavailable] }
        - type: object
          required: [Dropped]
          properties:
            Dropped:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [backpressure_shed, queue_full, sequence_gap, adapter_dropped] }
    Unavailable:
      type: object
      required: [source, values, completion]
      properties:
        source: { type: string, enum: [unavailable, available] }
        values: { type: string, enum: [unavailable, available] }
        completion: { type: string, enum: [available, unavailable, per_recording] }
    Problem:
      type: object
      required: [type, title, status, detail, code, requestId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        requestId: { type: string, format: uuid }
