[package]
name = "xtrace-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
description = "Bundled SQLite store, migrations, and repository adapters."

[lints]
workspace = true

[dependencies]
xtrace-domain = { path = "../xtrace-domain" }
xtrace-application = { path = "../xtrace-application" }
xtrace-protocol = { path = "../xtrace-protocol" }
xtrace-private-storage = { path = "../xtrace-private-storage" }
rusqlite = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
zstd = { workspace = true }
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3.10"
# Test-only: counts /bin/ls spawns for the spawn-bound test. Never enabled for a release build.
xtrace-private-storage = { path = "../xtrace-private-storage", features = ["spawn-counter"] }
