[package]
name = "xtrace-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
description = "Command-line entry point for X-trace."

[lints]
workspace = true

[[bin]]
name = "xtrace"
path = "src/main.rs"

[dependencies]
xtrace-application = { path = "../xtrace-application" }
xtrace-domain = { path = "../xtrace-domain" }
xtrace-protocol = { path = "../xtrace-protocol" }
xtrace-store = { path = "../xtrace-store" }
xtrace-daemon = { path = "../xtrace-daemon" }
xtrace-runtime = { path = "../xtrace-runtime" }
clap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal"] }

[target.'cfg(unix)'.dependencies]
fs4 = "1.1.0"
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
blake3 = { workspace = true }
prost = { workspace = true }
rusqlite = { workspace = true }
tempfile = "3.10"
zstd = { workspace = true }
