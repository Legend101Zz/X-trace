[package]
name = "xtrace-private-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
description = "Owner-enforced private directory admission shared by X-trace storage and runtime crates."

# Match workspace lints, with a scoped exception for the macOS SDK bridge. `forbid` cannot
# be overridden at module scope; `deny` keeps unsafe forbidden everywhere else in this crate.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "allow", priority = -1 }
allow_attributes = "allow"
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
result_large_err = "allow"

[features]
# Private CI channel only. build.rs rejects release profiles regardless of debug assertions;
# diagnostic.rs also rejects builds without debug assertions.
ci-diagnostics = []
# Test seam: counts `/bin/ls` spawns per thread. Off by default; consumers enable it only through
# [dev-dependencies] so release builds never contain it.
spawn-counter = []

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3.10"
