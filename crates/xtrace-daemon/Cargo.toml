[package]
name = "xtrace-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
description = "Local loopback XTP-Agent ingress daemon with pinned TLS 1.3."

[lints]
workspace = true

[dependencies]
xtrace-domain = { path = "../xtrace-domain" }
xtrace-application = { path = "../xtrace-application" }
xtrace-protocol = { path = "../xtrace-protocol" }
xtrace-ingest = { path = "../xtrace-ingest" }
xtrace-private-storage = { path = "../xtrace-private-storage" }
async-trait = { workspace = true }
axum = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true }
constant_time_eq = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
prost = { workspace = true }
rcgen = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-webpki = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# `test` brings in `tokio::test` (current-thread runtime + async assertions)
# so integration tests can exercise the daemon without a separate
# runtime dependency.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
# RAII temporary directories for integration tests. The crate's
# `TempDir` guard removes the directory on drop so a panic in a test
# never strands an unwiped bootstrap artifact or secret-bearing file.
tempfile = "3.10"
xtrace-store = { path = "../xtrace-store" }
rusqlite.workspace = true
