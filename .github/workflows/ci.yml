name: ci

on:
  push:
    branches:
      - main
      - "slice/**"
      - "ultra/*-integration"
      - "ultra/rc-*"
  pull_request:
    branches:
      - main
      - "slice/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-tool-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux descriptor inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes lsof
      - name: Select private root path
        # The runner context is not available in job-level `env`; derive the
        # path from the shell-level runner variable and export it here.
        run: |
          # Short on purpose: the product's default init idempotency key is `xtrace-init-<repo path>`
          # and is capped at 128 characters, and the Rust tests create repos under this root's tmp.
          # Every job runs on its own runner, so a fixed name cannot collide.
          root="${RUNNER_TEMP:?}/xr"
          [ "${#root}" -le 40 ] || { echo "private root path too long"; exit 1; }
          echo "XTRACE_CI_PRIVATE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Verify exact source and phase base
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor preflight-source \
            --repo "$GITHUB_WORKSPACE" \
            --phase-metadata evidence/v0.01/workflow.json \
            --expected-head "$GITHUB_SHA"
      - name: Admit private scratch before test output
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor prepare-private-root --root "$XTRACE_CI_PRIVATE_ROOT"
      - name: Run the complete release tooling suite without skips
        run: |
          set +e
          umask 077
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor summarize-tests \
            --root "$XTRACE_CI_PRIVATE_ROOT" --repo "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA" \
            --log-file "$XTRACE_CI_PRIVATE_ROOT/release-tool-tests.log"
          result=$?
          set -e
          exit "$result"

  release-floor-linux-x86_64:
    needs: release-tool-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tuple: jdk17-node22
            java-version: 17
            node-version: 22
          - tuple: jdk21-node24
            java-version: 21
            node-version: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install release-floor system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            lsof \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libcups2t64 libdrm2 libgbm1 libglib2.0-0t64 \
            libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 \
            libxext6 libxfixes3 libxrandr2 libxkbcommon0 libxshmfence1 libgtk-3-0t64
      - name: Select private root path
        # The runner context is not available in job-level `env`; derive the
        # path from the shell-level runner variable and export it here.
        run: |
          # Short on purpose: the product's default init idempotency key is `xtrace-init-<repo path>`
          # and is capped at 128 characters, and the Rust tests create repos under this root's tmp.
          # Every job runs on its own runner, so a fixed name cannot collide.
          root="${RUNNER_TEMP:?}/xf"
          [ "${#root}" -le 40 ] || { echo "private root path too long"; exit 1; }
          echo "XTRACE_CI_PRIVATE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Verify source, architecture, toolchain tuple, and browser prerequisites
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor preflight \
            --repo "$GITHUB_WORKSPACE" \
            --phase-metadata evidence/v0.01/workflow.json \
            --expected-head "$GITHUB_SHA" \
            --java-major "${{ matrix.java-version }}" \
            --node-major "${{ matrix.node-version }}" \
            --tuple "${{ matrix.tuple }}"
      - name: Admit private logs, leases, caches, and test scratch before writes
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor prepare-private-root --root "$XTRACE_CI_PRIVATE_ROOT"
      - name: Verify full release tooling suite on the exact source
        run: |
          set +e
          umask 077
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor summarize-tests \
            --root "$XTRACE_CI_PRIVATE_ROOT" --repo "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA" \
            --log-file "$XTRACE_CI_PRIVATE_ROOT/release-tool-tests.log"
          result=$?
          set -e
          exit "$result"
      - name: Run all 23 pinned release gates
        run: |
          set +e
          umask 077
          python3 -B -m tools.release.run_gates \
            --repo "$GITHUB_WORKSPACE" \
            --base "$XTRACE_PHASE_BASE_SHA" \
            --label "floor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.tuple }}" \
            --cache-root "$XTRACE_CI_PRIVATE_ROOT" \
            --prewarm-gradle \
            > "$XTRACE_CI_PRIVATE_ROOT/gate-runner.log" 2>&1
          result=$?
          set -e
          exit "$result"
      - name: Write a strict sanitized result summary
        if: always() && env.XTRACE_PRIVATE_ROOT_ADMITTED == '1'
        run: |
          set +e
          python3 -B -m tools.release.ci_floor sanitize-floor \
            --root "$XTRACE_CI_PRIVATE_ROOT" \
            --repo "$GITHUB_WORKSPACE" \
            --label "floor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.tuple }}" \
            --expected-head "$GITHUB_SHA" \
            --phase-base "${XTRACE_PHASE_BASE_SHA:-}" \
            --tuple "${{ matrix.tuple }}"
          result=$?
          set -e
          exit "$result"
      - name: Upload sanitized floor summary only
        if: always() && env.XTRACE_PRIVATE_ROOT_ADMITTED == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xtrace-v001-floor-${{ matrix.tuple }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.XTRACE_CI_PRIVATE_ROOT }}/release-floor-summary.json
          if-no-files-found: error
          retention-days: 14

  java-client:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CACHE: /tmp/xtrace-npm-cache
      PLAYWRIGHT_BROWSERS_PATH: /tmp/xtrace-playwright
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: gradle
          cache-dependency-path: |
            adapters/java/build.gradle.kts
            adapters/java/settings.gradle.kts
            adapters/java/gradle.lockfile
            adapters/java/*/build.gradle.kts
            adapters/java/*/gradle.lockfile
            adapters/java/gradle/verification-metadata.xml
            adapters/java/gradle/wrapper/gradle-wrapper.properties
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-java-client-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-java-client-cargo-
      - name: Verify Java protocol, agent, and fixture workspace
        working-directory: adapters/java
        run: ./gradlew --dependency-verification strict clean test installDist agentDist fixtureBootJar
      - name: Admit private test scratch before cargo tests
        # Product storage refuses a data directory under a world-writable ancestor such as /tmp, so
        # Rust tests that run `init` need a TMPDIR below the runner's private temp directory. This is
        # the same shape the release floor uses (TMPDIR and XTRACE_TEST_PRIVATE_SCRATCH inside an
        # admitted 0700 root). It is placed after the Node/Gradle steps so only cargo steps see it.
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP:?}/xt"
          mkdir -m 700 "$root" "$root/tmp" "$root/priv"
          echo "TMPDIR=$root/tmp" >> "$GITHUB_ENV"
          echo "XTRACE_TEST_PRIVATE_SCRATCH=$root/priv" >> "$GITHUB_ENV"
      - name: Java client to daemon and selected-root XTF acceptance
        run: cargo test -p xtrace-cli --test java_synthetic_adapter -- --nocapture
      - name: Direct JDK runtime validation
        run: cargo test -p xtrace-runtime
      - name: Launch-only premain Spring MVC acceptance
        run: cargo test -p xtrace-cli --test java_premain_spring -- --nocapture
      - name: Install pinned browser-journey dependency and Chromium
        run: |
          npm ci --prefix web/app
          cd web/app
          npx playwright install --with-deps chromium
      - name: Supervised direct-Java Spring MVC acceptance
        run: cargo test -p xtrace-cli --test java_run_spring -- --nocapture

  node-client:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CACHE: /tmp/xtrace-npm-cache
      PLAYWRIGHT_BROWSERS_PATH: /tmp/xtrace-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-node-client-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-client-cargo-
      - name: Install exact Node workspace dependencies
        run: npm ci --prefix adapters/node
      - name: Check canonical Protobuf code generation
        run: npm run generate:check --prefix adapters/node
      - name: Typecheck and Node unit tests
        run: npm test --prefix adapters/node
      - name: Admit private test scratch before cargo tests
        # Product storage refuses a data directory under a world-writable ancestor such as /tmp, so
        # Rust tests that run `init` need a TMPDIR below the runner's private temp directory. This is
        # the same shape the release floor uses (TMPDIR and XTRACE_TEST_PRIVATE_SCRATCH inside an
        # admitted 0700 root). It is placed after the Node/Gradle steps so only cargo steps see it.
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP:?}/xt"
          mkdir -m 700 "$root" "$root/tmp" "$root/priv"
          echo "TMPDIR=$root/tmp" >> "$GITHUB_ENV"
          echo "XTRACE_TEST_PRIVATE_SCRATCH=$root/priv" >> "$GITHUB_ENV"
      - name: Node client to daemon and selected-root XTF acceptance
        run: cargo test -p xtrace-cli --test node_synthetic_adapter -- --nocapture

  gates:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CACHE: /tmp/xtrace-npm-cache
      PLAYWRIGHT_BROWSERS_PATH: /tmp/xtrace-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            adapters/java/build.gradle.kts
            adapters/java/settings.gradle.kts
            adapters/java/gradle.lockfile
            adapters/java/*/build.gradle.kts
            adapters/java/*/gradle.lockfile
            adapters/java/gradle/verification-metadata.xml
            adapters/java/gradle/wrapper/gradle-wrapper.properties
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install and validate Node protocol workspace
        run: |
          npm ci --prefix adapters/node
          npm run generate:check --prefix adapters/node
          npm test --prefix adapters/node
      - name: Install and verify embedded browser viewer
        run: |
          npm ci --prefix web/app
          cd web/app
          npx playwright install --with-deps chromium
          cd ../..
          npm run typecheck --prefix web/app
          npm test --prefix web/app
          npm run check:api --prefix web/app
          npm run check:embedded --prefix web/app
      - name: Verify Java protocol, agent, and fixture workspace
        working-directory: adapters/java
        run: ./gradlew --dependency-verification strict clean test installDist agentDist fixtureBootJar
      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Admit private test scratch before cargo tests
        # Product storage refuses a data directory under a world-writable ancestor such as /tmp, so
        # Rust tests that run `init` need a TMPDIR below the runner's private temp directory. This is
        # the same shape the release floor uses (TMPDIR and XTRACE_TEST_PRIVATE_SCRATCH inside an
        # admitted 0700 root). It is placed after the Node/Gradle steps so only cargo steps see it.
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP:?}/xt"
          mkdir -m 700 "$root" "$root/tmp" "$root/priv"
          echo "TMPDIR=$root/tmp" >> "$GITHUB_ENV"
          echo "XTRACE_TEST_PRIVATE_SCRATCH=$root/priv" >> "$GITHUB_ENV"
      - name: Format gate (stable rustfmt, no nightly-only keys)
        run: cargo fmt --all --check
      - name: Strict clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Unit and integration tests
        run: cargo test --locked --workspace --all-features --no-fail-fast
      - name: Restricted-PATH vendored-protoc build
        # `PATH` excludes any directory that could host a system `protoc`,
        # proving the build script resolves the binary exclusively through
        # `protoc-bin-vendored`.
        run: |
          PATH="/usr/bin:/bin:/usr/local/bin:$HOME/.cargo/bin" \
            cargo build --locked -p xtrace-protocol --all-features
      - name: CLI integration smoke
        run: |
          set -euo pipefail
          SMOKE="${RUNNER_TEMP:?}/xt/smoke"
          export XTRACE_DATA_HOME="$SMOKE/userdata"
          rm -rf $SMOKE
          mkdir -p $SMOKE/repo
          cargo build --locked -p xtrace-cli --bin xtrace
          # Uninitialized status: must not create the user-data
          # directory or the repository pointer. Capture both stdout
          # and exit code; `set -e` is suspended only around this
          # command so a future bug that exits non-zero still fails
          # the gate.
          status_output=$(cargo run --locked -q -p xtrace-cli --bin xtrace -- status --project-dir $SMOKE/repo)
          echo "$status_output"
          if [ -d $SMOKE/userdata/projects ]; then
            echo "FAIL: status on uninit created user-data directory"
            exit 1
          fi
          if [ -e $SMOKE/repo/.xtrace ]; then
            echo "FAIL: status on uninit created repository pointer"
            exit 1
          fi
          if ! echo "$status_output" | grep -q '"initialized": false'; then
            echo "FAIL: status report on uninit must mark initialized=false"
            exit 1
          fi
          # init twice with the same canonical input must replay.
          cargo run --locked -q -p xtrace-cli --bin xtrace -- init --project-dir $SMOKE/repo --display-name "Smoke"
          first_project=$(ls $SMOKE/userdata/projects | head -n1)
          cargo run --locked -q -p xtrace-cli --bin xtrace -- init --project-dir $SMOKE/repo --display-name "Smoke"
          after_replay=$(ls $SMOKE/userdata/projects | wc -l)
          if [ "$after_replay" -ne 1 ]; then
            echo "FAIL: replay created extra project directory"
            exit 1
          fi
          # init with a different display name must surface
          # XTR-COMMAND-409 and must NOT create a second project
          # directory. `set +e` captures the failure exit; the gate
          # then enforces the contract explicitly rather than relying
          # on `|| true`.
          set +e
          conflict_output=$(cargo run --locked -q -p xtrace-cli --bin xtrace -- init --project-dir $SMOKE/repo --display-name "Different" 2>&1)
          conflict_exit=$?
          set -e
          if [ "$conflict_exit" -eq 0 ]; then
            echo "FAIL: idempotency conflict was not raised"
            exit 1
          fi
          if ! echo "$conflict_output" | grep -q 'XTR-COMMAND-409'; then
            echo "FAIL: idempotency conflict did not surface XTR-COMMAND-409"
            echo "Output was:"
            echo "$conflict_output"
            exit 1
          fi
          after_conflict=$(ls $SMOKE/userdata/projects | wc -l)
          if [ "$after_conflict" -ne 1 ]; then
            echo "FAIL: idempotency conflict created extra project directory"
            exit 1
          fi
          # Successful status + open after init.
          cargo run --locked -q -p xtrace-cli --bin xtrace -- status --project-dir $SMOKE/repo
          cargo run --locked -q -p xtrace-cli --bin xtrace -- open --project-dir $SMOKE/repo
          test -f $SMOKE/userdata/projects/"$first_project"/metadata.sqlite3
          test -f $SMOKE/repo/.xtrace/config.toml
          grep -q '^project_id = ' $SMOKE/repo/.xtrace/config.toml

  macos-arm64:
    # ADR 0006 section 2.3: hosted macOS arm64 evidence for cfg(unix), private storage, attach and packaging changes.
    # Every step runs, none is skipped or allowed to fail; the Rust, Java, Node and web steps print only allowlisted
    # facts (tools.qa.lane_run keeps raw output in a private log).
    needs: release-tool-tests
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tuple: jdk17-node22
            java-version: 17
            node-version: 22
          - tuple: jdk21-node24
            java-version: 21
            node-version: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Select private root path
        run: |
          root="$RUNNER_TEMP/mr"
          [ "${#root}" -le 40 ] || { echo "private root path too long"; exit 1; }
          echo "XTRACE_CI_PRIVATE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Put Homebrew OpenSSL 3 first on PATH
        # The macOS system openssl is LibreSSL; the release tooling preflight requires OpenSSL 3.
        run: |
          set -euo pipefail
          prefix="$(brew --prefix openssl@3)"
          test -x "$prefix/bin/openssl"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Verify exact source and architecture
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor preflight-source \
            --repo "$GITHUB_WORKSPACE" \
            --phase-metadata evidence/v0.01/workflow.json \
            --expected-head "$GITHUB_SHA"
      - name: Admit private scratch before test output
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor prepare-private-root --root "$XTRACE_CI_PRIVATE_ROOT"
      - name: Run the complete release tooling suite without skips
        run: |
          set +e
          umask 077
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor summarize-tests \
            --root "$XTRACE_CI_PRIVATE_ROOT" --repo "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA" \
            --log-file "$XTRACE_CI_PRIVATE_ROOT/release-tool-tests.log"
          result=$?
          set -e
          exit "$result"
      - name: Install exact Node workspace dependencies
        run: |
          python3 -B -m tools.qa.lane_run run --suite node --variant "${{ matrix.node-version }}" --step install --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            npm ci --prefix adapters/node
      - name: Node protocol generation check and unit tests
        run: |
          python3 -B -m tools.qa.lane_run run --suite node --variant "${{ matrix.node-version }}" --step generate-check --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            npm run generate:check --prefix adapters/node
          python3 -B -m tools.qa.lane_run run --suite node --variant "${{ matrix.node-version }}" --step test --min-passed 20 --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            npm test --prefix adapters/node
      - name: Web viewer install, tests and embedded checks
        run: |
          python3 -B -m tools.qa.lane_run run --suite web --variant "${{ matrix.node-version }}" --step install --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            bash -ec 'npm ci --prefix web/app && cd web/app && npx playwright install chromium'
          python3 -B -m tools.qa.lane_run run --suite web --variant "${{ matrix.node-version }}" --step typecheck --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            npm run typecheck --prefix web/app
          python3 -B -m tools.qa.lane_run run --suite web --variant "${{ matrix.node-version }}" --step unit-tests --min-passed 20 --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            npm test --prefix web/app
          python3 -B -m tools.qa.lane_run run --suite web --variant "${{ matrix.node-version }}" --step check-api --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            npm run check:api --prefix web/app
          python3 -B -m tools.qa.lane_run run --suite web --variant "${{ matrix.node-version }}" --step check-embedded --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            npm run check:embedded --prefix web/app
      - name: Java strict Gradle build and tests
        run: |
          python3 -B -m tools.qa.lane_run run --suite java --variant "${{ matrix.java-version }}" --step gradle --cwd adapters/java \
            --junit-glob "*/build/test-results/test/*.xml" --min-passed 150 --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            ./gradlew --dependency-verification strict clean test installDist agentDist fixtureBootJar
      - name: Admit private test scratch before cargo tests
        # Product storage refuses a data directory under a world-writable ancestor; same shape as the Linux jobs.
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mt"
          mkdir -m 700 "$root" "$root/tmp" "$root/priv"
          echo "TMPDIR=$root/tmp" >> "$GITHUB_ENV"
          echo "XTRACE_TEST_PRIVATE_SCRATCH=$root/priv" >> "$GITHUB_ENV"
      - name: cargo build (locked workspace)
        run: |
          python3 -B -m tools.qa.lane_run run --suite rust --variant "${{ matrix.tuple }}" --step build --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            cargo build --locked --workspace --all-features
      - name: cargo test (locked workspace, no skips)
        run: |
          python3 -B -m tools.qa.lane_run run --suite rust --variant "${{ matrix.tuple }}" --step test --min-passed 1 --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            cargo test --locked --workspace --all-features --no-fail-fast
      - name: Packaged install journey (unattended)
        run: |
          python3 -B -m tools.qa.lane_run run --suite package --variant "${{ matrix.tuple }}" --step journey --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            bash -ec '
              python3 packaging/build.py --out dist --platform macos-arm64
              sh packaging/install.sh verify-dist dist/macos-arm64
              root="$RUNNER_TEMP/xt-install"
              mkdir -m 700 "$root" "$root/tmp"
              TMPDIR="$root/tmp" sh packaging/test/install_test.sh dist/macos-arm64
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: xtrace-macos-arm64-frag-${{ matrix.tuple }}
          path: ${{ env.XTRACE_CI_PRIVATE_ROOT }}/frag
          if-no-files-found: ignore
          retention-days: 14
