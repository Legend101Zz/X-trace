name: web-floor-probe

on:
  push:
    branches: [diagnostic/web-floor-20261124]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROBE_SOURCE: f60057b98b330cb45765b2d1ec78dd0c9f3aed83
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PROBE_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - name: Run pinned Node and web gates with the floor supervisor
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$PROBE_SOURCE"
          export PROBE_ROOT="$RUNNER_TEMP/xf"
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$PROBE_ROOT"
          lsof -nP -a -p "$$" -d cwd -Fp >/dev/null 2>&1
          set +e
          python3 -B - >"$PROBE_ROOT/probe-runner.log" 2>&1 <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys
          from tools.release import ci_floor, private_roots, run_gates
          from tools.qa import release_floor

          root = pathlib.Path(os.environ["PROBE_ROOT"])
          repo = pathlib.Path.cwd()
          for name in ("home", "tmp", "private", "cardinality", "logs"):
              private_roots.ensure_private_directory(root / name)
          env = run_gates.build_task_env(root, os.environ.copy(), home=root / "home", scratch=root / "tmp")
          env["XTRACE_TEST_PRIVATE_SCRATCH"] = str(root / "private")
          env["XTRACE_TEST_CARDINALITY_SCRATCH"] = str(root / "cardinality")
          selected = [
              gate for gate in run_gates.GATES
              if gate.name.startswith(("node-", "web-"))
          ]
          summary = {"sourceSha": os.environ["PROBE_SOURCE"], "node": "22.23.4",
                     "gates": [], "fullFloor": False, "releaseAcceptance": False}
          for gate in selected:
              path = root / "logs" / f"{gate.name}.log"
              try:
                  with release_floor.configured_floor(root, 7200):
                      code, _ = run_gates._run(
                          gate.argv, cwd=repo / gate.cwd, env=env, timeout=7200,
                          log_path=path, provenance=True,
                      )
              except (run_gates.UncertainProcessTree, run_gates.AttemptedGateFailure):
                  summary["gates"].append({"gate": gate.name, "supervision": "failed"})
                  code = 1
                  break
              summary["gates"].append({"gate": gate.name, "exitCode": code})
              if gate.name == "web-tests":
                  # Observe only fixed phrases and counts. Raw npm output stays private.
                  fd = private_roots.open_private_file_read(path)
                  with os.fdopen(fd, "rb") as stream:
                      payload = stream.read(1024 * 1024 + 1)
                  if len(payload) <= 1024 * 1024:
                      clean = re.sub(rb"\x1b\[[0-9;]*m", b"", payload)
                      facts = {
                          "vitest-failed-files": rb"(?m)^ +Test Files +[0-9]+ failed\b",
                          "vitest-failed-tests": rb"(?m)^ +Tests +[0-9]+ failed\b",
                          "vitest-assertion-error": rb"(?m)^AssertionError:",
                          "vitest-timeout": rb"(?m)^Error: Test timed out in [0-9]+ms\.",
                          "vitest-unhandled": rb"(?m)^Vitest caught [0-9]+ unhandled errors? during the test run\.",
                          "contrast-policy-error": rb"(?m)^Error: .{0,250}WCAG AA requires (?:4\.5|3):1",
                          "contrast-passed": rb"(?m)^contrast \(WCAG AA\): 20 token pairs pass\r?$",
                      }
                      summary["webObservations"] = [
                          key for key, pattern in facts.items() if re.search(pattern, clean)
                      ]
                      for key, pattern in {
                          "passedVitestFiles": rb"(?m)^ +Test Files +([0-9]{1,5}) passed\b",
                          "passedVitestTests": rb"(?m)^ +Tests +([0-9]{1,5}) passed\b",
                      }.items():
                          match = re.search(pattern, clean)
                          if match:
                              summary[key] = int(match[1])
                  if code:
                      hints = ci_floor._gate_failure_hints(path)
                      summary["webFailureHints"] = {
                          key: value for key, value in hints.items()
                          if key.startswith("web") and key in {"webFailedStage", "webFailureSignals"}
                      }
              if code:
                  break
          # Diagnostic fault injection after the unchanged gates. Use disposable runner files and
          # record only fixed outcomes. This is never release-floor or product acceptance.
          faults_ok = True
          if code == 0:
              web_gate = next(gate for gate in selected if gate.name == "web-tests")
              summaries = []
              case_path = repo / "web/app/src/xtrace-hosted-fault-probe.test.ts"
              stylesheet = repo / "web/app/src/style.css"
              original_css = stylesheet.read_bytes()
              for stage, signal in (("vitest", "test-failure"), ("contrast", "contrast-rule")):
                  run_dir = root / "release-gates" / f"floor-probe-{stage}"
                  log_path = run_dir / "logs/web-tests.log"
                  private_roots.ensure_private_directory(run_dir.parent)
                  private_roots.ensure_private_directory(run_dir)
                  private_roots.ensure_private_directory(log_path.parent)
                  try:
                      if stage == "vitest":
                          with case_path.open("x") as case:
                              case.write("import { test, expect } from 'vitest';\n"
                                         "test('synthetic diagnostic failure', () => {\n"
                                         "  expect('PRIVATE-FAULT-SENTINEL').toBe('expected');\n"
                                         "});\n")
                      else:
                          changed, count = re.subn(
                              rb"--quiet: #[a-fA-F0-9]{6};", b"--quiet: #111416;", original_css,
                          )
                          if count != 1:
                              sys.exit(2)
                          stylesheet.write_bytes(changed)
                      settle = {}
                      provenance = {}
                      with release_floor.configured_floor(root, 7200):
                          observed_code, observed_duration = run_gates._run(
                              web_gate.argv, cwd=repo / web_gate.cwd, env=env, timeout=7200,
                              log_path=log_path, provenance=True, settle_report=settle,
                              provenance_report=provenance,
                          )
                      proof = {
                          "headBefore": summary["sourceSha"], "headAfter": summary["sourceSha"],
                          "workingTreeDigestBefore": "a" * 64, "workingTreeDigestAfter": "a" * 64,
                          "phaseDiffSha256Before": "b" * 64, "phaseDiffSha256After": "b" * 64,
                      }
                      gate = {
                          **proof, "name": "web-tests", "status": "failed",
                          "argv": list(web_gate.argv), "cwd": web_gate.cwd, "exitCode": observed_code,
                          "durationSeconds": observed_duration,
                          "log": "logs/web-tests.log",
                          "logSha256": ci_floor._private_file_sha256(log_path),
                      }
                      if settle:
                          gate["naturalExitSettle"] = settle
                      if provenance:
                          gate["provenance"] = provenance
                      names = ci_floor.EXPECTED_GATE_NAMES
                      boundary = names.index("web-tests")
                      receipt = {
                          **proof, "schemaVersion": 1, "label": run_dir.name, "decision": "failed",
                          "gates": [
                              gate if i == boundary else {
                                  **proof, "name": name, "status": "passed" if i < boundary else "unreached",
                              }
                              for i, name in enumerate(names)
                          ],
                      }
                      private_roots.atomic_write_private(
                          run_dir / "receipt.json", json.dumps(receipt).encode() + b"\n",
                      )
                      result = ci_floor._describe_runner_failure(
                          root, run_dir.name, validated_failed_receipt=receipt,
                      )
                      hints = result.get("webFailureSignals", [])
                      valid_signals = {"test-failure", "timeout", "unhandled-error", "contrast-rule"}
                      safe_hints = sorted(set(hints) & valid_signals)
                      subcommand = result.get("webFailedSubcommand")
                      subcommand = subcommand if subcommand in {"vitest", "contrast"} else "unknown"
                      contrast_after_vitest_failure = (stage == "vitest" and
                          b"contrast (WCAG AA): 20 token pairs pass" in log_path.read_bytes())
                      passed = (
                          observed_code == 1 and subcommand == stage and signal in safe_hints
                          and not contrast_after_vitest_failure
                          and "PRIVATE-FAULT-SENTINEL" not in json.dumps(result)
                      )
                      summaries.append({
                          "scenario": stage, "gateExitCode": observed_code, "failedSubcommand": subcommand,
                          "signals": safe_hints, "expectedOutcome": passed,
                      })
                      faults_ok = faults_ok and passed
                  finally:
                      if stage == "vitest":
                          case_path.unlink(missing_ok=True)
                      else:
                          stylesheet.write_bytes(original_css)
              summary["syntheticFailureChecks"] = summaries
          (root / "web-probe-summary.json").write_text(json.dumps(summary, sort_keys=True) + "\n")
          sys.exit(1 if code or not faults_ok else 0)
          PY
          result=$?
          set -e
          if [[ -f "$PROBE_ROOT/web-probe-summary.json" ]]; then
            cat "$PROBE_ROOT/web-probe-summary.json"
          else
            echo "Probe stopped before a sanitized summary was available."
          fi
          exit "$result"
      - name: Upload sanitized probe summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-floor-probe-summary
          path: ${{ runner.temp }}/xf/web-probe-summary.json
          if-no-files-found: error
          retention-days: 14
