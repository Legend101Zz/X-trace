name: lane

# Fast per-push CI for agent lane branches (ultra/**, not ultra/campaign/**). Path-filtered suites; every run
# emits a machine-readable summary.json artifact. Public logs carry only allowlisted facts (see tools/qa/lane_run.py).
on:
  push:
    branches:
      - "ultra/**"
      - "!ultra/campaign/**"
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to force (all runs every suite)
        type: choice
        default: all
        options: [all, meta, rust, java, node, web, tui]

permissions:
  contents: read

concurrency:
  group: lane-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      meta: ${{ steps.plan.outputs.meta }}
      rust: ${{ steps.plan.outputs.rust }}
      java: ${{ steps.plan.outputs.java }}
      node: ${{ steps.plan.outputs.node }}
      web: ${{ steps.plan.outputs.web }}
      tui: ${{ steps.plan.outputs.tui }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select suites from the changed paths
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || '' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main || true
          mkdir -p "$RUNNER_TEMP/lane-plan"
          python3 -B tools/qa/lane_suites.py --repo "$GITHUB_WORKSPACE" --head "$GITHUB_SHA" \
            --before "$BEFORE" --base-ref origin/main --force "$FORCE" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/lane-plan/plan.json"
          cat "$RUNNER_TEMP/lane-plan/plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lane-plan
          path: ${{ runner.temp }}/lane-plan/plan.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  meta:
    needs: plan
    if: needs.plan.outputs.meta == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Workflow structure lint
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.qa.lane_run run --suite meta --step workflow-lint \
            --out "$RUNNER_TEMP/lane-frag" -- python3 -B -m tools.qa.workflow_lint .github/workflows/ci.yml .github/workflows/package.yml .github/workflows/lane.yml .github/workflows/campaigns.yml
      - name: Lane tool unit tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.qa.lane_run run --suite meta --step qa-unit-tests --min-passed 1 \
            --out "$RUNNER_TEMP/lane-frag" -- python3 -B -m unittest discover -s tools/qa -p "test_*.py"
      - name: Campaign library unit tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.qa.lane_run run --suite meta --step campaign-lib-unit-tests --min-passed 1 \
            --out "$RUNNER_TEMP/lane-frag" -- python3 -B -m unittest discover -s campaigns/lib -p "test_*.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lane-frag-meta
          path: ${{ runner.temp }}/lane-frag
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  rust:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NPM_CONFIG_CACHE: /tmp/xtrace-npm-cache
      PLAYWRIGHT_BROWSERS_PATH: /tmp/xtrace-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            adapters/java/build.gradle.kts
            adapters/java/settings.gradle.kts
            adapters/java/gradle.lockfile
            adapters/java/*/build.gradle.kts
            adapters/java/*/gradle.lockfile
            adapters/java/gradle/verification-metadata.xml
            adapters/java/gradle/wrapper/gradle-wrapper.properties
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache npm and Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /tmp/xtrace-npm-cache
            /tmp/xtrace-playwright
          key: ${{ runner.os }}-lane-rust-npm-${{ hashFiles('web/app/package-lock.json', 'adapters/node/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lane-rust-npm-
      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lane-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-lane-cargo-
      - name: Install system prerequisites for the browser journeys
        run: |
          sudo apt-get update
          sudo apt-get install --yes lsof
      - name: Build the Node, web, and Java adapters the Rust tests drive
        # Same prerequisites as the ci.yml gates job: the Rust workspace tests launch the built
        # adapters, the embedded viewer and Chromium.
        run: |
          npm ci --prefix adapters/node
          npm run build --prefix adapters/node
          npm ci --prefix web/app
          (cd web/app && npx playwright install --with-deps chromium)
          (cd adapters/java && ./gradlew --dependency-verification strict clean testClasses installDist agentDist fixtureBootJar)
      - name: Admit private test scratch before cargo tests
        # Product storage refuses a data directory under a world-writable ancestor such as /tmp, so Rust
        # tests that run `init` need a TMPDIR below the runner's private temp directory (ci.yml shape).
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP:?}/xt"
          [ "${#root}" -le 40 ] || { echo "private root path too long"; exit 1; }
          mkdir -m 700 "$root" "$root/tmp" "$root/priv"
          echo "TMPDIR=$root/tmp" >> "$GITHUB_ENV"
          echo "XTRACE_TEST_PRIVATE_SCRATCH=$root/priv" >> "$GITHUB_ENV"
      - name: cargo fmt
        run: |
          python3 -B -m tools.qa.lane_run run --suite rust --step fmt --out "$RUNNER_TEMP/lane-frag" -- \
            cargo fmt --all --check
      - name: cargo clippy
        run: |
          python3 -B -m tools.qa.lane_run run --suite rust --step clippy --out "$RUNNER_TEMP/lane-frag" -- \
            cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: |
          python3 -B -m tools.qa.lane_run run --suite rust --step test --min-passed 1 --out "$RUNNER_TEMP/lane-frag" -- \
            cargo test --workspace --all-features --no-fail-fast
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lane-frag-rust
          path: ${{ runner.temp }}/lane-frag
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  java:
    needs: plan
    if: needs.plan.outputs.java == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21, 25]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: JDK 17 for the pinned Gradle toolchain
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            adapters/java/build.gradle.kts
            adapters/java/settings.gradle.kts
            adapters/java/gradle.lockfile
            adapters/java/*/build.gradle.kts
            adapters/java/*/gradle.lockfile
            adapters/java/gradle/verification-metadata.xml
            adapters/java/gradle/wrapper/gradle-wrapper.properties
      - name: Matrix JDK (runs Gradle and the test JVM)
        if: matrix.java-version != 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Gradle test
        # Compilation uses the pinned JDK 17 toolchain (JAVA_HOME_17_X64); the test JVM is the matrix JDK, enforced
        # by tools/qa/lane-test-jdk.init.gradle, which fails the build if Gradle runs on any other JDK.
        env:
          LANE_JDK: ${{ matrix.java-version }}
        run: |
          python3 -B -m tools.qa.lane_run run --suite java --variant "${{ matrix.java-version }}" --step gradle-test \
            --cwd adapters/java --out "$RUNNER_TEMP/lane-frag" -- \
            ./gradlew --dependency-verification strict "-Porg.gradle.java.installations.paths=$JAVA_HOME_17_X64" \
            -I "$GITHUB_WORKSPACE/tools/qa/lane-test-jdk.init.gradle" clean test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lane-frag-java-${{ matrix.java-version }}
          path: ${{ runner.temp }}/lane-frag
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  node:
    needs: plan
    if: needs.plan.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NPM_CONFIG_CACHE: /tmp/xtrace-npm-cache
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/xtrace-npm-cache
          key: ${{ runner.os }}-lane-node${{ matrix.node-version }}-${{ hashFiles('adapters/node/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lane-node${{ matrix.node-version }}-
      - name: Install exact workspace dependencies
        run: npm ci --prefix adapters/node
      - name: Generated code check
        run: |
          python3 -B -m tools.qa.lane_run run --suite node --variant "${{ matrix.node-version }}" --step generate-check \
            --out "$RUNNER_TEMP/lane-frag" -- npm run generate:check --prefix adapters/node
      - name: Typecheck and unit tests
        run: |
          python3 -B -m tools.qa.lane_run run --suite node --variant "${{ matrix.node-version }}" --step test \
            --out "$RUNNER_TEMP/lane-frag" -- npm test --prefix adapters/node
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lane-frag-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/lane-frag
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  web:
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NPM_CONFIG_CACHE: /tmp/xtrace-npm-cache
      PLAYWRIGHT_BROWSERS_PATH: /tmp/xtrace-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Cache npm and Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /tmp/xtrace-npm-cache
            /tmp/xtrace-playwright
          key: ${{ runner.os }}-lane-web-${{ hashFiles('web/app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lane-web-
      - name: Install dependencies and Chromium
        run: |
          npm ci --prefix web/app
          (cd web/app && npx playwright install --with-deps chromium)
      - name: Typecheck
        run: |
          python3 -B -m tools.qa.lane_run run --suite web --step typecheck --out "$RUNNER_TEMP/lane-frag" -- \
            npm run typecheck --prefix web/app
      - name: Unit tests
        run: |
          python3 -B -m tools.qa.lane_run run --suite web --step unit-tests --out "$RUNNER_TEMP/lane-frag" -- \
            npm test --prefix web/app
      - name: API and embedded asset checks
        run: |
          python3 -B -m tools.qa.lane_run run --suite web --step check-api --out "$RUNNER_TEMP/lane-frag" -- \
            npm run check:api --prefix web/app
          python3 -B -m tools.qa.lane_run run --suite web --step check-embedded --out "$RUNNER_TEMP/lane-frag" -- \
            npm run check:embedded --prefix web/app
      - name: Playwright Chromium launch smoke
        # The full Playwright browser journeys run from the Rust workspace tests (rust suite).
        run: |
          python3 -B -m tools.qa.lane_run run --suite web --step playwright-launch --out "$RUNNER_TEMP/lane-frag" \
            --cwd web/app -- node -e "const {chromium}=require('@playwright/test');(async()=>{const b=await chromium.launch();await b.close();})().catch(()=>process.exit(1))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lane-frag-web
          path: ${{ runner.temp }}/lane-frag
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  tui:
    needs: plan
    if: needs.plan.outputs.tui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Admit private test scratch before cargo tests
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP:?}/xt"
          mkdir -m 700 "$root" "$root/tmp" "$root/priv"
          echo "TMPDIR=$root/tmp" >> "$GITHUB_ENV"
          echo "XTRACE_TEST_PRIVATE_SCRATCH=$root/priv" >> "$GITHUB_ENV"
      - name: TUI PTY tests
        run: |
          python3 -B -m tools.qa.lane_run run --suite tui --step pty-tests --min-passed 1 --out "$RUNNER_TEMP/lane-frag" -- \
            cargo test -p xtrace-tui --all-features --no-fail-fast
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lane-frag-tui
          path: ${{ runner.temp }}/lane-frag
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  summary:
    needs: [plan, meta, rust, java, node, web, tui]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: lane-plan
          path: ${{ runner.temp }}/lane-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: lane-frag-*
          merge-multiple: true
          path: ${{ runner.temp }}/lane-frag
      - name: Merge suite results into summary.json
        run: |
          mkdir -p "$RUNNER_TEMP/lane-frag" "$RUNNER_TEMP/lane-summary"
          python3 -B -m tools.qa.lane_run merge \
            --plan "$RUNNER_TEMP/lane-plan/plan.json" --frag-dir "$RUNNER_TEMP/lane-frag" \
            --out "$RUNNER_TEMP/lane-summary/summary.json" --step-summary "$GITHUB_STEP_SUMMARY" \
            --job-result "plan=${{ needs.plan.result }}" --job-result "meta=${{ needs.meta.result }}" --job-result "rust=${{ needs.rust.result }}" \
            --job-result "java=${{ needs.java.result }}" --job-result "node=${{ needs.node.result }}" \
            --job-result "web=${{ needs.web.result }}" --job-result "tui=${{ needs.tui.result }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lane-summary
          path: ${{ runner.temp }}/lane-summary/summary.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
