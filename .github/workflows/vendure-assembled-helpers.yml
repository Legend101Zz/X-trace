          from tools.release.private_roots import atomic_write_private
          from tools.qa.unittest_run import StructuredRunner
          root = pathlib.Path(os.environ['PROOF'])
          sys.path.insert(0, str(pathlib.Path('packaging/test').resolve()))
          import test_verify_package
          expected = ['test_manifest_lists_every_required_component', 'test_version_matches_package_name', 'test_release_trust_claim_is_rejected', 'test_modified_and_unlisted_files_are_detected', 'test_payload_sums_drift_is_detected', 'test_payload_row_drift_is_caught_by_payload_hashes_even_when_the_manifest_agrees', 'test_archive_with_a_fifo_member_is_rejected', 'test_binary_without_xtp_protocol_line_fails', 'test_archive_input_and_unsafe_members', 'test_schema_version_reported_equals_migrations_latest', 'test_tui_stub_binary_fails_tui_implemented_but_registers_the_subcommand', 'test_binary_that_does_not_report_schema_version_fails']
          assert len(set(expected)) == len(expected) == 12
          observed = unittest.defaultTestLoader.getTestCaseNames(test_verify_package.VerifyPackage)
          suite = unittest.defaultTestLoader.loadTestsFromModule(test_verify_package)
          exact = sorted(expected)==observed and suite.countTestCases()==12
          counts = None
          passed = False
          if exact:
              with (root/'logs/verifier-suite.private').open('x') as log:
                  result = StructuredRunner(stream=log,verbosity=2).run(suite)
              counts = result.summary()['counts']
              passed = result.wasSuccessful() and counts==dict(testsRun=12,failures=0,errors=0,skipped=0,expectedFailures=0,unexpectedSuccesses=0)
          row = dict(status='passed' if passed else 'failed', counts=counts, exactCaseInventory=exact)
          atomic_write_private(root/'private/verifier.json',(json.dumps(row,sort_keys=True)+'\n').encode())
          raise SystemExit(0 if passed else 1)
          PY
      - name: Publish counts from reached stages
        id: counts
        if: ${{ always() && steps.admission.outcome == 'success' }}
        env:
          PREPARATION_OUTCOME: ${{ steps.preparation_cases.outcome }}
          FIXTURE_OUTCOME: ${{ steps.fixture_cases.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence_cases.outcome }}
          SERVER_OUTCOME: ${{ steps.server_cases.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle_cases.outcome }}
          COHORT_OUTCOME: ${{ steps.cohort_cases.outcome }}
          NODEPACK_OUTCOME: ${{ steps.nodepack_cases.outcome }}
          VERIFIER_OUTCOME: ${{ steps.verifier_cases.outcome }}
          PYTHON_OUTCOME: ${{ steps.python_cases.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'PY'
          import json,os,pathlib,subprocess
          from tools.release.private_roots import atomic_write_private, read_private_json
          root = pathlib.Path(os.environ['PROOF'])
          def stage(label,outcome,expected_fields):
              if outcome == 'skipped':
                  return dict(status='not-reached',counts=None)
              if outcome not in ('success','failure','cancelled'):
                  raise ValueError('unrecognized outcome')
              file = root/'private'/(label+'.json')
              if not file.exists():
                  if outcome == 'success': raise ValueError('missing passing receipt')
                  return dict(status='receipt-unavailable',counts=None)
              row = read_private_json(file,maximum_bytes=16*1024)
              keys = ({'status','counts','exactPassingCaseInventory','exitCode'} if label in ('preparation', 'fixture', 'evidence', 'server', 'lifecycle', 'cohort')
                      else {'status','counts','exactCaseInventory'})
              if set(row)!=keys or row['status'] not in ('passed','failed'): raise ValueError('invalid receipt')
              exact = row['exactPassingCaseInventory' if label in ('preparation', 'fixture', 'evidence', 'server', 'lifecycle', 'cohort') else 'exactCaseInventory']
              if type(exact) is not bool: raise ValueError('invalid census')
              if label in ('preparation', 'fixture', 'evidence', 'server', 'lifecycle', 'cohort') and (type(row['exitCode']) is not int or not -255<=row['exitCode']<=255): raise ValueError('invalid exit')
              counts = row['counts']
              if counts is not None and (not isinstance(counts,dict) or set(counts)!=set(expected_fields)
                   or any(type(x) is not int or not 0<=x<=99999 for x in counts.values())): raise ValueError('invalid counts')
              if row['status']=='passed' and (not exact or counts!=expected_fields or (label in ('preparation', 'fixture', 'evidence', 'server', 'lifecycle', 'cohort') and row['exitCode']!=0)):
                  raise ValueError('passing census mismatch')
              if (outcome=='success')!=(row['status']=='passed'): raise ValueError('stage outcome mismatch')
              return row
          preparation = stage('preparation',os.environ['PREPARATION_OUTCOME'],{'tests':27,'pass':27,'fail':0,'cancelled':0,'skipped':0,'todo':0})
          fixture = stage('fixture',os.environ['FIXTURE_OUTCOME'],{'tests':20,'pass':20,'fail':0,'cancelled':0,'skipped':0,'todo':0})
          python = stage('python',os.environ['PYTHON_OUTCOME'],dict(testsRun=7,failures=0,errors=0,skipped=0,expectedFailures=0,unexpectedSuccesses=0))
          evidence = stage('evidence',os.environ['EVIDENCE_OUTCOME'],{'tests': 5, 'pass': 5, 'fail': 0, 'cancelled': 0, 'skipped': 0, 'todo': 0})
          server = stage('server',os.environ['SERVER_OUTCOME'],{'tests': 4, 'pass': 4, 'fail': 0, 'cancelled': 0, 'skipped': 0, 'todo': 0})
          lifecycle = stage('lifecycle',os.environ['LIFECYCLE_OUTCOME'],{'tests': 13, 'pass': 13, 'fail': 0, 'cancelled': 0, 'skipped': 0, 'todo': 0})
          cohort = stage('cohort',os.environ['COHORT_OUTCOME'],{'tests': 12, 'pass': 12, 'fail': 0, 'cancelled': 0, 'skipped': 0, 'todo': 0})
          nodepack = stage('nodepack',os.environ['NODEPACK_OUTCOME'],dict(testsRun=1,failures=0,errors=0,skipped=0,expectedFailures=0,unexpectedSuccesses=0))
          verifier = stage('verifier',os.environ['VERIFIER_OUTCOME'],dict(testsRun=12,failures=0,errors=0,skipped=0,expectedFailures=0,unexpectedSuccesses=0))
          clean = not subprocess.check_output(['git','status','--porcelain','--untracked-files=all'])
          passed = all(s['status']=='passed' for s in (preparation,fixture,python,evidence,server,lifecycle,cohort,nodepack,verifier)) and clean
          receipt = dict(schemaVersion=1,kind='vendure-installed-assembly-helpers',status='passed' if passed else 'failed',
              releaseAcceptance=False,sourceSha=os.environ['PRODUCT'],sourceTree=os.environ['PRODUCT_TREE'],sourceParent=os.environ['PRODUCT_PARENT'],
              sourcePatchSha256=os.environ['PATCH_SHA256'],wrapperSha=os.environ['GITHUB_SHA'],runId=int(os.environ['GITHUB_RUN_ID']),
              attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),sourceClean=clean,preparation=preparation,fixture=fixture,python=python,
              evidence=evidence,server=server,lifecycle=lifecycle,cohort=cohort,nodepack=nodepack,verifier=verifier,
              applicationBuild='not-run',applicationSeed='not-run',installedApplication='not-run',campaign='not-run')
          atomic_write_private(root/'safe/counts.json',(json.dumps(receipt,sort_keys=True)+'\n').encode())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: print('ready=true',file=out)
          raise SystemExit(0 if passed else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.counts.outputs.ready == 'true' }}
        with:
          name: vendure-assembled-helper-counts
          path: ${{ env.PROOF }}/safe/counts.json
          if-no-files-found: error
          retention-days: 7
