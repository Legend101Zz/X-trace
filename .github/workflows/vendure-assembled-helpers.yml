name: Vendure installed assembly source helper checks
on:
  push:
    branches: [codex/proof-vendure-assembled-helpers-125]
permissions:
  contents: read
jobs:
  helpers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT: '0b34e21ee318b3e46f3d1a81317a1f6478b34866'
      PRODUCT_TREE: 'c398e5cbd8a49a7778cd10fda14703506a9293e7'
      PRODUCT_PARENT: 'bf043bc5d2590b9d0b0cece31a5f1f45663b33b0'
      PATCH_SHA256: 'cabc6b9e40e3ba14ac8c95fed9c8fda842ec2970dfaedfe9193125c77822df3d'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Verify wrapper and exact source before selecting the product
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = 'Legend101Zz/X-trace'
          test "$GITHUB_REF" = 'refs/heads/codex/proof-vendure-assembled-helpers-125'
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$PRODUCT"
          test "$(git show -s --format=%P "$PRODUCT")" = "$PRODUCT_PARENT"
          test "$(git rev-parse "$PRODUCT^{tree}")" = "$PRODUCT_TREE"
          workflow='.github/workflows/vendure-assembled-helpers.yml'
          test "$(git diff --name-status --no-renames "$PRODUCT" HEAD)" = $'A\t'"$workflow"
          test "$(git ls-tree HEAD -- "$workflow" | cut -d' ' -f1)" = 100644
          test "$(git diff --no-ext-diff --no-textconv --no-color --binary --full-index "$PRODUCT_PARENT" "$PRODUCT" | sha256sum | cut -d' ' -f1)" = "$PATCH_SHA256"
          test "$(git rev-parse "$PRODUCT:packaging/build.py")" = '1b9b190b727257b0703b43c0a019a66d7e48a91f'
          test "$(git rev-parse "$PRODUCT:packaging/test/test_node_pack.py")" = 'b8d31170e043846ca195338c054751d6e3bf2652'
          test "$(git rev-parse "$PRODUCT:packaging/test/test_verify_package.py")" = '5a0843f61dba8b63881b59be4d58f5044169fcbc'
          test "$(git rev-parse "$PRODUCT:packaging/verify_package.py")" = '9771db631701c46713d96c7cba70b77bdb94fa47'
          git checkout --detach --quiet "$PRODUCT"
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test -z "$(git status --porcelain --untracked-files=all)"
          proof="$RUNNER_TEMP/vendure-assembly-helpers-125"
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$proof"
          mkdir -m 700 "$proof/logs" "$proof/private" "$proof/safe"
          printf '%s\n' "PROOF=$proof" "TMPDIR=$proof/tmp" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        id: node_setup
        with:
          node-version: 24.21.0
      - name: Check all 27 ordinary preparation helper cases
        id: preparation_cases
        if: ${{ always() && steps.admission.outcome == 'success' && steps.node_setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(node -p process.versions.node)" = '24.21.0'
          python3 -B - <<'PY' >"$PROOF/logs/preparation-driver.stdout" 2>"$PROOF/logs/preparation-driver.stderr"
          import json, os, pathlib, re, subprocess
          from tools.release.private_roots import atomic_write_private
          root = pathlib.Path(os.environ['PROOF'])
          expected = [
              'staging uses the tracked adapted lock without changing private scaffold inputs',
              'staging replaces a shared scaffold entry without modifying its other link or mode',
              'seed output requires a fresh destination and preserves existing bytes',
              'changed dependencies and source bytes fail without being repaired',
              'extra compiled sources and linked inputs are rejected',
              'a completed workspace cannot be restaged over its build identity',
              'alternate CLI build configurations fail without removing their contents',
              'compilation claims a fresh dist and refuses stale output before either compiler writes',
              'a redirected compiler output or application root cannot change another directory',
              'normal three-file output identity excludes migrations and every other dist artifact',
              'linked, directory and special dist entries are refused without following them',
              'only the exact unchanged seed helper is admitted after the build phase',
              'rechecking a sealed build refuses later migrations despite unchanged entry hashes',
              'all declared build provenance must survive through seed admission',
              'seed metadata is a fresh closed digest-only projection',
              'added top-level and nested private seed fields cannot enter baseline metadata',
              'seed projection refuses malformed digests, counts, identities and bindings',
              'well-formed asset counts and tree hashes must match the independent archive observation',
              'database restore consumes the exact admitted dump bound to both baseline hashes',
              'a restore diagnostic cannot serialize private dump data into a failed baseline receipt',
              'changed preparation before startup rejects both the start and the restore',
              "seed admission requires the campaign's private regular dump and receipt",
              'the fresh workspace is separate from an existing checkout and cannot be reused or redirected',
              'only a zero generator exit lets preparation continue',
              'private errors during initial seed admission are reported with fixed categories',
              'private verifier and parsing errors during revalidation reach neither startup nor restore',
              'database restore refuses a missing or name-only startup identity',
          ]
          assert len(expected) == len(set(expected)) == 27
          out = root/'logs/preparation.tap'
          with out.open('xb') as stdout, (root/'logs/preparation.stderr').open('xb') as stderr:
              code = subprocess.run(['node','--test','--test-reporter=tap','campaigns/node/vendure/harness/preparation.test.mjs'],
                                    stdin=subprocess.DEVNULL,stdout=stdout,stderr=stderr,check=False).returncode
          counts = None
          exact = False
          if out.stat().st_size <= 4 * 1024 * 1024:
              tap = out.read_text(encoding='utf8', errors='replace')
              fields = ('tests','pass','fail','cancelled','skipped','todo')
              matched = {key: re.findall(r'(?m)^# ' + key + r' ([0-9]{1,5})[ \t]*$',tap) for key in fields}
              if all(len(values)==1 for values in matched.values()):
                  counts = {key:int(values[0]) for key,values in matched.items()}
              rows = re.findall(r'(?m)^(ok|not ok) ([0-9]{1,5}) - ([^\r\n]+)$',tap)
              exact = rows == [('ok',str(i),name) for i,name in enumerate(expected,1)]
          passed = code==0 and exact and counts=={'tests':27,'pass':27,'fail':0,'cancelled':0,'skipped':0,'todo':0}
          row = dict(status='passed' if passed else 'failed', exitCode=code, counts=counts, exactPassingCaseInventory=exact)
          atomic_write_private(root/'private/preparation.json',(json.dumps(row,sort_keys=True)+'\n').encode())
          raise SystemExit(0 if passed else 1)
          PY
