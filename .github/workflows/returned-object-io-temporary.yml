name: returned-object-io-temporary
on:
  push:
    branches: [codex/returned-object-io-78]
permissions:
  contents: read
jobs:
  singleton:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Admit the normal private scratch root
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP:?}/xf"
          [ "${#root}" -le 40 ]
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root" \
            >"${RUNNER_TEMP:?}/xtrace-singleton-setup.log" 2>&1
          mkdir -m 700 "$root/c" "$root/tmp/t" "$root/tmp/p"
      - name: Run exactly one existing singleton workload
        id: workload
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP:?}/xf"
          export CARGO_TARGET_DIR="$root/cargo-target"
          export TMPDIR="$root/tmp/t" TMP="$root/tmp/t" TEMP="$root/tmp/t"
          export XTRACE_TEST_SCRATCH_ROOT="$root/tmp/t" XTRACE_TEST_PRIVATE_SCRATCH="$root/tmp/p"
          export XTRACE_TEST_CARDINALITY_SCRATCH="$root/c"
          test=recording_port::tests::two_thousand_forty_eight_singleton_batches_publish_only_two_segments
          log="$root/singleton.log"
          if cargo test --locked -p xtrace-store --lib --all-features "$test" -- --exact >"$log" 2>&1 \
            && grep -Fxq "test $test ... ok" "$log" \
            && grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$log"; then
            echo 'Singleton workload: passed.'
          else
            echo 'Singleton workload: failed or unverified.'
            exit 1
          fi
      - name: Encrypt failed workload log for the private evidence recipient
        id: encrypt
        if: ${{ failure() && steps.workload.outcome == 'failure' }}
        env:
          EVIDENCE_CERT: 
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP:?}/xf"
          {
            printf '%s' "$EVIDENCE_CERT" | base64 -d > "$root/evidence.crt"
            openssl cms -encrypt -binary -aes-256-cbc -outform DER \
              -in "$root/singleton.log" -out "$root/singleton-failure.enc" "$root/evidence.crt"
            test -s "$root/singleton-failure.enc"
          } > "$root/encryption.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ failure() && steps.workload.outcome == 'failure' && steps.encrypt.outcome == 'success' }}
        with:
          name: private-singleton-failure-ciphertext
          path: ${{ runner.temp }}/xf/singleton-failure.enc
          if-no-files-found: error
          retention-days: 1
