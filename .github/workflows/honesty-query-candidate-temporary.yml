name: honesty-query-candidate-temporary
on:
  push:
    branches: [codex/honesty-query-candidate-123]
permissions:
  contents: read
jobs:
  jdk17-focused-honesty-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Prepare owner-private diagnostic directories
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP:?}/xf"
          [ "${#root}" -le 40 ]
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/diag" "$root/c" "$root/tmp/t" "$root/tmp/p"
          echo "XTRACE_HONESTY_QUERY_PAIR_ROOT=$root" >> "$GITHUB_ENV"
      - name: Compile baseline and candidate separately before timed tests
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_HONESTY_QUERY_PAIR_ROOT"
          base=dd29ffa29e6c064792bfa3a8e697ad34212aad9c
          if ! (
            git merge-base --is-ancestor "$base" HEAD &&
            git worktree add --detach "$root/base" "$base" &&
            cd "$root/base" &&
            CARGO_TARGET_DIR="$root/target-base" cargo test --locked -p xtrace-store --lib --all-features --no-run
          ) > "$root/diag/build-base.log" 2>&1; then
            echo "Baseline preparation failed"
            exit 1
          fi
          if ! CARGO_TARGET_DIR="$root/cargo-target" cargo test --locked -p xtrace-store --lib --all-features --no-run > "$root/diag/build-candidate.log" 2>&1; then
            echo "Candidate preparation failed"
            exit 1
          fi
      - name: Verify real store aggregate behavior
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_HONESTY_QUERY_PAIR_ROOT"
          export TMPDIR="$root/tmp/t" TMP="$root/tmp/t" TEMP="$root/tmp/t"
          export XTRACE_TEST_PRIVATE_SCRATCH="$root/tmp/p" CARGO_TARGET_DIR="$root/cargo-target"
          if ! cargo test --locked -p xtrace-store --lib --all-features \
            frame_honesty_ > "$root/diag/correctness.log" 2>&1; then
            echo "Frame honesty store checks failed"
            exit 1
          fi
          grep -qx 'test recording_port::tests::frame_honesty_aggregate_counts_known_and_unknown_bits_and_empty_recordings ... ok' "$root/diag/correctness.log"
          grep -qx 'test recording_port::tests::frame_honesty_counts_are_exact_and_unavailable_for_legacy_frames ... ok' "$root/diag/correctness.log"
          grep -qx 'test recording_store::tests::frame_honesty_aggregate_preserves_signed_sql_masks ... ok' "$root/diag/correctness.log"
      - name: Compare baseline and candidate on the unchanged focused workload
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_HONESTY_QUERY_PAIR_ROOT"
          export TMPDIR="$root/tmp/t" TMP="$root/tmp/t" TEMP="$root/tmp/t"
          export XTRACE_TEST_SCRATCH_ROOT="$root/tmp/t" XTRACE_TEST_PRIVATE_SCRATCH="$root/tmp/p"
          export XTRACE_TEST_CARDINALITY_SCRATCH="$root/c"
          focused=recording_port::tests::singleton_acknowledgements_at_focused_cap_recover_with_bounded_segments_and_pages
          run_one() {
            local variant="$1" test="$2" source="$3" target="$4"
            local directory="$root/diag/$variant"
            mkdir -m 700 "$directory" "$directory/frag"
            if ! (
              cd "$source" &&
              XTRACE_CI_PRIVATE_ROOT="$directory" CARGO_TARGET_DIR="$target" \
                cargo test --locked -p xtrace-store --lib --all-features "$test" -- --exact
            ) > "$directory/test.log" 2>&1; then
              echo "Cardinality comparison failed for $variant"
              return 1
            fi
            if ! grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$directory/test.log"; then
              echo "Expected one passing cardinality test for $variant"
              return 1
            fi
            echo "Completed $variant"
          }
          run_one baseline "$focused" "$root/base" "$root/target-base"
          run_one candidate "$focused" "$GITHUB_WORKSPACE" "$root/cargo-target"
          python3 -B - "$root/diag" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib
          import sys
          from tools.qa.store_profiles import collect

          root = pathlib.Path(sys.argv[1])
          profile, admissions = "focused-singletons", 131072
          baseline, candidate = (collect(root / mode / "frag")[profile]
                                 for mode in ("baseline", "candidate"))
          for entry in (baseline, candidate):
              assert entry["lastReport"]["state"] == "returned"
              assert entry["workload"] == {
                  "expected_admissions": admissions, "counted_journal_syncs": 1,
              }
              assert entry["lastReport"]["completed"] == admissions

          def seconds(ns):
              return ns / 1_000_000_000

          base, changed = (seconds(entry["lastReport"]["elapsed_ns"])
                           for entry in (baseline, candidate))
          print(f"JDK17 focused paired cardinality comparison")
          print(f"- Baseline {base:.3f}s; candidate {changed:.3f}s; paired difference "
                f"{changed - base:+.3f}s ({(changed - base) / base:+.2%}).")
          for phase in ("read_finalize", "checkpoint_publish", "connection_file_admission"):
              before, after = (entry["phases"][phase] for entry in (baseline, candidate))
              print(f"- {phase}: baseline {seconds(before['total_ns']):.3f}s, "
                    f"candidate {seconds(after['total_ns']):.3f}s.")
          print("- One baseline-first pair on the same host. The difference includes run-order variance.")
          PY
      - name: Encrypt private diagnostics
        if: always() && env.XTRACE_HONESTY_QUERY_PAIR_ROOT != ''
        env:
          EVIDENCE_CERT: 
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_HONESTY_QUERY_PAIR_ROOT"
          printf '%s' "$EVIDENCE_CERT" | base64 -d > "$root/evidence.crt"
          tar -C "$root" -cf - diag | openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER -out "$root/honesty-query-pair.enc" "$root/evidence.crt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.XTRACE_HONESTY_QUERY_PAIR_ROOT != ''
        with:
          name: encrypted-honesty-query-pair
          path: ${{ env.XTRACE_HONESTY_QUERY_PAIR_ROOT }}/honesty-query-pair.enc
          if-no-files-found: error
          retention-days: 1
