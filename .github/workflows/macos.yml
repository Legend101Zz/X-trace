name: macos

on:
  workflow_dispatch:
  push:
    branches:
      - "wave/**"
      - "ultra/rc-*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  XTRACE_CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Preserve the original macOS job's release-tool-tests prerequisite on the same source.
  release-tool-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux descriptor inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes lsof
      - name: Select private root path
        # The runner context is not available in job-level `env`; derive the
        # path from the shell-level runner variable and export it here.
        run: |
          # Short on purpose: the product's default init idempotency key is `xtrace-init-<repo path>`
          # and is capped at 128 characters, and the Rust tests create repos under this root's tmp.
          # Every job runs on its own runner, so a fixed name cannot collide.
          root="${RUNNER_TEMP:?}/mt"
          [ "${#root}" -le 40 ] || { echo "private root path too long"; exit 1; }
          echo "XTRACE_CI_PRIVATE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Verify exact source and phase base
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor preflight-source \
            --repo "$GITHUB_WORKSPACE" \
            --phase-metadata evidence/v0.01/workflow.json \
            --expected-head "$XTRACE_CI_SOURCE_SHA"
      - name: Admit private scratch before test output
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor prepare-private-root --root "$XTRACE_CI_PRIVATE_ROOT"
      - name: Run the complete release tooling suite without skips
        run: |
          set +e
          umask 077
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor summarize-tests \
            --root "$XTRACE_CI_PRIVATE_ROOT" --repo "$GITHUB_WORKSPACE" --source-sha "$XTRACE_CI_SOURCE_SHA" \
            --log-file "$XTRACE_CI_PRIVATE_ROOT/release-tool-tests.log"
          result=$?
          set -e
          exit "$result"

  macos-arm64:
    # ADR 0006 section 2.3: hosted macOS arm64 evidence for cfg(unix), private storage, attach and packaging changes.
    # Every suite step has its own `if: !cancelled()`, so one failure never hides the others; none may fail and no
    # ignored or skipped test is accepted (--max-ignored 0). Rust, Java, Node and web steps print only allowlisted
    # facts (tools.qa.lane_run keeps raw output in a private log). prepare-private-root exports the scratch
    # environment (TMPDIR, TMP, TEMP, XTRACE_TEST_PRIVATE_SCRATCH, XTRACE_TEST_SCRATCH_ROOT) for every later step.
    # The ADR 0006 2.3 other-UID private-storage substitute (tools.qa.other_uid_negative) creates a second local user
    # on the runner (sudo is fine inside the hosted job), makes a real store with `xtrace init`, and requires that
    # the user reaches the store's parent but can neither list, read, write nor replace anything in the store, and
    # that no store entry has an ACL allow entry. Its ok-marker is checked by an `if: always()` step, so a skipped,
    # failed or store-less run fails the job.
    # NOT COVERED until broker code exists: other-UID broker negative (ADR 0006 addendum 2026-10-10, item 3)
    needs: release-tool-tests
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tuple: jdk17-node22
            java-version: 17
            node-version: 22
          - tuple: jdk21-node24
            java-version: 21
            node-version: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Select private root path
        run: |
          root="${RUNNER_TEMP:?}/mr"
          [ "${#root}" -le 40 ] || { echo "private root path too long"; exit 1; }
          echo "XTRACE_CI_PRIVATE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Put Homebrew OpenSSL 3 first on PATH
        # The macOS system openssl is LibreSSL; the release tooling preflight requires OpenSSL 3.
        run: |
          set -euo pipefail
          prefix="$(brew --prefix openssl@3)"
          test -x "$prefix/bin/openssl"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Verify exact source and architecture
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor preflight-source \
            --repo "$GITHUB_WORKSPACE" \
            --phase-metadata evidence/v0.01/workflow.json \
            --expected-head "$XTRACE_CI_SOURCE_SHA"
      - name: Admit private scratch before test output
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor prepare-private-root --root "$XTRACE_CI_PRIVATE_ROOT"
      - name: Run the complete release tooling suite without skips
        if: ${{ !cancelled() }}
        run: |
          set +e
          umask 077
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m tools.release.ci_floor summarize-tests \
            --root "$XTRACE_CI_PRIVATE_ROOT" --repo "$GITHUB_WORKSPACE" --source-sha "$XTRACE_CI_SOURCE_SHA" \
            --log-file "$XTRACE_CI_PRIVATE_ROOT/release-tool-tests.log"
          result=$?
          set -e
          exit "$result"
      - name: Node install (exact, npm ci)
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.lane_run run --suite node --variant "${{ matrix.node-version }}" --step install --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            npm ci --prefix adapters/node
      - name: Node protocol generation check
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.lane_run run --suite node --variant "${{ matrix.node-version }}" --step generate-check --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            npm run generate:check --prefix adapters/node
      - name: Node unit tests
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.lane_run run --suite node --variant "${{ matrix.node-version }}" --step test --min-passed 85 --max-ignored 0 --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            npm test --prefix adapters/node
      - name: Web install
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.lane_run run --suite web --variant "${{ matrix.node-version }}" --step install --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            bash -ec 'npm ci --prefix web/app && cd web/app && npx playwright install chromium'
      - name: Web typecheck
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.lane_run run --suite web --variant "${{ matrix.node-version }}" --step typecheck --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            npm run typecheck --prefix web/app
      - name: Web unit tests
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.lane_run run --suite web --variant "${{ matrix.node-version }}" --step unit-tests --min-passed 75 --max-ignored 0 --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            npm test --prefix web/app
      - name: Web check:api
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.lane_run run --suite web --variant "${{ matrix.node-version }}" --step check-api --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            npm run check:api --prefix web/app
      - name: Web check:embedded
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.lane_run run --suite web --variant "${{ matrix.node-version }}" --step check-embedded --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            npm run check:embedded --prefix web/app
      - name: Java strict Gradle build and tests
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.lane_run run --suite java --variant "${{ matrix.java-version }}" --step gradle --cwd adapters/java \
            --junit-glob "*/build/test-results/test/*.xml" --min-passed 190 --max-ignored 0 --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            ./gradlew --dependency-verification strict clean test installDist agentDist fixtureBootJar
      - name: cargo build (locked workspace)
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.lane_run run --suite rust --variant "${{ matrix.tuple }}" --step build --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            cargo build --locked --workspace --all-features
      - name: cargo test (locked workspace, no ignored tests)
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.lane_run run --suite rust --variant "${{ matrix.tuple }}" --step test --min-passed 1030 --max-ignored 0 --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            cargo test --locked --workspace --all-features --no-fail-fast
      - name: Packaged install journey (unattended)
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.lane_run run --suite package --variant "${{ matrix.tuple }}" --step journey --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            bash -ec '
              python3 packaging/build.py --out dist --platform macos-arm64
              sh packaging/install.sh verify-dist dist/macos-arm64
              root="$RUNNER_TEMP/xt-install"
              mkdir -m 700 "$root" "$root/tmp"
              TMPDIR="$root/tmp" sh packaging/test/install_test.sh dist/macos-arm64
              TMPDIR="$root/tmp" sh packaging/test/install_scratch_test.sh
            '
      - name: Other-UID setup (second local user on the hosted runner)
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.other_uid_negative create-user --user xtrother --created-marker "$XTRACE_CI_PRIVATE_ROOT/other-uid.created"
      - name: Other-UID store creation (real xtrace init)
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.lane_run run --suite security --variant "${{ matrix.tuple }}" --step other-uid-store --out "$XTRACE_CI_PRIVATE_ROOT/frag" -- \
            bash -ec '
              oid="$XTRACE_CI_PRIVATE_ROOT/oid"
              mkdir -m 700 "$oid" "$oid/repo"
              # The data home sits under its own listable and traversable (0755) parent on the ephemeral hosted VM.
              # The runner home and RUNNER_TEMP are not traversable by other users, so the parent lives under a
              # root-owned 0755 ancestor chain (never by loosening the runner home). The product creates the store
              # directory itself, so the other user is first denied at that directory.
              [ -d /opt ] || sudo -n install -d -o root -g wheel -m 755 /opt
              sudo -n install -d -o "$(id -un)" -g "$(id -gn)" -m 755 /opt/xt-oid
              # Every ancestor of the parent must be root-owned with no group/other write and no sticky bit, so the
              # product admission (ADR 0008) still admits the data home. Anything else fails closed here.
              p=/opt
              while :; do
                set -- $(stat -f "%u %p" "$p")
                [ "$1" = 0 ] || { echo "other-uid layout FAIL ancestor-not-root-owned"; exit 1; }
                [ $(( 8#$2 & 8#1022 )) -eq 0 ] || { echo "other-uid layout FAIL ancestor-writable-or-sticky"; exit 1; }
                [ "$p" = / ] && break
                p=$(dirname "$p")
              done
              XTRACE_DATA_HOME="/opt/xt-oid/userdata" target/debug/xtrace init --project-dir "$oid/repo" --display-name OtherUid
            '
      - name: Other-UID private-storage substitute (cannot traverse, read or write the store)
        if: ${{ !cancelled() }}
        run: |
          python3 -B -m tools.qa.other_uid_negative check \
            --store-root "/opt/xt-oid/userdata" --parent "/opt/xt-oid" --user xtrother --marker "$XTRACE_CI_PRIVATE_ROOT/other-uid.ok"
      - name: Other-UID negative must have run and passed
        if: always()
        run: |
          python3 -B -m tools.qa.other_uid_negative verify-marker --marker "$XTRACE_CI_PRIVATE_ROOT/other-uid.ok"
      - name: Other-UID cleanup
        if: always()
        run: |
          python3 -B -m tools.qa.other_uid_negative delete-user --user xtrother --created-marker "$XTRACE_CI_PRIVATE_ROOT/other-uid.created"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: xtrace-macos-arm64-frag-${{ matrix.tuple }}
          # Fragments include bounded, privacy-scanned excerpts. Never upload the private logs.
          path: ${{ env.XTRACE_CI_PRIVATE_ROOT }}/frag/*.json
          if-no-files-found: ignore
          retention-days: 14

  macos-ok:
    needs: [release-tool-tests, macos-arm64]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os, sys; sys.exit(not all(job["result"] == "success" for job in json.loads(os.environ["NEEDS_JSON"]).values()))'
