name: checkpoint-prepare-profile-temporary
on:
  push:
    branches: [codex/checkpoint-prepare-profile-78]
permissions:
  contents: read
jobs:
  jdk17-focused-checkpoint-prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Prepare the admitted floor-depth scratch layout
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP:?}/xf"
          [ "${#root}" -le 40 ]
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/diag" "$root/diag/frag" "$root/c" "$root/tmp/t" "$root/tmp/p"
          echo "XTRACE_CHECKPOINT_PREPARE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Observe checkpoint preparation in one unchanged focused cardinality test
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_CHECKPOINT_PREPARE_ROOT"
          export CARGO_TARGET_DIR="$root/cargo-target"
          export TMPDIR="$root/tmp/t" TMP="$root/tmp/t" TEMP="$root/tmp/t"
          export XTRACE_TEST_SCRATCH_ROOT="$root/tmp/t" XTRACE_TEST_PRIVATE_SCRATCH="$root/tmp/p"
          export XTRACE_TEST_CARDINALITY_SCRATCH="$root/c"
          export XTRACE_CI_PRIVATE_ROOT="$root/diag" XTRACE_CHECKPOINT_PREPARE_DETAIL=1
          unset XTRACE_CHECKPOINT_PROFILE_DETAIL
          focused=recording_port::tests::singleton_acknowledgements_at_focused_cap_recover_with_bounded_segments_and_pages
          if ! cargo test --locked -p xtrace-store --lib --all-features "$focused" -- --exact > "$root/diag/test.log" 2>&1; then
            echo "Focused checkpoint preparation observation failed"
            exit 1
          fi
          grep -Fxq "test $focused ... ok" "$root/diag/test.log"
          grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$root/diag/test.log"
          python3 -B - "$root/diag/frag" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib
          import sys

          from tools.qa.store_profiles import collect

          profiles = collect(pathlib.Path(sys.argv[1]))
          assert set(profiles) == {"focused-singletons"}
          report = profiles["focused-singletons"]
          assert report["workload"] == {"expected_admissions": 131072, "counted_journal_syncs": 1}
          complete = report["lastReport"]
          assert complete["state"] == "returned" and complete["completed"] == 131072
          assert complete["elapsed_ns"] > 0
          assert "linuxAclProbes" not in report
          names = {
              "checkpoint_prepare_encode": "Filename, header, length and hash",
              "checkpoint_prepare_open": "Admitted open or create",
              "checkpoint_prepare_truncate": "Truncate",
              "checkpoint_prepare_write": "Write",
              "checkpoint_prepare_sync_dispatch": "Sync wrapper and failpoint check",
              "checkpoint_sync": "Counted checkpoint sync",
              "checkpoint_prepare_bind": "Post-sync pending file binding",
          }
          phases = report["phases"]
          assert {name for name in phases if name.startswith("checkpoint_prepare_")} == set(names) - {"checkpoint_sync"}
          assert "checkpoint_bind_pending" not in phases
          for name in names:
              measurement = phases[name]
              assert 0 < measurement["spans"] <= 131072 * 4
              assert 0 < measurement["max_ns"] <= measurement["total_ns"] <= complete["elapsed_ns"]
          print("Focused checkpoint preparation observation (JDK17)")
          print("- 131,072 admissions; exact existing test passed.")
          print(f"- Workload profile elapsed: {complete['elapsed_ns'] / 1e9:.3f}s.")
          for name, label in names.items():
              phase = phases[name]
              print(f"- {label}: {phase['total_ns'] / 1e9:.3f}s exclusive, {phase['spans']} spans.")
          print("- The fixture counts logical checkpoint sync barriers; no physical sync latency was measured.")
          print("- One instrumented workload observation. No baseline, profiler overhead estimate, "
                "sparse workload, or release-floor proof.")
          PY
      - name: Encrypt private diagnostics
        if: always() && env.XTRACE_CHECKPOINT_PREPARE_ROOT != ''
        env:
          EVIDENCE_CERT: 
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_CHECKPOINT_PREPARE_ROOT"
          printf '%s' "$EVIDENCE_CERT" | base64 -d > "$root/evidence.crt"
          tar -C "$root" -cf - diag | openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER -out "$root/checkpoint-prepare-profile.enc" "$root/evidence.crt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.XTRACE_CHECKPOINT_PREPARE_ROOT != ''
        with:
          name: encrypted-checkpoint-prepare-profile
          path: ${{ env.XTRACE_CHECKPOINT_PREPARE_ROOT }}/checkpoint-prepare-profile.enc
          if-no-files-found: error
          retention-days: 1
