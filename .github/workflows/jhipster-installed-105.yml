        if: always()
        run: |
          set -euo pipefail
          umask 077
          python3 -B campaigns/java/jhipster/harness/encrypt_diagnostic.py \
            --private-root "$RUNNER_TEMP/jhipster-proof-private/run" \
            --encrypted-out "$RUNNER_TEMP/jhipster-proof-private/encrypted"
      - name: Scan observed sinks and write the bounded public result
        if: always()
        run: |
          set -euo pipefail
          umask 077
          python3 -B campaigns/java/jhipster/harness/public_result.py \
            --private-root "$RUNNER_TEMP/jhipster-proof-private/run" \
            --public-out "$RUNNER_TEMP/jhipster-proof-public"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: jhipster-installed-public-result
          path: ${{ runner.temp }}/jhipster-proof-public/summary.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && steps.diagnostic.outputs.ready == 'true' }}
        with:
          name: jhipster-pre-receipt-encrypted-stderr
          path: ${{ runner.temp }}/jhipster-proof-private/encrypted/failure-stderr.cms
          if-no-files-found: error
          retention-days: 1
