name: checkpoint-profile-temporary
on:
  push:
    branches: [codex/checkpoint-profile-78]
permissions:
  contents: read
jobs:
  jdk17-checkpoint-pairs:
    strategy:
      fail-fast: false
      matrix:
        workload: [focused, sparse]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Prepare owner-private diagnostic directories
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP:?}/xp"
          [ "${#root}" -le 40 ]
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/diag" "$root/c" "$root/t" "$root/p"
          echo "XTRACE_CHECKPOINT_MEASUREMENT_ROOT=$root" >> "$GITHUB_ENV"
      - name: Compile once before the pair
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_CHECKPOINT_MEASUREMENT_ROOT"
          CARGO_TARGET_DIR="$root/target" cargo test --locked -p xtrace-store --lib --all-features --no-run > "$root/diag/build.log" 2>&1
      - name: Compare coarse and detailed profiling on the unchanged cardinality workload
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_CHECKPOINT_MEASUREMENT_ROOT"
          export CARGO_TARGET_DIR="$root/target"
          export TMPDIR="$root/t" TMP="$root/t" TEMP="$root/t"
          export XTRACE_TEST_SCRATCH_ROOT="$root/t" XTRACE_TEST_PRIVATE_SCRATCH="$root/p"
          export XTRACE_TEST_CARDINALITY_SCRATCH="$root/c"
          focused=recording_port::tests::singleton_acknowledgements_at_focused_cap_recover_with_bounded_segments_and_pages
          sparse=recording_port::tests::sparse_acknowledged_batches_hit_admission_before_becoming_unreadable
          run_one() {
            local name="$1" detail="$2" test="$3"
            local directory="$root/diag/$name"
            mkdir -m 700 "$directory" "$directory/frag"
            if ! XTRACE_CI_PRIVATE_ROOT="$directory" XTRACE_CHECKPOINT_PROFILE_DETAIL="$detail" \
              cargo test --locked -p xtrace-store --lib --all-features "$test" -- --exact > "$directory/test.log" 2>&1; then
              echo "Cardinality diagnostic failed in $name"
              return 1
            fi
            if ! grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$directory/test.log"; then
              echo "Expected one passing cardinality test in $name"
              return 1
            fi
            echo "Completed $name"
          }
          case "$WORKLOAD" in
            focused)
              run_one coarse-focused 0 "$focused"
              run_one detail-focused 1 "$focused"
              ;;
            sparse)
              run_one detail-sparse 1 "$sparse"
              run_one coarse-sparse 0 "$sparse"
              ;;
            *) exit 1 ;;
          esac
          python3 -B - "$root/diag" "$WORKLOAD" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib
          import sys
          from tools.qa.store_profiles import collect

          root = pathlib.Path(sys.argv[1])
          checkpoint_subphases = (
              "checkpoint_bind_pending",
              "checkpoint_admit_target",
              "checkpoint_revalidate_before_rename",
              "checkpoint_rename",
              "checkpoint_bind_published",
              "checkpoint_directory_sync_dispatch",
              "checkpoint_directory_sync",
              "checkpoint_revalidate_after_sync",
          )
          def seconds(ns):
              return ns / 1_000_000_000

          print("JDK17 isolated cardinality cohorts with incremental detail profiling")
          test = sys.argv[2]
          profile, admissions, counted_syncs = {
              "focused": ("focused-singletons", 131072, 1),
              "sparse": ("sparse", 10000, 0),
          }[test]
          coarse, detail = (collect(root / f"{mode}-{test}" / "frag")[profile]
                            for mode in ("coarse", "detail"))
          for entry in (coarse, detail):
              assert entry["lastReport"]["state"] == "returned"
              assert entry["workload"] == {
                  "expected_admissions": admissions, "counted_journal_syncs": counted_syncs,
              }
          assert coarse["lastReport"]["completed"] == detail["lastReport"]["completed"]
          assert "linuxAclProbes" not in coarse
          assert set(checkpoint_subphases).isdisjoint(coarse["phases"])
          base, expanded = (seconds(entry["lastReport"]["elapsed_ns"])
                            for entry in (coarse, detail))
          print(f"\n### {test}")
          print(f"- Coarse {base:.3f}s; detailed {expanded:.3f}s; paired difference "
                f"{expanded - base:+.3f}s ({(expanded - base) / base:+.2%}).")
          for mode, entry in (("Coarse", coarse), ("Detailed", detail)):
              accounted = sum(row["total_ns"] for row in entry["phases"].values())
              print(f"- {mode} elapsed minus exclusive named phases "
                    f"{seconds(entry['lastReport']['elapsed_ns'] - accounted):.3f}s.")
          for phase in ("checkpoint_publish", *checkpoint_subphases):
              measurement = detail["phases"][phase]
              assert measurement["spans"] > 0
              print(f"- {phase}: {seconds(measurement['total_ns']):.3f}s across "
                    f"{measurement['spans']} spans.")
          for probe, count in sorted(detail["linuxAclProbes"].items()):
              print(f"- Linux {probe} ACL syscall attempts across the workload: {count}.")
          print("\nOne paired observation per workload; the difference includes runner variation. "
                "This isolated diagnostic does not replace the release floor or measure all profiler cost.")
          PY
      - name: Encrypt private diagnostics
        if: always() && env.XTRACE_CHECKPOINT_MEASUREMENT_ROOT != ''
        env:
          EVIDENCE_CERT: 
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_CHECKPOINT_MEASUREMENT_ROOT"
          printf '%s' "$EVIDENCE_CERT" | base64 -d > "$root/evidence.crt"
          tar -C "$root" -cf - diag | openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER -out "$root/checkpoint-profile.enc" "$root/evidence.crt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.XTRACE_CHECKPOINT_MEASUREMENT_ROOT != ''
        with:
          name: encrypted-checkpoint-profile-${{ matrix.workload }}
          path: ${{ env.XTRACE_CHECKPOINT_MEASUREMENT_ROOT }}/checkpoint-profile.enc
          if-no-files-found: error
          retention-days: 1
