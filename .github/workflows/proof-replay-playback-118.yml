        run: |
          python3 -B - <<'PY'
          import hashlib, io, json, os, pathlib, re, stat, struct, subprocess, tarfile, zlib
          from tools.release.private_roots import admit_directory, atomic_write_private, read_private_json
          root = pathlib.Path(os.environ['PROOF_ROOT'])
          admit_directory(root)
          os.umask(0o077)
          safe = root/'safe/counts.json'
          if safe.is_symlink() or not safe.is_file() or safe.stat().st_size > 65536:
              raise SystemExit(1)
          report = json.loads(safe.read_bytes())
          assert report.get('sourceSha') == os.environ['PRODUCT']
          # Only pinned source locations and fixed enums may leave private scratch.
          # Discard captured error messages, selectors, URLs, log lines and arbitrary filenames.
          diag = {'locations': [], 'classes': [], 'reached': []}
          safe_sources = ('browser-journey.mjs', 'replay-tools-journey.mjs', 'replay-tools-report.mjs', 'replay-playback-journey.mjs')
          private_log = root/'logs/xl/rust-17-spring-browser.log'
          if private_log.is_file() and not private_log.is_symlink():
              with private_log.open('rb') as data:
                  data.seek(max(0, private_log.stat().st_size - 1024*1024))
                  end = data.read(1024*1024).decode('utf-8', errors='replace')
              for source in safe_sources:
                  code = (pathlib.Path('web/app/scripts')/source).read_text().splitlines()
                  for match in re.finditer(r'(?m)^\s*at [^\r\n]*?/web/app/scripts/'+re.escape(source)+r':(\d{1,5}):(\d{1,5})\)?\s*$', end):
                      line, col = map(int, match.groups())
                      loc = {'file':source, 'line':line, 'column':col}
                      if 1 <= line <= len(code) and 1 <= col <= len(code[line-1].encode('utf-16-le'))//2+1 and loc not in diag['locations'] and len(diag['locations']) < 12:
                          diag['locations'].append(loc)
              for label, pattern in [('node-assertion', r'(?m)^AssertionError\b'), ('playwright-timeout', r'(?m)^(?:TimeoutError|(?:locator|page)\.[a-zA-Z]+: Timeout [0-9]+ms exceeded)'), ('playwright-strict-mode', r'strict mode violation:'), ('rust-browser-child-failed', r'(?m)^browser journey failed:')]:
                  if re.search(pattern, end):
                      diag['classes'].append(label)
          milestones = ('viewer-desktop-endpoints','viewer-mobile-endpoints','viewer-mobile-linked-recordings','viewer-desktop-genuine-detail','viewer-mobile-genuine-detail','viewer-mobile-genuine-events')
          for name in milestones:
              frame = root/'shots'/(name+'-viewport.png')
              if frame.is_file() and not frame.is_symlink() and frame.stat().st_size >= 33:
                  diag['reached'].append(name)
          report['springDiagnostic'] = diag
          # Only exact tracked test paths and validated source coordinates escape private logs.
          unit_diag = {'failedFiles': [], 'locations': []}
          unit_report = root/'receipts/vitest.private.json'
          if unit_report.is_file() and not unit_report.is_symlink() and unit_report.stat().st_size <= 8*1024*1024:
              try:
                  tracked = set(subprocess.check_output(['git', 'ls-files', 'web/app'], text=True).splitlines())
                  data = json.loads(unit_report.read_bytes())
                  rows = data['testResults']
                  assert isinstance(rows, list) and len(rows) <= 1000
                  for row in rows:
                      rel = str(pathlib.Path(row['name']).resolve().relative_to(pathlib.Path.cwd()))
                      if rel not in tracked or not re.fullmatch(r'web/app/(?:[A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+\.(?:test|spec)\.(?:[cm]?[jt]sx?)', rel):
                          continue
                      failed = row.get('status') == 'failed'
                      if failed and rel not in unit_diag['failedFiles'] and len(unit_diag['failedFiles']) < 24:
                          unit_diag['failedFiles'].append(rel)
                      lines = pathlib.Path(rel).read_text().splitlines()
                      for case in row.get('assertionResults', []):
                          if case.get('status') != 'failed':
                              continue
                          for message in case.get('failureMessages', []):
                              if not isinstance(message, str):
                                  continue
                              for match in re.finditer(re.escape(rel) + r':(\d{1,5}):(\d{1,5})', message):
                                  line, col = map(int, match.groups())
                                  loc = {'file': rel, 'line': line, 'column': col}
                                  if 1 <= line <= len(lines) and 1 <= col <= len(lines[line-1].encode('utf-16-le'))//2+1 and loc not in unit_diag['locations'] and len(unit_diag['locations']) < 24:
                                      unit_diag['locations'].append(loc)
              except (OSError, ValueError, KeyError, TypeError, AssertionError, subprocess.SubprocessError):
                  pass
          report['unitDiagnostic'] = unit_diag
          def project_jumps():
              value = read_private_json(root/'receipts/jumps.private.json', maximum_bytes=65536, maximum_nodes=4096, maximum_commas=4096)
              assert set(value) == {'schemaVersion', 'kind', 'sourceSha', 'receiptId', 'status', 'stage', 'failureStage', 'viewports'}
              assert value['schemaVersion'] == 1 and type(value['schemaVersion']) is int and value['kind'] == 'spring-replay-tools-jumps'
              assert value['sourceSha'] == os.environ['PRODUCT'] and value['receiptId'] == os.environ['PROOF_RECEIPT_ID']
              stages = {'before-tools', 'viewport', 'jump-observation', 'jump-activation', 'jump-absence', 'viewport-complete', 'complete'}
              assert value['status'] in ('running', 'pass', 'fail') and value['stage'] in stages
              assert value['failureStage'] is None or value['failureStage'] in stages
              assert (value['status'] == 'fail') == (value['failureStage'] is not None)
              expected = [(w,h,p) for w,h in ((320,640),(736,900),(1024,768),(1280,900),(1440,900)) for p in ('fine','coarse')]
              assert isinstance(value['viewports'], list) and len(value['viewports']) == 10
              kinds = ('gap', 'exception', 'database', 'http')
              directions = ('next', 'previous')
              cells, inventory = [], {}
              summary = {kind: {direction: {'activated': 0, 'absenceReasonChecked': 0} for direction in directions} for kind in kinds}
              for cell, identity in zip(value['viewports'], expected):
                  assert isinstance(cell, dict) and set(cell) == {'width','height','pointer','status','jumps'}
                  assert type(cell['width']) is int and type(cell['height']) is int and (cell['width'],cell['height'],cell['pointer']) == identity
                  assert cell['status'] in ('not-started','running','pass','fail')
                  rows = cell['jumps']
                  assert isinstance(rows, list) and len(rows) <= 4
                  assert cell['status'] != 'not-started' or not rows
                  assert cell['status'] != 'pass' or len(rows) == 4
                  rebuilt = []
                  for index, row in enumerate(rows):
                      assert isinstance(row, dict) and set(row) == {'kind','observedCount','next','previous'}
                      kind, count = row['kind'], row['observedCount']
                      assert kind == kinds[index] and type(count) is int and 0 <= count <= 100000
                      checked = {'kind': kind, 'observedCount': count}
                      for direction in directions:
                          outcome = row[direction]
                          assert isinstance(outcome, dict) and set(outcome) == {'targetAvailable','activated','absenceReasonChecked'}
                          available, activated, absent = (outcome[key] for key in ('targetAvailable','activated','absenceReasonChecked'))
                          assert type(available) is bool and type(activated) is int and type(absent) is int
                          assert activated in (0,1) and absent in (0,1) and activated + absent <= 1
                          assert (not activated or available) and (not absent or not available)
                          assert cell['status'] != 'pass' or activated + absent == 1
                          checked[direction] = {'targetAvailable': available, 'activated': activated, 'absenceReasonChecked': absent}
                          summary[kind][direction]['activated'] += activated
                          summary[kind][direction]['absenceReasonChecked'] += absent
                      targets = (checked['next']['targetAvailable'], checked['previous']['targetAvailable'])
                      assert any(targets) == (count > 0) and (count <= 1 or all(targets))
                      fact = (count, targets)
                      assert kind not in inventory or inventory[kind] == fact
                      inventory[kind] = fact
                      rebuilt.append(checked)
                  cells.append({'width': identity[0], 'height': identity[1], 'pointer': identity[2], 'status': cell['status'], 'jumps': rebuilt})
              complete = value['status'] == 'pass' and value['stage'] == 'complete' and all(cell['status'] == 'pass' for cell in cells)
              assert value['status'] != 'pass' or complete
              return {'status': value['status'], 'stage': value['stage'], 'failureStage': value['failureStage'], 'receiptId': os.environ['PROOF_RECEIPT_ID'], 'viewports': cells, 'summary': summary}, complete
          jump_complete = False
          try:
              report['jumpCoverage'], jump_complete = project_jumps()
              report['jumpReceipt'] = 'validated'
          except FileNotFoundError:
              report['jumpReceipt'] = 'unavailable'
          except Exception:
              report['jumpReceipt'] = 'invalid-or-unavailable'
          if report.get('status') == 'awaiting-browser-receipt':
              if jump_complete:
                  report.update(status='pass', stage='complete', exitCode=0, countsComplete=True)
              else:
                  report.update(status='fail', stage='jump-receipt-validation', exitCode=1, countsComplete=False)
          shots = root/'shots'
          admit_directory(shots)
          widths = ((320,640), (736,900), (1024,768), (1280,900), (1440,900))
          phases = ('filter', 'goto', 'jump', 'tools', 'playback', 'speed')
          def viewport_png(path, width, height):
              # Bounded native-size screenshot admission; only parsed PNG bytes are encrypted.
              info = path.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid() and stat.S_IMODE(info.st_mode) == 0o600 and info.st_nlink == 1 and info.st_size <= 20*1024*1024
              with path.open('rb') as stream:
                  data = stream.read(20*1024*1024+1)
              assert len(data) <= 20*1024*1024 and data.startswith(b'\x89PNG\r\n\x1a\n')
              offset, header, ended, chunks = 8, False, False, []
              while offset + 12 <= len(data):
                  length = struct.unpack_from('>I', data, offset)[0]
                  end = offset + 12 + length
                  assert end <= len(data)
                  kind, payload = data[offset+4:offset+8], data[offset+8:offset+8+length]
                  assert zlib.crc32(kind + payload) & 0xffffffff == struct.unpack_from('>I', data, offset+8+length)[0]
                  if not header:
                      assert kind == b'IHDR' and length == 13 and struct.unpack_from('>II', payload) == (width,height)
                      depth, color, compression, filtering, interlace = payload[8:]
                      assert depth == 8 and color in (2,6) and (compression,filtering,interlace) == (0,0,0)
                      row_size = 1 + width * (3 if color == 2 else 4)
                      expected = row_size * height
                      assert 0 < expected <= (1440*4+1)*900
                      header = True
                  else:
                      assert kind in (b'IDAT', b'IEND')
                  if kind == b'IDAT': chunks.append(payload)
                  if kind == b'IEND':
                      ended = length == 0 and end == len(data)
                      break
                  offset = end
              assert header and chunks and ended
              decoder, decoded = zlib.decompressobj(), 0
              for payload in chunks:
                  while payload:
                      pixels = decoder.decompress(payload, min(65536, expected-decoded+1))
                      assert not decoder.unused_data and decoded+len(pixels) <= expected
                      assert all(pixels[i] <= 4 for i in range((-decoded) % row_size, len(pixels), row_size))
                      decoded += len(pixels)
                      payload = decoder.unconsumed_tail
              assert decoder.eof and decoded == expected
              return data
          selected, progress = [], []
          # Exactly sixty viewport files can leave this job, only as recipient-encrypted bytes.
          # A present frame means capture reached, never that later assertions passed.
          for width, height in widths:
              for pointer in ('fine', 'coarse'):
                  captured = 0
                  for phase in phases:
                      name = f'viewer-replay-{phase}-{pointer}-{width}-viewport.png'
                      path = shots/name
                      try:
                          info = path.lstat()
                      except FileNotFoundError:
                          continue
                      try:
                          data = viewport_png(path, width, height)
                      except Exception:
                          report.update(status='fail', stage='viewport-validation', exitCode=1, countsComplete=False,
                              invalidViewport={'width': width, 'height': height, 'pointer': pointer, 'phase': phase})
                          atomic_write_private(safe, (json.dumps(report, sort_keys=True)+'\n').encode())
                          raise SystemExit(1)
                      selected.append((name,data))
                      captured += 1
                  progress.append({'width': width, 'height': height, 'pointer': pointer, 'capturedStages': captured, 'expectedStages': 6, 'assertionsPassed': report.get('status') == 'pass' and captured == 6})
          assert len(selected) <= 60
          report['viewports'] = progress
          report['encryptedViewportCount'] = 0
          report['playbackEvidenceMeaning'] = 'recorded event order; display timers clock controlled; matching gap exercised only when observed'
          report['jumpCoverageMeaning'] = 'activated counts require selected-target assertions; absenceReasonChecked never credits a matching target'
          if report.get('status') == 'pass' and len(selected) != 60:
              report.update(status='fail', stage='viewport-coverage', exitCode=1, countsComplete=False)
          if selected:
              payload = io.BytesIO()
              with tarfile.open(fileobj=payload, mode='w:gz') as archive:
                  for name,data in selected:
                      info = tarfile.TarInfo(name)
                      info.size, info.mode, info.mtime = len(data), 0o600, 0
                      archive.addfile(info, io.BytesIO(data))
              cert = root/'recipient.pem'
              atomic_write_private(cert, os.environ['RECIPIENT_CERT'].encode())
              encrypted = root/'encrypted'
              encrypted.mkdir(mode=0o700)
              try:
                  with (root/'logs/encryption.stderr').open('xb') as err:
                      result = subprocess.run(['openssl', 'cms', '-encrypt', '-binary', '-aes-256-gcm', '-outform', 'DER', '-out', str(encrypted/'visuals.cms'), str(cert)], input=payload.getvalue(), stdout=subprocess.DEVNULL, stderr=err, check=False, timeout=60)
                  encrypted_ok = result.returncode == 0 and (encrypted/'visuals.cms').is_file() and (encrypted/'visuals.cms').stat().st_size > 0
              except (OSError, subprocess.SubprocessError):
                  encrypted_ok = False
              if not encrypted_ok:
                  (encrypted/'visuals.cms').unlink(missing_ok=True)
                  report.update(status='fail', stage='visual-encryption', exitCode=1, countsComplete=False)
              else:
                  report['encryptedViewportCount'] = len(selected)
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                      stream.write('ready=true\n')
          atomic_write_private(safe, (json.dumps(report, sort_keys=True)+'\n').encode())
          print(json.dumps(report, sort_keys=True))
          raise SystemExit(0 if report['status'] == 'pass' else 1)
          PY
