name: Assembled viewer source proof
on:
  push:
    branches: [codex/proof-viewer-clear-mode-tabs-118]
permissions:
  contents: read
jobs:
  viewer-playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRODUCT: 23d43eb50c21d5b46e7f27998b3311495fa50f26
      PRODUCT_TREE: 15bda4d640cfd8948f0c5a439fa6d927842d2460
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Admit fresh private scratch and exact source
        id: root
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'PY'
          import os, pathlib, re, subprocess
          from tools.release import ci_floor
          from tools.release.private_roots import ensure_private_directory
          sha = os.environ['PRODUCT']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == sha
          tree = os.environ['PRODUCT_TREE']
          assert re.fullmatch('[0-9a-f]{40}', tree)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() == tree
          assert not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'])
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'xt118'
          assert len(str(root)) <= 40
          ci_floor._prepare_private_root(type('Args', (), {'root': str(root)})())
          for name in ('logs', 'fragments', 'safe', 'shots', 'generated', 'cache', 'receipts'):
              ensure_private_directory(root / name, must_create=True)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'PROOF_ROOT={root}\nPLAYWRIGHT_BROWSERS_PATH={root}/cache/chromium\nPROOF_RECEIPT_ID={os.urandom(32).hex()}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('admitted=true\n')
          PY
      - name: Check named suites build embed and run genuine Spring browser journey privately
        id: proof
        if: steps.root.outputs.admitted == 'true'
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess, sys
          from tools.release.private_roots import admit_directory, atomic_write_private
          root = pathlib.Path(os.environ['PROOF_ROOT'])
          admit_directory(root)
          os.umask(0o077)
          repo = pathlib.Path.cwd()
          env = dict(os.environ)
          for key in ('XTRACE_JAVA_ANALYZER', 'XTRACE_NODE_ANALYZER', 'XTRACE_JAVA_PACK', 'XTRACE_JAVA_AGENT', 'JAVA_TOOL_OPTIONS', 'JDK_JAVA_OPTIONS', '_JAVA_OPTIONS'):
              env.pop(key, None)
          env['XTRACE_BROWSER_SCREENSHOT_DIR'] = str(root/'shots')
          env['XTRACE_REPLAY_TOOLS_REPORT'] = str(root/'receipts/jumps.private.json')
          env['XTRACE_REPLAY_TOOLS_SOURCE_SHA'] = env['PRODUCT']
          env['XTRACE_REPLAY_TOOLS_RECEIPT_ID'] = env['PROOF_RECEIPT_ID']
          env['npm_config_cache'] = str(root/'cache/npm')
          stages = ('source-check', 'web-install', 'web-api', 'web-types', 'syntax-first-recording-journey', 'syntax-export-journey', 'syntax-api-evidence', 'syntax-export-visibility', 'syntax-real-replay-window', 'syntax-browser-journey', 'syntax-replay-tools-journey', 'syntax-replay-tools-report', 'syntax-replay-tools-report-test', 'syntax-replay-window-journey', 'syntax-replay-playback-journey', 'syntax-focused-code-journey', 'syntax-synthetic-step-window-journey', 'tools-unit', 'contrast', 'web-build', 'web-embed', 'embedded-parity', 'generated-assets', 'java-build', 'adapter-verify', 'chromium-install', 'source-scope', 'spring-browser', 'empty-browser')
          report = {'schemaVersion': 1, 'kind': 'source-built-assembled-viewer', 'sourceSha': os.environ['PRODUCT'], 'sourceTree': os.environ['PRODUCT_TREE'], 'releaseAcceptance': False, 'installedPackage': False, 'fullFloor': False, 'status': 'fail', 'stage': 'source-check', 'exitCode': 1, 'countsComplete': False, 'stages': []}
          atomic_write_private(root/'safe/counts.json', (json.dumps(report, sort_keys=True)+'\n').encode())
          def checkpoint():
              atomic_write_private(root/'safe/counts.json', (json.dumps(report, sort_keys=True)+'\n').encode())
          def command(label, args, cwd=repo, timeout=3000):
              assert label in stages
              report.update(stage=label, exitCode=1)
              checkpoint()
              number = len(report['stages']) + 1
              with (root/'logs'/f'{number}.stdout').open('xb') as out, (root/'logs'/f'{number}.stderr').open('xb') as err:
                  try:
                      result = subprocess.run(args, cwd=cwd, env=env, stdout=out, stderr=err, timeout=timeout, check=False)
                      code = result.returncode
                  except subprocess.TimeoutExpired:
                      code = 124
              report['stages'].append({'stage': label, 'exitCode': code, 'timedOut': code == 124})
              report['exitCode'] = code
              checkpoint()
              if code:
                  raise RuntimeError('stage-failed')
          def fragment(name, expected, key, stage):
              # A zero-exit command is not a passing count/schema validation.
              report.update(stage=stage, exitCode=1)
              checkpoint()
              path = root/'fragments'/name
              assert not path.is_symlink() and path.is_file() and path.stat().st_size <= 65536
              value = json.loads(path.read_bytes())
              safe = {key: value.get(key) for key in ('passed', 'failed', 'ignored')}
              assert all(type(v) is int and 0 <= v <= 100000 for v in safe.values())
              report[key] = safe
              checkpoint()
              assert value.get('status') == 'pass' and value.get('exitCode') == 0
              assert safe == {'passed': expected, 'failed': 0, 'ignored': 0}
              report['exitCode'] = 0
              checkpoint()
          generated = ('index.html', 'app.js', 'index.css', 'fonts/chivo-latin-400-normal.woff2', 'fonts/chivo-latin-600-normal.woff2', 'fonts/azeret-mono-latin-400-normal.woff2', 'assets.sha256')
          try:
              command('source-check', ['git', 'diff', '--exit-code', 'HEAD'])
              command('web-install', ['npm', 'ci', '--ignore-scripts', '--no-audit', '--no-fund'], cwd=repo/'web/app')
              command('web-api', ['npm', 'run', 'check:api'], cwd=repo/'web/app')
              command('web-types', ['npm', 'run', 'typecheck'], cwd=repo/'web/app')
              command('syntax-first-recording-journey', ['node', '--check', 'scripts/first-recording-journey.mjs'], cwd=repo/'web/app')
              command('syntax-browser-journey', ['node', '--check', 'scripts/browser-journey.mjs'], cwd=repo/'web/app')
              command('syntax-replay-tools-journey', ['node', '--check', 'scripts/replay-tools-journey.mjs'], cwd=repo/'web/app')
              command('syntax-replay-tools-report', ['node', '--check', 'scripts/replay-tools-report.mjs'], cwd=repo/'web/app')
              command('syntax-replay-tools-report-test', ['node', '--check', 'scripts/replay-tools-report.test.mjs'], cwd=repo/'web/app')
              command('syntax-replay-window-journey', ['node', '--check', 'scripts/replay-window-journey.mjs'], cwd=repo/'web/app')
              command('syntax-replay-playback-journey', ['node', '--check', 'scripts/replay-playback-journey.mjs'], cwd=repo/'web/app')
              command('syntax-focused-code-journey', ['node', '--check', 'scripts/focused-code-journey.mjs'], cwd=repo/'web/app')
              command('syntax-synthetic-step-window-journey', ['node', '--check', 'scripts/synthetic-step-window-journey.mjs'], cwd=repo/'web/app')
              for label, path in [('syntax-export-journey', 'installed-export-journey.mjs'),
                                  ('syntax-api-evidence', 'api-evidence.mjs'), ('syntax-export-visibility', 'export-visibility.mjs'),
                                  ('syntax-real-replay-window', 'real-replay-window-journey.mjs')]:
                  command(label, ['node', '--check', 'scripts/' + path], cwd=repo/'web/app')
              files = subprocess.check_output(['git', 'ls-files', '-z', 'web/app'], cwd=repo).decode().split('\0')
              unit_files = sorted(name for name in files if re.search(r'(?:^|/)[^/]+\.(?:test|spec)\.(?:[cm]?[jt]sx?)$', name))
              required = {'web/app/src/replay/playback.test.ts', 'web/app/src/replay/use-playback.test.tsx',
                  'web/app/src/features/shell/ReplayControls.test.tsx', 'web/app/src/features/shell/ViewerSettings.test.tsx',
                  'web/app/src/main.replay.test.tsx', 'web/app/src/main.test.tsx', 'web/app/src/a11y.test.tsx',
                  'web/app/src/replay/replay.test.ts', 'web/app/scripts/replay-tools-report.test.mjs',
                  'web/app/src/features/export/ExportSheet.test.tsx', 'web/app/src/features/export/ExportReplay.test.tsx',
                  'web/app/scripts/api-evidence.test.mjs',
                  'web/app/scripts/export-visibility.test.mjs'}
              assert required <= set(unit_files) and len(unit_files) == len(set(unit_files)) == 30
              lane = ['python3', '-B', '-m', 'tools.qa.lane_run', 'run', '--out', str(root/'fragments'), '--private-log-dir', str(root/'logs'), '--max-ignored', '0']
              command('tools-unit', lane + ['--suite', 'web', '--variant', '22', '--step', 'tools-unit', '--min-passed', '287', '--', 'npm', 'exec', '--prefix', 'web/app', '--', 'vitest', 'run', '--root', 'web/app', '--reporter=default', '--reporter=json', '--outputFile.json=' + str(root/'receipts/vitest.private.json'), *[name.removeprefix('web/app/') for name in unit_files]], timeout=3060)
              report.update(stage='tools-unit-count-validation', exitCode=1)
              checkpoint()
              result_path = root/'receipts/vitest.private.json'
              assert result_path.is_file() and not result_path.is_symlink() and result_path.stat().st_size <= 8*1024*1024
              value = json.loads(result_path.read_bytes())
              results = value['testResults']
              assert isinstance(results, list) and len(results) == len(unit_files)
              names = [str(pathlib.Path(item['name']).resolve().relative_to(repo)) for item in results]
              assert len(set(names)) == len(names) and set(names) == set(unit_files)
              assertions = []
              for item in results:
                  assert item['status'] == 'passed' and isinstance(item['assertionResults'], list) and item['assertionResults']
                  assert all(case['status'] == 'passed' for case in item['assertionResults'])
                  assertions.extend(item['assertionResults'])
              for key in ('numFailedTests', 'numPendingTests', 'numTodoTests'):
                  assert type(value[key]) is int and value[key] == 0
              assert value['success'] is True and value['numPassedTests'] == value['numTotalTests'] == len(assertions) and len(assertions) == 287
              wanted = ('advances only after the exact evidence-timed delay', 'continues playing across a mode round trip',
                  'consumes an accepted timer callback once', 'does not publish a rejected timer after a same-batch',
                  'publishes an accepted tick before a same-batch', 'does not announce a stop rejected',
                  'focuses the selected row on click or Alt+M', 'restores an accepted same-batch playback advance',
                  'leaves focus with a later view change or manual focus move while Go is queued',
                  'offers phone replay actions and returns keyboard focus to the selected step',
                  'previews the selected endpoint and saves only after explicit review',
                  'requires a fresh preview before saving changed observations on the same revision',
                  'gives Export the active tour and replay handoff and returns focus to the export opener',
                  'shows first-run guidance only after a successful empty project read',
                  'confirms an empty project after an existing-session bootstrap',
                  'pauses playback and keeps Settings available when Help starts the tour')
              assert all(any(token in case['fullName'] for case in assertions) for token in wanted)
              export_files = {'web/app/scripts/api-evidence.test.mjs': 28, 'web/app/scripts/export-visibility.test.mjs': 4,
                              'web/app/src/features/export/ExportSheet.test.tsx': 11, 'web/app/src/features/export/ExportReplay.test.tsx': 1}
              for name, minimum in export_files.items():
                  assert len(results[names.index(name)]['assertionResults']) >= minimum
              report['exportUnitCounts'] = {name: len(results[names.index(name)]['assertionResults']) for name in export_files}
              fragment_path = root/'fragments/web__22__tools-unit.json'
              fragment_value = json.loads(fragment_path.read_bytes())
              assert fragment_value['status'] == 'pass' and fragment_value['exitCode'] == 0
              assert fragment_value['passed'] == len(assertions) and fragment_value['failed'] == 0 and fragment_value['ignored'] == 0
              report['unit'] = {'files': len(unit_files), 'passed': len(assertions), 'failed': 0, 'ignored': 0}
              report['exitCode'] = 0
              checkpoint()
              command('contrast', ['node', 'scripts/check-contrast.mjs'], cwd=repo/'web/app')
              command('web-build', ['npm', 'run', 'build'], cwd=repo/'web/app')
              command('web-embed', ['npm', 'run', 'embed'], cwd=repo/'web/app')
              command('embedded-parity', ['npm', 'run', 'check:embedded'], cwd=repo/'web/app')
              report.update(stage='generated-assets', exitCode=1)
              checkpoint()
              source = repo/'crates/xtrace-daemon/assets/ui'
              assert not (source/'assets.sha256').is_symlink() and (source/'assets.sha256').stat().st_size <= 4096
              manifest = (source/'assets.sha256').read_text()
              lines = manifest.splitlines()
              assert len(lines) == 6
              digests = {}
              for line in lines:
                  digest, name = line.split('  ')
                  assert re.fullmatch('[0-9a-f]{64}', digest)
                  mapped = name.removeprefix('assets/')
                  assert mapped in generated[:-1] and mapped not in digests
                  assert not (source/mapped).parent.is_symlink() and (source/mapped).is_file() and not (source/mapped).is_symlink() and (source/mapped).stat().st_size <= 20*1024*1024
                  data = (source/mapped).read_bytes()
                  assert len(data) <= 20*1024*1024 and hashlib.sha256(data).hexdigest() == digest
                  digests[mapped] = digest
              assert set(digests) == set(generated[:-1])
              for name in generated:
                  original = source/name
                  assert original.is_file() and not original.is_symlink() and original.stat().st_size <= 20*1024*1024
                  target = root/'generated'/name
                  target.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  shutil.copyfile(original, target)
              report['generatedAssetCount'] = len(generated)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write('assets-ready=true\n')
              report['stages'].append({'stage': 'generated-assets', 'exitCode': 0, 'timedOut': False})
              checkpoint()
              command('java-build', ['./gradlew', '--no-daemon', '--dependency-verification', 'strict', 'clean', 'installDist', 'agentDist', 'fixtureBootJar'], cwd=repo/'adapters/java')
              report.update(stage='adapter-verify', exitCode=1)
              checkpoint()
              adapter_paths = ('adapters/java/agent-bootstrap/build/agent-dist/xtrace-java-agent.jar', 'adapters/java/spring-fixture/build/libs/xtrace-spring-fixture.jar')
              assert all((repo/name).is_file() and not (repo/name).is_symlink() and (repo/name).stat().st_size > 0 for name in adapter_paths)
              agent = repo/'adapters/java/agent-bootstrap/build/agent-dist'
              agent_manifest = agent/'manifest.sha256'
              assert agent_manifest.is_file() and not agent_manifest.is_symlink() and agent_manifest.stat().st_size <= 65536
              agent_members = set()
              for line in agent_manifest.read_text().splitlines():
                  digest, name = line.split('  ')
                  parts = pathlib.PurePosixPath(name).parts
                  assert re.fullmatch('[0-9a-f]{64}', digest) and parts and not name.startswith('/') and all(part not in ('.','..') for part in parts)
                  assert name not in agent_members and name.endswith('.jar')
                  member = agent/name
                  assert member.is_file() and not member.is_symlink() and member.stat().st_size <= 256*1024*1024
                  assert all(not (agent/pathlib.Path(*parts[:i])).is_symlink() for i in range(1,len(parts)))
                  with member.open('rb') as stream:
                      assert hashlib.file_digest(stream, 'sha256').hexdigest() == digest
                  agent_members.add(name)
              assert 2 <= len(agent_members) <= 128 and 'xtrace-java-agent.jar' in agent_members and any(name.startswith('runtime/') for name in agent_members)
              report['adapterArtifactCount'] = len(adapter_paths)
              report['verifiedAgentJarCount'] = len(agent_members)
              report['stages'].append({'stage': 'adapter-verify', 'exitCode': 0, 'timedOut': False})
              checkpoint()
              # Hosted Ubuntu already supplies Chromium libraries; no privileged dependency installer.
              command('chromium-install', ['npm', 'exec', '--', 'playwright', 'install', 'chromium'], cwd=repo/'web/app')
              report.update(stage='source-scope', exitCode=1)
              checkpoint()
              dirty = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], env=env, text=True).splitlines()
              assert set(dirty) <= {'crates/xtrace-daemon/assets/ui/'+name for name in generated}
              assert not subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], env=env)
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], env=env, text=True).strip() == env['PRODUCT']
              report['stages'].append({'stage': 'source-scope', 'exitCode': 0, 'timedOut': False})
              checkpoint()
              # Keep lane_run's existing 3000s command limit, readiness and browser limits unchanged.
              command('spring-browser', lane + ['--suite', 'rust', '--variant', '17', '--step', 'spring-browser', '--min-passed', '1', '--ci-diagnostics', '--', 'cargo', 'test', '--locked', '--all-features', '--features', 'xtrace-private-storage/ci-diagnostics', '-p', 'xtrace-cli', '--test', 'java_run_spring', 'run_launches_spring_fixture_captures_selected_root_and_forwards_shutdown', '--', '--exact', '--nocapture'], timeout=3060)
              fragment('rust__17__spring-browser.json', 1, 'spring', 'spring-count-validation')
              command('empty-browser', lane + ['--suite', 'rust', '--variant', '17', '--step', 'empty-browser', '--min-passed', '1', '--ci-diagnostics', '--', 'cargo', 'test', '--locked', '--all-features', '--features', 'xtrace-private-storage/ci-diagnostics', '-p', 'xtrace-cli', '--test', 'java_run_spring', 'viewer_first_recording_and_help_tour_open_on_an_empty_project', '--', '--exact', '--nocapture'], timeout=3060)
              fragment('rust__17__empty-browser.json', 1, 'empty', 'empty-count-validation')
              report.update(status='awaiting-browser-receipt', stage='jump-receipt-validation', exitCode=0, countsComplete=False)
          except Exception:
              report.update(status='fail', exitCode=report['exitCode'] or 1, countsComplete=False)
              # Never publish exception text, argv, logs, trace values or diagnostic files.
          checkpoint()
          sys.exit(0 if report['status'] == 'awaiting-browser-receipt' else 1)
          PY
      - name: Verify the export download judge on its complete regression suite
        id: export-judge
        if: ${{ !cancelled() && steps.root.outputs.admitted == 'true' }}
        run: |
          set -euo pipefail
          umask 077
          if ! command -v b3sum >/dev/null; then
            mkdir -m 700 "$PROOF_ROOT/cache/b3sum"
            (
              cd "$PROOF_ROOT/cache/b3sum"
              apt-get download b3sum
              debs=(b3sum_*.deb)
              [[ ${#debs[@]} == 1 && -f ${debs[0]} && ! -L ${debs[0]} ]]
              dpkg-deb -x "${debs[0]}" b3
            ) >"$PROOF_ROOT/logs/b3sum-setup.log" 2>&1
            export PATH="$PROOF_ROOT/cache/b3sum/b3/usr/bin:$PATH"
          fi
          python3 -B -c 'from tools.qa.installed_export_journey import blake3_bytes; assert blake3_bytes(b"abc") == "6437b3ac38465133ffb63b75273a8db548c558465d79db03fd359c6cd5bd9d85"' >"$PROOF_ROOT/logs/b3sum-vector.log" 2>&1
          rc=0
          python3 -B -m tools.qa.unittest_run --result "$PROOF_ROOT/receipts/export-judge.private.json" tools.qa.test_installed_export_journey tools.qa.test_export_visual_evidence >"$PROOF_ROOT/logs/export-judge.log" 2>&1 || rc=$?
          python3 -B -m tools.qa.unittest_summary "$PROOF_ROOT/receipts/export-judge.private.json" >"$PROOF_ROOT/logs/export-judge-summary.log" 2>&1
          python3 -B - <<'PYCOUNTS'
          import os, pathlib
          from tools.release.private_roots import read_private_json
          path = pathlib.Path(os.environ['PROOF_ROOT'])/'receipts/export-judge.private.json'
          counts = read_private_json(path, maximum_bytes=65536, maximum_nodes=1024, maximum_commas=1024)['counts']
          expected = {'testsRun': 51, 'failures': 0, 'errors': 0, 'skipped': 0, 'expectedFailures': 0, 'unexpectedSuccesses': 0}
          if set(counts) != set(expected) or any(type(counts[key]) is not int or counts[key] != val for key, val in expected.items()):
              raise SystemExit('Export judge coverage failed')
          PYCOUNTS
          exit "$rc"
      - name: Project bounded progress and encrypt allowlisted viewport frames
        id: visual
        if: ${{ always() && steps.root.outputs.admitted == 'true' }}
        env:
          EXPORT_JUDGE_OUTCOME: ${{ steps.export-judge.outcome }}
          # Public certificate only; supplied from the existing qualified viewer visual recipient.
          RECIPIENT_CERT: |
            -----BEGIN CERTIFICATE-----
            MIIERzCCAq+gAwIBAgIUJgaIGZvHvTO1qz7A91QyCXVCBLwwDQYJKoZIhvcNAQEL
            BQAwMzExMC8GA1UEAwwoWC10cmFjZSBkZXZlbG9wbWVudCB2aWV3ZXIgdmlzdWFs
            IHJldmlldzAeFw0yNjExMjUxNzQ1MjdaFw0yNjEyMDkxNzQ1MjdaMDMxMTAvBgNV
            BAMMKFgtdHJhY2UgZGV2ZWxvcG1lbnQgdmlld2VyIHZpc3VhbCByZXZpZXcwggGi
            MA0GCSqGSIb3DQEBAQUAA4IBjwAwggGKAoIBgQDUCDMtoLNBiFxpd01HnkpFVMon
            DCZYbJiETXhyeSC/ecpMarzXEZ4ju0nd4LZwjL/A4Mx9T4JBA4pdFAQDPlnOfG6N
            J+CQToj6WgpXFWUHpJp3yqfWqRRNj2LC10+slMqtzfcMRORiIYzzco9Uavy4a4zL
