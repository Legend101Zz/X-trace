name: profile-positional-write-temporary
on:
  push:
    branches: [codex/profile-positional-write-78]
permissions:
  contents: read
jobs:
  compare-profile-overwrites:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Prepare private measurement directories
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP:?}/xf"
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/fixture" "$root/diagnostic"
          echo "XTRACE_PROFILE_WRITE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Verify exact bytes and compare paired diagnostic overwrite timings
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_PROFILE_WRITE_ROOT"
          export XTRACE_PROFILE_WRITE_SCRATCH="$root/fixture"
          if ! rustc --edition=2024 tools/qa/fixtures/profile_positional_write_measurement.rs \
            -o "$root/measurement" > "$root/diagnostic/compile.log" 2>&1; then
            echo "Profile overwrite benchmark did not compile"
            exit 1
          fi
          if ! "$root/measurement" > "$root/diagnostic/measurement.log" 2>&1; then
            echo "Profile overwrite validation or timing failed"
            exit 1
          fi
          python3 -B - "$root/diagnostic/measurement.log" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib
          import re
          import statistics
          import sys

          rows = pathlib.Path(sys.argv[1]).read_text().splitlines()
          assert len(rows) == 6
          assert rows[0] == "validated_transitions_per_method=7000000"
          assert rows[-1] == "measurement=complete"
          differences = []
          for pair, line in enumerate(rows[1:-1], 1):
              row = re.fullmatch(
                  rf"pair={pair} transitions=7000000 sequential_ns=([0-9]{{1,20}}) positional_ns=([0-9]{{1,20}})",
                  line,
              )
              assert row
              sequential, positional = map(int, row.groups())
              assert sequential > 0 and positional > 0
              differences.append((sequential - positional) / 1_000_000_000)
          median = statistics.median(differences)
          print("Fixed 160-byte profile overwrite microbenchmark")
          print("- Verified every byte for 7 million untimed transitions per method.")
          print(f"- Median seek/write minus positional write: {median:.3f}s per 7 million "
                f"transitions, paired range {min(differences):.3f} to {max(differences):.3f}s.")
          print(f"- Median difference per transition: {median * 1_000_000_000 / 7_000_000:.1f}ns.")
          print("- Prior coarse receipts had 7.500s of unassigned elapsed time for "
                "6,983,911 focused transitions and 11.724s for 1,681,394 sparse transitions. "
                "Those residuals include other profiler costs and do not isolate seeking.")
          print("- No cardinality test or floor workload was run.")
          PY
      - name: Encrypt raw synthetic diagnostics
        if: always() && env.XTRACE_PROFILE_WRITE_ROOT != ''
        env:
          EVIDENCE_CERT: 
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_PROFILE_WRITE_ROOT"
          printf '%s' "$EVIDENCE_CERT" | base64 -d > "$root/evidence.crt"
          tar -C "$root" -cf - diagnostic | openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER -out "$root/profile-write.enc" "$root/evidence.crt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.XTRACE_PROFILE_WRITE_ROOT != ''
        with:
          name: encrypted-profile-overwrite-measurement
          path: ${{ env.XTRACE_PROFILE_WRITE_ROOT }}/profile-write.enc
          if-no-files-found: error
          retention-days: 1
