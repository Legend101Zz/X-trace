# SOURCE_SHA must contain reviewed #102 + #84/#89 packaging/default analyzer and embedded viewer.
# No acceptance, release signing, macOS, external application or Postman workspace claim.
name: Installed Spring export browser proof
on:
  push:
    branches: [codex/proof-installed-landscape-102]
permissions:
  contents: read
jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: acd713cd70fec0d77f50f5d816f4f146ceedad8c
      SOURCE_TREE: d68842e3b3a98b138ddc0b1d684859ace7146e1c
      JOURNEY_BLOB: b552e2340f4bce48bce53a69f38c87a8426aa03f
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # package.yml v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # package.yml v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # package.yml v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: Admit fresh private root
        id: root
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'PY'
          import os, pathlib, re, subprocess
          from tools.release.private_roots import ensure_private_directory
          sha = os.environ['SOURCE_SHA']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == sha
          for ref, key in [('HEAD^{tree}', 'SOURCE_TREE'), ('HEAD:web/app/scripts/installed-export-journey.mjs', 'JOURNEY_BLOB')]:
              assert re.fullmatch('[0-9a-f]{40}', os.environ[key])
              assert subprocess.check_output(['git', 'rev-parse', ref], text=True).strip() == os.environ[key]
          assert not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'])
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'xe'
          # Rejected/existing roots are never inspected, chmodded, deleted or uploaded.
          ensure_private_directory(root, must_create=True)
          for name in ('logs', 'safe', 'tmp', 'cache', 'packages'):
              ensure_private_directory(root / name, must_create=True)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'PROOF_ROOT={root}\nTMPDIR={root}/tmp\nPLAYWRIGHT_BROWSERS_PATH={root}/cache/chromium\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('admitted=true\n')
          PY
      - name: Build verify install and exercise exact package privately
        id: proof
        if: steps.root.outputs.admitted == 'true'
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys, tarfile
          from tools.release.private_roots import admit_directory
          root = pathlib.Path(os.environ['PROOF_ROOT'])
          admit_directory(root)
          repo = pathlib.Path.cwd()
          report = {'schemaVersion': 1, 'releaseEvidence': False, 'status': 'fail', 'stage': 'source-check', 'exitCode': 1, 'sourceSha': os.environ['SOURCE_SHA'], 'sourceTree': os.environ['SOURCE_TREE'], 'journeyBlob': os.environ['JOURNEY_BLOB'], 'packageSha256': None, 'countsComplete': False}
          labels = {'source-check', 'b3sum-download', 'b3sum-extract', 'b3sum-vector', 'package-build', 'archive-verify', 'dist-verify', 'archive-extract', 'fresh-install', 'installed-verify', 'fixture-build', 'browser-dependencies', 'chromium-install', 'source-clean', 'installed-journey'}
          env = dict(os.environ)
          for key in ('XTRACE_JAVA_ANALYZER', 'XTRACE_NODE_ANALYZER', 'XTRACE_JAVA_PACK', 'XTRACE_JAVA_AGENT', 'JAVA_TOOL_OPTIONS', 'JDK_JAVA_OPTIONS', '_JAVA_OPTIONS'):
              env.pop(key, None)
          index = 0
          def command(label, args, cwd=repo, timeout=3600):
              global index
              assert label in labels
              index += 1
              report.update(stage=label, exitCode=1)
              with (root/'logs'/f'{index}.stdout').open('xb') as out, (root/'logs'/f'{index}.stderr').open('xb') as err:
                  try:
                      result = subprocess.run(args, cwd=cwd, env=env, stdout=out, stderr=err, timeout=timeout, check=False)
                      code = result.returncode
                  except subprocess.TimeoutExpired:
                      code = 124
              report['exitCode'] = code
              if code:
                  raise RuntimeError('stage-failed')
          try:
              command('source-check', ['git', 'diff', '--exit-code', 'HEAD'])
              debdir = root/'packages'
              command('b3sum-download', ['apt-get', 'download', 'b3sum'], cwd=debdir)
              debs = list(debdir.glob('b3sum_*.deb'))
              assert len(debs) == 1
              command('b3sum-extract', ['dpkg-deb', '-x', str(debs[0]), str(debdir/'b3')])
              env['PATH'] = str(debdir/'b3/usr/bin') + os.pathsep + env['PATH']
              command('b3sum-vector', ['python3', '-B', '-c', 'from tools.qa.installed_export_journey import blake3_bytes; assert blake3_bytes(b"abc") == "6437b3ac38465133ffb63b75273a8db548c558465d79db03fd359c6cd5bd9d85"'])
              command('package-build', ['python3', '-B', 'packaging/build.py', '--out', str(root/'dist'), '--work', str(root/'build'), '--platform', 'linux-x86_64'])
              archives = list((root/'dist/linux-x86_64').glob('xtrace-*-linux-x86_64.tar.gz'))
              assert len(archives) == 1
              archive = archives[0]
              with archive.open('rb') as stream:
                  sha256 = hashlib.file_digest(stream, 'sha256').hexdigest()
              report['packageSha256'] = sha256
              command('archive-verify', ['python3', '-B', 'packaging/verify_package.py', str(archive), '--repo', str(repo), '--run-binary'])
              command('dist-verify', ['sh', 'packaging/install.sh', 'verify-dist', str(archive.parent)])
              extracted = root/'extracted'
              extracted.mkdir(mode=0o700)
              report.update(stage='archive-extract', exitCode=1)
              with tarfile.open(archive, 'r:gz') as bundle:
                  bundle.extractall(extracted, filter='data')
              installs = list(extracted.glob('xtrace-*/install.sh'))
              assert len(installs) == 1
              prefix = root/'fresh installed prefix'
              assert not prefix.exists()
              env['XTRACE_DATA_HOME'] = str(root/'install-data')
              command('fresh-install', ['sh', str(installs[0]), 'install', '--prefix', str(prefix), '--data-home', str(root/'install-data')])
              command('installed-verify', ['sh', str(prefix/'current/install.sh'), 'verify', '--prefix', str(prefix)])
              command('fixture-build', ['./gradlew', '--no-daemon', '--dependency-verification', 'strict', ':spring-fixture:bootJar'], cwd=repo/'adapters/java')
              command('browser-dependencies', ['npm', 'ci', '--ignore-scripts', '--no-audit', '--no-fund'], cwd=repo/'web/app')
              command('chromium-install', ['npm', 'exec', '--', 'playwright', 'install', 'chromium'], cwd=repo/'web/app')
              # Builds may create ignored output but must leave tracked and untracked source clean.
              report.update(stage='source-clean', exitCode=1)
              dirty = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], env=env)
              assert not dirty
              journey = root/'journey'
              assert not journey.exists()
              command('installed-journey', ['python3', '-B', 'tools/qa/installed_export_journey.py', '--prefix', str(prefix), '--package', str(archive), '--package-sha256', sha256, '--source-sha', os.environ['SOURCE_SHA'], '--repo', str(repo), '--fixture-jar', str(repo/'adapters/java/spring-fixture/build/libs/xtrace-spring-fixture.jar'), '--java', str(pathlib.Path(os.environ['JAVA_HOME'])/'bin/java'), '--private-dir', str(journey), '--summary', str(root/'journey-summary.private.json')], timeout=1200)
              report.update(status='pass', exitCode=0)
          except Exception:
              pass  # Only fixed stage and numeric exit are exported, never exception text.
          # Only a validated sibling receipt establishes positive journey ownership.
          # A failed admission before packageVerified never permits child traversal.
          import stat
          value = {}
          summary = root/'journey-summary.private.json'
          try:
              info = summary.lstat()
              if stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid() and stat.S_IMODE(info.st_mode) == 0o600 and info.st_size <= 65536:
                  with summary.open('rb') as stream:
                      raw = stream.read(65537)
                  if len(raw) <= 65536:
                      candidate = json.loads(raw)
                      if (isinstance(candidate, dict) and candidate.get('schemaVersion') == 1
                              and candidate.get('kind') == 'installed-spring-export-journey'
                              and candidate.get('sourceSha') == os.environ['SOURCE_SHA']
                              and candidate.get('packageSha256') == report['packageSha256']):
                          value = candidate
          except (OSError, ValueError):
              pass
          reasons = ('scanned-revision-selection', 'supported-observed-scope', 'supported-orders-uuid-alias', 'absolute-prerequisites', 'approval-digest', 'archive-digest', 'archive-manifest', 'b3sum-failed', 'b3sum-known-vector', 'b3sum-prerequisite', 'browser-coverage', 'catalog-scope-resolution', 'cli-did-not-write', 'cli-inventory', 'cli-membership', 'cli-metadata', 'command-failed', 'command-output-limit', 'command-timeout', 'digest-parity', 'download-bytes', 'duplicate-preview-name', 'duplicate-recipe-ordinal', 'file-byte-digest', 'file-digest-parity', 'fixture-build-location', 'genuine-recording', 'genuine-scan-scope', 'harness-error', 'host-platform', 'installed-agent', 'installed-cli', 'installed-manifest-parity', 'installed-package-parity', 'logical-export-limit', 'observed-endpoint', 'omission-count', 'omission-group-parity', 'omission-parity', 'operation-parity', 'ordinal-parity', 'package-verification', 'prerequisites', 'preview-inventory', 'preview-mode', 'preview-name', 'preview-schema', 'preview-size', 'privacy-hit-or-coverage-gap', 'private-directory-not-fresh', 'private-file-limit', 'private-parent-permissions', 'project-init', 'provenance-shape', 'recipe-ordinal', 'recording-decoding-incomplete', 'revision-parity', 'scan-incomplete', 'selected-operation-count', 'source-dirty', 'source-revision', 'spring-exited-before-ready', 'spring-handler-not-observed', 'spring-output-drain', 'spring-output-io', 'spring-output-limit', 'spring-port-signal', 'spring-readiness', 'spring-recording-terminal', 'spring-shutdown-status', 'spring-shutdown-timeout', 'spring-workload', 'unsafe-cli-member', 'zip-bytes', 'zip-determinism', 'zip-duplicate', 'zip-membership', 'zip-mode', 'zip-path')
          if isinstance(value.get('reason'), str) and value['reason'] in reasons:
              report['reason'] = value['reason']
          positive = value.get('packageVerified') is True
          child_stages = []
          journey = root/'journey'
          try:
              if not positive:
                  raise ValueError('no-positive-ownership')
              admit_directory(journey)
              journey_admitted = journey.is_dir() and not journey.is_symlink()
          except Exception:
              journey_admitted = False
          if journey_admitted:
              logs = journey/'commands'
              if logs.is_dir() and not logs.is_symlink():
                  try:
                      admit_directory(logs)
                  except Exception:
                      logs = root/'absent-diagnostic-root'
                  # Fixed bounded numeric inventory; never recursive or unbounded globbing.
                  for index in range(1, 1001):
                      path = logs/f'{index}.status.json'
                      if not path.exists():
                          continue
                      if path.is_symlink() or path.stat().st_size > 8192:
                          continue
                      try:
                          status = json.loads(path.read_bytes())
                      except (ValueError, OSError):
                          continue
                      argvpath = path.with_name(path.name.replace('.status.json', '.command.json'))
                      if argvpath.is_symlink() or not argvpath.is_file() or argvpath.stat().st_size > 65536:
                          continue
                      try:
                          args = json.loads(argvpath.read_bytes()).get('argv', [])
                          if not isinstance(args, list) or not all(isinstance(arg, str) for arg in args):
                              continue
                      except (ValueError, OSError):
                          continue
                      label = None
                      if len(args) > 1 and args[1] in ('init', 'scan', 'export'):
                          label = {'init': 'project-init', 'scan': 'installed-default-scan', 'export': 'cli-export'}[args[1]]
                      elif len(args) > 2 and (args[1], args[2]) in (('recording','list'), ('recording','show'), ('endpoint','list'), ('endpoint','recordings'), ('catalog','list')):
                          label = '-'.join(args[1:3])
                      elif len(args) > 1 and args[1].endswith('/web/app/scripts/installed-export-journey.mjs'):
                          label = 'embedded-browser'
                      elif len(args) > 1 and args[1].endswith('/packaging/verify_package.py'):
                          label = 'full-package-verifier'
                      elif len(args) > 2 and args[1].endswith('/install.sh') and args[2] == 'verify':
                          label = 'official-installed-verifier'
                      elif len(args) > 3 and args[0] == 'git' and args[1] == '-C' and args[3] in ('status', 'rev-parse'):
                          label = 'source-identity'
                      if label and type(status.get('exitCode')) is int:
                          child_stages.append({'stage': label, 'exitCode': status['exitCode'], 'timedOut': status.get('timedOut') is True, 'outputLimited': status.get('outputLimited') is True})
          report['commands'] = child_stages
          for key in ('supportedOrdersUuidAlias', 'sameProjectCatalogLinked'):
              report[key] = value[key] if positive and type(value.get(key)) is bool else None
          if positive:
              for key in ('genuineRequests', 'viewports', 'downloads', 'logicalFilesCompared', 'privacySurfaces'):
                  if type(value.get(key)) is int and 0 <= value[key] <= 100000:
                      report[key] = value[key]
          report['browserProjection'] = 'unavailable'
          if journey_admitted:
              browser = journey/'browser'
              if browser.is_dir() and not browser.is_symlink():
                  try:
                      from tools.qa.installed_export_journey import browser_evidence_source, load_browser_receipt
                      admit_directory(browser)
                      result_file = browser/'browser.private.json'
                      if result_file.exists() or result_file.is_symlink():
                          identity = {'sourceSha': report['sourceSha'], 'packageSha256': report['packageSha256']}
                          _, projection = load_browser_receipt(result_file, expected_identity=identity, expected_evidence_source=browser_evidence_source(pathlib.Path.cwd()))
                          report.update(projection)
                          report['browserProjection'] = 'validated'
                  except Exception:
                      report['browserProjection'] = 'invalid'
          if report['status'] == 'pass' and (report['browserProjection'] != 'validated' or report.get('browserStatus') != 'pass'):
              report.update(status='fail', stage='browser-projection', exitCode=1)
          report['countsComplete'] = positive and value.get('status') == 'pass' and report['status'] == 'pass'
          (root/'safe/counts.json').write_text(json.dumps(report, sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('receipt-ready=true\n')
          print(json.dumps(report, sort_keys=True))
          sys.exit(0 if report['status'] == 'pass' else 1)
          PY
      - name: Encrypt allowlisted visual evidence only
        id: visual
        if: ${{ always() && steps.root.outputs.admitted == 'true' }}
        env:
          # Public recipient certificate ONLY. No private key or build-step env injection.
          RECIPIENT_CERT: |
            -----BEGIN CERTIFICATE-----
