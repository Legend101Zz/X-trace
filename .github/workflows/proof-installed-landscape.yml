        run: |
          python3 -B - <<'PY'
          import io, json, os, pathlib, stat, subprocess, tarfile
          from tools.release.private_roots import admit_directory
          from tools.qa.export_visual_evidence import collect_visuals
          root = pathlib.Path(os.environ['PROOF_ROOT'])
          admit_directory(root)
          # Read the safe verdict first: a would-be pass must not silently omit visual evidence.
          try:
              counts_path = root/'safe/counts.json'
              assert counts_path.is_file() and not counts_path.is_symlink() and counts_path.stat().st_size <= 128*1024
              counts = json.loads(counts_path.read_bytes())
              assert isinstance(counts, dict)
          except Exception:
              raise SystemExit(1)
          passing = counts.get('status') == 'pass'
          def refused():
              raise SystemExit(1 if passing else 0)
          summary = root/'journey-summary.private.json'
          try:
              info = summary.lstat()
              if not (stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid() and stat.S_IMODE(info.st_mode) == 0o600 and info.st_size <= 65536):
                  refused()
              with summary.open('rb') as stream:
                  data = stream.read(65537)
              if len(data) > 65536:
                  refused()
              value = json.loads(data)
              if not (value.get('packageVerified') is True and value.get('schemaVersion') == 1
                      and value.get('kind') == 'installed-spring-export-journey'
                      and value.get('sourceSha') == os.environ['SOURCE_SHA']
                      and value.get('packageSha256') == counts.get('packageSha256')):
                  refused()
              journey = root/'journey'
              admit_directory(journey)
              browser = journey/'browser'
              admit_directory(browser)
              selected, visual_refusals = collect_visuals(browser, require_complete=passing)
          except Exception:
              refused()
          if not selected:
              refused()
          encrypted = root/'encrypted'
          try:
              payload = io.BytesIO()
              with tarfile.open(fileobj=payload, mode='w:gz') as archive:
                  for name, data in selected:
                      info = tarfile.TarInfo(name)
                      info.size, info.mode, info.mtime = len(data), 0o600, 0
                      archive.addfile(info, io.BytesIO(data))
              cert = root/'recipient.pem'
              cert.write_text(os.environ['RECIPIENT_CERT'])
              encrypted = root/'encrypted'
              encrypted.mkdir(mode=0o700)
              with (root/'logs/encryption.stderr').open('xb') as err:
                  result = subprocess.run(['openssl', 'cms', '-encrypt', '-binary', '-aes-256-gcm', '-outform', 'DER', '-out', str(encrypted/'visuals.cms'), str(cert)], input=payload.getvalue(), stdout=subprocess.DEVNULL, stderr=err, check=False, timeout=60)
              encrypted_ok = result.returncode == 0 and (encrypted/'visuals.cms').is_file() and (encrypted/'visuals.cms').stat().st_size > 0
          except Exception:
              encrypted_ok = False
          if not encrypted_ok:
              # Never upload plaintext or a failed/partial encrypted file.
              try:
                  (encrypted/'visuals.cms').unlink(missing_ok=True)
              except OSError:
                  pass
              raise SystemExit(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('ready=true\n')
          print('encryptedVisualCount=' + str(len(selected)))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && steps.proof.outputs['receipt-ready'] == 'true' }}
        with:
          name: installed-export-counts
          path: ${{ env.PROOF_ROOT }}/safe/counts.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.visual.outputs.ready == 'true' }}
        with:
          name: installed-export-encrypted-visuals
          path: ${{ env.PROOF_ROOT }}/encrypted/visuals.cms
          if-no-files-found: error
          retention-days: 1
