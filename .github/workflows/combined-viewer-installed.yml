      run:
        shell: bash
        working-directory: product
    steps:
      - name: Check out qualified generated product, source and installer-fix parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Read exact reviewed wrapper helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: wrapper
          fetch-depth: 2
          sparse-checkout: .github/proof/combined-viewer-installed-144
          persist-credentials: false
