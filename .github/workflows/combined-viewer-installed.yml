          PYTHONPATH="$PWD:$PROOF_SCRIPTS" python3 -B "$PROOF_SCRIPTS/finalize.py" >"$SHARED_ROOT/logs/finalize.stdout" 2>"$SHARED_ROOT/logs/finalize.stderr"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.root.outputs.admitted == 'true' }}
        with:
          name: assembled-installed-bounded-counts
          path: ${{ env.SHARED_ROOT }}/safe/assembled.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.visual.outputs.ready == 'true' }}
        with:
          name: assembled-installed-encrypted-native-visuals
          path: ${{ env.SHARED_ROOT }}/encrypted/visuals.cms
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.diagnostic.outputs.ready == 'true' }}
        with:
          name: assembled-installed-encrypted-package-diagnostics
          path: ${{ env.SHARED_ROOT }}/encrypted/package-diagnostics.cms
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.export_diagnostic.outputs.ready == 'true' }}
        with:
          name: assembled-installed-encrypted-export-command-diagnostic
          path: ${{ env.SHARED_ROOT }}/encrypted/export-command-diagnostic.cms
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.root.outputs.admitted == 'true' }}
        with:
          name: owner-plan-viewer-installed-prerequisites
          path: ${{ runner.temp }}/xq121/safe/qualification.json
          if-no-files-found: error
