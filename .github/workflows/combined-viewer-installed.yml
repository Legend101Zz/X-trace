          import os, subprocess
          expected=['A\t.github/proof/combined-viewer-installed-144/SHA256SUMS', 'A\t.github/proof/combined-viewer-installed-144/common.py', 'A\t.github/proof/combined-viewer-installed-144/export-assets-hook.mjs', 'A\t.github/proof/combined-viewer-installed-144/export-diagnostic.py', 'A\t.github/proof/combined-viewer-installed-144/export-driver.py', 'A\t.github/proof/combined-viewer-installed-144/export-receipt-regressions.py', 'A\t.github/proof/combined-viewer-installed-144/export_receipt.py', 'A\t.github/proof/combined-viewer-installed-144/finalize.py', 'A\t.github/proof/combined-viewer-installed-144/installer-journey.py', 'A\t.github/proof/combined-viewer-installed-144/package-diagnostic.py', 'A\t.github/proof/combined-viewer-installed-144/package-driver.py', 'A\t.github/proof/combined-viewer-installed-144/qualification.py', 'A\t.github/proof/combined-viewer-installed-144/replay-browser.mjs', 'A\t.github/proof/combined-viewer-installed-144/replay-driver.py', 'A\t.github/proof/combined-viewer-installed-144/tour-browser.mjs', 'A\t.github/proof/combined-viewer-installed-144/tour-driver.py', 'A\t.github/proof/combined-viewer-installed-144/viewer-traffic.mjs', 'A\t.github/proof/combined-viewer-installed-144/visuals.py', 'A\t.github/workflows/combined-viewer-installed.yml']
          actual=subprocess.check_output(['git','-C','../wrapper','diff','--name-status',os.environ['PRODUCT'],os.environ['GITHUB_SHA']],text=True).splitlines()
          assert actual==expected
          for name in (entry.split('\t')[1] for entry in expected):
              row=subprocess.check_output(['git','-C','../wrapper','ls-tree',os.environ['GITHUB_SHA'],'--',name],text=True)
              assert row.startswith('100644 blob ') and row.rstrip('\n').endswith('\t'+name)
          INVENTORY
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test "$(git rev-parse "$ASSEMBLED_SOURCE_SHA^{tree}")" = "$ASSEMBLED_SOURCE_TREE"
          test "$(git rev-parse HEAD:web/app/scripts/browser-journey.mjs)" = "$REPLAY_SOURCE_BLOB"
          test "$(git rev-parse HEAD:web/app/scripts/replay-tools-journey.mjs)" = "$REPLAY_TOOLS_BLOB"
          test "$(git rev-parse HEAD:web/app/scripts/installed-export-journey.mjs)" = "$JOURNEY_BLOB"
          test -z "$(git status --porcelain --untracked-files=all)"
          root="$RUNNER_TEMP/xai1"
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/logs" "$root/private" "$root/safe" "$root/packages" "$root/encrypted"
          for name in replay tour export; do
            mkdir -m 700 "$root/$name" "$root/$name/logs" "$root/$name/private" "$root/$name/safe" "$root/$name/shots"
          done
          mkdir -m 700 "$root/replay/shots/existing" "$root/replay/shots/compact-open"
          printf '%s\n' "SHARED_ROOT=$root" "PROOF_SCRIPTS=$scripts" "TMPDIR=$root/tmp" "PLAYWRIGHT_BROWSERS_PATH=$root/chromium" >> "$GITHUB_ENV"
          printf '%s\n' 'admitted=true' >> "$GITHUB_OUTPUT"
