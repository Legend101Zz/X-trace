      - name: Check installed Map over the verified ordinary archive
        id: installed-map-10k
        if: ${{ always() && steps.root.outputs.admitted == 'true' && steps.package.outputs.pass == 'true' }}
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
          MAP_PRODUCT: '6c9d0f48099408f9c5c38e147590797538fbe927'
          MAP_PRODUCT_TREE: '3623626ec371eb9d17526d89b22ac6072c0600f4'
          MAP_UI_MANIFEST_SHA256: '507262f9a0b03c7d18bfebc769bdc782321c598a95de0d42812903ac6b672f5d'
          SUCCESSOR_SOURCE_RUN_ID: '45835160467'
          SUCCESSOR_SOURCE_WRAPPER: '4ce9d67a31daac9e316f910462f9128396ed8dfa'
          SUCCESSOR_SOURCE_ASSETS_ID: '15124293717'
          SUCCESSOR_SOURCE_ASSETS_BYTES: '162521'
          SUCCESSOR_SOURCE_ASSETS_ZIP_SHA256: '3900d8753c84e4f60fef9fec70ccbfae8102ef182302e0ec2e6b3c87a5956eaf'
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH="$PWD:$PROOF_SCRIPTS" python3 -B "$PROOF_SCRIPTS/map-installed-proof.py" \
            > "$SHARED_ROOT/logs/map10k-outer.log" 2>&1
      - name: Finalize the bounded installed Map result
        id: installed-map-result
        if: ${{ always() && steps.root.outputs.admitted == 'true' }}
        env:
          MAP_OUTCOME: ${{ steps.installed-map-10k.outcome }}
          MAP_PRODUCT: '6c9d0f48099408f9c5c38e147590797538fbe927'
          MAP_PRODUCT_TREE: '3623626ec371eb9d17526d89b22ac6072c0600f4'
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ['SHARED_ROOT'])
          path = root / 'safe/installed-map-10k.json'
          outcome = os.environ['MAP_OUTCOME']
          if outcome not in ('success', 'failure', 'cancelled', 'skipped'):
              outcome = 'unobserved'
          base = dict(schemaVersion=1, kind='same-archive-installed-map-10k-functional',
                      releaseAcceptance=False, sourceSha=os.environ['MAP_PRODUCT'],
                      sourceTree=os.environ['MAP_PRODUCT_TREE'], wrapperSha=os.environ['GITHUB_SHA'],
                      runId=int(os.environ['GITHUB_RUN_ID']), runAttempt=int(os.environ['GITHUB_RUN_ATTEMPT']))
          actual = {}
          try:
              if path.is_file() and not path.is_symlink() and 0 < path.stat().st_size <= 65536:
                  candidate = json.loads(path.read_bytes())
                  if isinstance(candidate, dict) and all(candidate.get(k) == v for k, v in base.items()):
                      actual = candidate
          except (OSError, UnicodeError, ValueError):
              pass
          stage = actual.get('stage')
          if stage not in ('admission', 'fixture', 'browser', 'verify', 'complete'):
              stage = 'unobserved'
          hashes = ('archiveSha256', 'packageManifestSha256', 'uiManifestSha256', 'installedCliSha256',
                    'proofScriptSha256', 'historicalMapSourceReceiptSha256',
                    'successorMapSourceReceiptSha256', 'successorMapAssetsZipSha256',
                    'successorOrdinarySourceAssetsSha256')
          commits = ('historicalMapSourceSha', 'historicalMapSourceWrapper', 'successorMapSourceWrapper',
                     'successorOrdinarySourceSha', 'successorOrdinarySourceTree', 'successorOrdinarySourceWrapper')
          ids = ('historicalMapSourceRunId', 'successorMapSourceRunId', 'successorOrdinarySourceRunId')
          def hex_field(key, length):
              value = actual.get(key)
              return isinstance(value, str) and re.fullmatch(f'[0-9a-f]{{{length}}}', value)
          exact = dict(frames=10000, samples=1, laterPages=12, timingMeasured=False,
                       mapKeyRequests=0, stepsReturnRequests=0)
          mounted, visible = actual.get('mountedAtEnd'), actual.get('visibleAtEnd')
          qualified = (actual.get('status') == 'passed' and stage == 'complete'
                       and all(type(actual.get(key)) is type(value) and actual[key] == value
                               for key, value in exact.items())
                       and all(hex_field(key, 64) for key in hashes)
                       and all(hex_field(key, 40) for key in commits)
                       and all(type(actual.get(key)) is int and 0 < actual[key] < 10**20 for key in ids)
                       and type(mounted) is int and type(visible) is int and 0 < visible <= mounted <= 80)
          passed = outcome == 'success' and qualified
          status = 'passed' if passed else 'not-reached' if outcome == 'skipped' else 'failed'
          result = dict(base, status=status, stage=stage, stepOutcome=outcome,
                        exitVerdict='accepted' if passed else 'unreached' if status == 'not-reached' else 'rejected')
          if passed:
              result.update({key: actual[key] for key in (*hashes, *commits, *ids)})
              result.update(exact, mountedAtEnd=mounted, visibleAtEnd=visible)
          tmp = root / 'safe/.installed-map-10k-final'
          with tmp.open('x') as output:
              json.dump(result, output, sort_keys=True)
              output.write('\n')
          tmp.replace(path)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=true\n')
          # A successful command with an invalid receipt cannot qualify Map.
          if outcome == 'success' and not passed:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.installed-map-result.outputs.ready == 'true' }}
        with:
          name: installed-map-10k-bounded-result
          path: ${{ env.SHARED_ROOT }}/safe/installed-map-10k.json
          if-no-files-found: error
          retention-days: 7
