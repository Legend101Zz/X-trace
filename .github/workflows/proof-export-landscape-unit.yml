name: Viewer export unit checks and embedded assets
on:
  push:
    branches: [codex/proof-export-landscape-unit-102]
permissions:
  contents: read
jobs:
  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT: d0d79ca4ede82c5e906b7edf0a47d665457c076a
      PRODUCT_TREE: 3830e3c4c1421797e4c276b32bf23abca9a34e39
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify exact checkout and prepare private output
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -m 700 "$RUNNER_TEMP/export-check" "$RUNNER_TEMP/export-counts"
          echo "OUT=$RUNNER_TEMP/export-check" >> "$GITHUB_ENV"
          echo "COUNTS=$RUNNER_TEMP/export-counts" >> "$GITHUB_ENV"
          printf '{"sourceSha":"%s","sourceTree":"%s","releaseAcceptance":false}\n' "$PRODUCT" "$PRODUCT_TREE" > "$RUNNER_TEMP/export-counts/source.json"
      - name: Verify generated contract and web types
        run: |
          set -euo pipefail
          cd web/app
          npm ci --ignore-scripts --no-audit --no-fund > "$OUT/npm.log" 2>&1
          npm run check:api > "$OUT/types-generated.log" 2>&1
          npm run typecheck > "$OUT/tsc.log" 2>&1
          for script in installed-export-journey api-evidence export-visibility; do node --check "scripts/$script.mjs"; done
      - name: Run all viewer tests and verify every source test file participated
        run: |
          set -euo pipefail
          umask 077
          cd web/app
          rc=0
          node node_modules/vitest/vitest.mjs run --reporter=json --outputFile="$OUT/vitest.json" > "$OUT/vitest.log" 2>&1 || rc=$?
          python3 - <<'PYTEST'
          import json, os, pathlib, re, subprocess
          root = pathlib.Path.cwd()
          results = json.loads((pathlib.Path(os.environ['OUT'])/'vitest.json').read_text())
          expected = {p for p in subprocess.check_output(['git','ls-files'],text=True).splitlines() if re.search(r'\.(test|spec)\.[cm]?[jt]sx?$',p)}
          reports = results['testResults']
          seen = {pathlib.Path(r['name']).relative_to(root).as_posix() for r in reports}
          if seen != expected or len(reports) != len(expected):
              raise SystemExit('viewer-test-file-coverage')
          counts = {pathlib.Path(r['name']).relative_to(root).as_posix(): {
              'passed': sum(t['status'] == 'passed' for t in r['assertionResults']),
              'other': sum(t['status'] != 'passed' for t in r['assertionResults'])
          } for r in reports}
          (pathlib.Path(os.environ['COUNTS'])/'vitest-counts.json').write_text(json.dumps(counts)+'\n')
          if (not results['success'] or any(r['status'] != 'passed' for r in reports)
                  or any(not c['passed'] or c['other'] for c in counts.values())
                  or counts['src/features/export/ExportSheet.test.tsx']['passed'] < 11
                  or counts['scripts/api-evidence.test.mjs']['passed'] < 5):
              raise SystemExit('viewer-test-outcome')
          PYTEST
          exit "$rc"
      - name: Build and verify real embedded assets
        run: |
          set -euo pipefail
          cd web/app
          node scripts/check-contrast.mjs > "$OUT/contrast.log" 2>&1
          npm run build > "$OUT/build.log" 2>&1
          npm run embed > "$OUT/embed.log" 2>&1
          npm run check:embedded > "$OUT/embed-verify.log" 2>&1
          python3 -B - <<'PYVERIFY'
          import hashlib, os, pathlib, re, shutil
          src = pathlib.Path('../../crates/xtrace-daemon/assets/ui')
          names = {'index.html', 'index.css', 'app.js', 'fonts/chivo-latin-400-normal.woff2', 'fonts/chivo-latin-600-normal.woff2', 'fonts/azeret-mono-latin-400-normal.woff2'}
          lines = (src/'assets.sha256').read_bytes()
          assert len(lines) <= 4096 and len(lines.splitlines()) == len(names)
          admitted = {}
          for line in lines.decode('ascii').splitlines():
              digest, name = line.split('  ')
              name = name.removeprefix('assets/')
              assert re.fullmatch(r'[0-9a-f]{64}', digest) and name in names and name not in admitted
              member = src/name
              assert member.is_file() and not member.is_symlink() and not member.parent.is_symlink() and member.stat().st_size <= 20*1024*1024
              assert hashlib.sha256(member.read_bytes()).hexdigest() == digest
              admitted[name] = digest
          assert set(admitted) == names and not (src/'assets.sha256').is_symlink()
          target = pathlib.Path(os.environ['OUT'])/'admitted-assets'
          target.mkdir(mode=0o700)
          for name in sorted(names | {'assets.sha256'}):
              (target/name).parent.mkdir(mode=0o700, exist_ok=True)
              shutil.copyfile(src/name, target/name)
          PYVERIFY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: export-sheet-generated-assets
          path: ${{ env.OUT }}/admitted-assets/
          if-no-files-found: error
          retention-days: 7
      - name: Verify the installed download judge on regression fixtures
        if: ${{ !cancelled() && env.COUNTS != '' }}
        run: |
          set -euo pipefail
          umask 077
          if ! command -v b3sum >/dev/null; then
            (cd "$OUT" && apt-get download b3sum > apt.log 2>&1 && dpkg-deb -x ./b3sum_*.deb ./b3)
            export PATH="$OUT/b3/usr/bin:$PATH"
          fi
          rc=0
          python3 -B -m tools.qa.unittest_run --result "$OUT/judge.json" tools.qa.test_installed_export_journey tools.qa.test_export_visual_evidence > "$OUT/judge.log" 2>&1 || rc=$?
          python3 -B -m tools.qa.unittest_summary "$OUT/judge.json"
          python3 -B - <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ['OUT'])
          counts = json.loads((out/'judge.json').read_text())['counts']
          (pathlib.Path(os.environ['COUNTS'])/'judge.json').write_text(json.dumps(counts)+'\n')
          if counts['testsRun'] != 51 or any(v for k,v in counts.items() if k != 'testsRun'):
              raise SystemExit(1)
          PY
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && env.COUNTS != '' }}
        with:
          name: export-sheet-check-counts
          path: ${{ env.COUNTS }}/*.json
          if-no-files-found: error
          retention-days: 14
