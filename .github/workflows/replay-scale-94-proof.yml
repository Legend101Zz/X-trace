name: Persisted replay scale proof
on:
  push:
    branches: [codex/replay-scale-94-proof]
permissions:
  contents: read
jobs:
  replay-scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 421c0f5aa0f063ebe654b29c84ec5fd98598dc17
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check exact product source
        run: |
          test "$(git rev-parse HEAD)" = 421c0f5aa0f063ebe654b29c84ec5fd98598dc17
          cargo fmt --all -- --check
      - name: Seed and independently read a synthetic recording
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP:?}/xt"
          mkdir -m 700 "$root" "$root/tmp" "$root/priv"
          export TMPDIR="$root/tmp" XTRACE_TEST_PRIVATE_SCRATCH="$root/priv"
          export XTRACE_SCALE_FIXTURE_MANIFEST="$root/priv/manifest.json"
          python3 -B -m tools.qa.lane_run run --suite rust --step scale-clippy --out "$root/fragments" -- \
            cargo clippy --message-format=json --locked -p xtrace-cli --test replay_scale -- -D warnings
          python3 -B -m tools.qa.lane_run run --suite rust --step scale --min-passed 1 --max-ignored 0 --out "$root/fragments" -- \
            cargo test --locked -p xtrace-cli --test replay_scale synthetic_ten_thousand_frames_are_complete_ordered_and_navigable -- --exact --nocapture
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          manifest = Path(os.environ["XTRACE_SCALE_FIXTURE_MANIFEST"])
          fields = json.loads(manifest.read_bytes())
          if (fields.get("synthetic") is not True or fields.get("verified_frame_count") != 10_000
                  or manifest.stat().st_mode & 0o077 or not Path(fields["project_dir"]).is_dir()):
              raise SystemExit("Incomplete private fixture retention")
          raw = (Path(os.environ["RUNNER_TEMP"]) / "xl/rust---scale.log").read_text()
          pattern = r"^synthetic_replay_scale: verified_frames=(\d+) first_window_size=(\d+) pages=(\d+) around_tail_frames=(\d+) complete=true capacity_drops=0 performance_claim=false$"
          matches = re.findall(pattern, raw, re.MULTILINE)
          if len(matches) != 1:
              raise SystemExit("Missing or ambiguous aggregate receipt")
          frames, first, pages, tail = map(int, matches[0])
          if not (frames == 10000 and 0 < first <= 200 and 1 < pages <= frames and 0 < tail <= 200):
              raise SystemExit("Invalid aggregate receipt")
          receipt = (f"Product 421c0f5aa0f063ebe654b29c84ec5fd98598dc17. Synthetic frames {frames}. First window {first}. "
                     f"Pages {pages}. Near-tail window {tail}. Completed, zero capacity drops. "
                     "Private retention verified. No browser or timing measurement.")
          print(receipt)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print(receipt, file=summary)
          PY
