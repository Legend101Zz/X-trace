name: scratch-root-depth-temporary
on:
  push:
    branches: [codex/scratch-root-depth-78]
permissions:
  contents: read
jobs:
  jdk17-scratch-depth-pairs:
    strategy:
      fail-fast: false
      matrix:
        workload: [focused, sparse]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Prepare the floor-shaped baseline private root
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP:?}/xf"
          [ "${#root}" -le 40 ]
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/diag"
          echo "XTRACE_SCRATCH_DEPTH_ROOT=$root" >> "$GITHUB_ENV"
      - name: Admit both root layouts and verify the runner mount and lease prerequisites
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_SCRATCH_DEPTH_ROOT"
          if ! python3 -B - "$root" > "$root/diag/root-check.log" 2>&1 <<'PY'
          import os
          import pathlib
          import re
          import secrets
          import stat
          import sys

          from tools.release import private_roots
          from tools.release.run_gates import CACHE_NAMES, LEASE_NAMES, Lease

          home = pathlib.Path(os.environ["HOME"])
          baseline = pathlib.Path(sys.argv[1])
          shorter = home / "xf"
          if not home.is_absolute() or home.resolve(strict=True) != home:
              raise RuntimeError("HOME must be an absolute canonical directory")
          if os.getuid() != os.geteuid() or os.getuid() == 0:
              raise RuntimeError("expected an unprivileged runner identity")
          home_stat = home.stat()
          if home_stat.st_uid != os.getuid() or stat.S_IMODE(home_stat.st_mode) & 0o022:
              raise RuntimeError("runner home owner or mode differs")
          if len(baseline.parts) <= len(shorter.parts):
              raise RuntimeError("shorter root does not remove an ancestor")
          removed_ancestors = baseline.parent.relative_to(home)
          private_roots.preflight_directory(shorter, must_be_absent=True)
          private_roots.ensure_private_directory(shorter, must_create=True)

          def descriptor_mount(path):
              fd = os.open(path, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  info = os.fstat(fd)
                  with open(f"/proc/self/fdinfo/{fd}", encoding="ascii") as stream:
                      mount = re.search(r"^mnt_id:\s+([0-9]+)$", stream.read(4096), re.M)
                  if mount is None:
                      raise RuntimeError("mount identity unavailable")
                  return info.st_dev, int(mount[1])
              finally:
                  os.close(fd)

          common_mount = descriptor_mount(home)
          ancestor = home
          for part in removed_ancestors.parts:
              ancestor /= part
              private_roots.admit_directory(ancestor, private_leaf=False)
              info = ancestor.lstat()
              if info.st_uid != os.getuid() or stat.S_IMODE(info.st_mode) & 0o022:
                  raise RuntimeError("runner temp ancestor owner or mode differs")
              if descriptor_mount(ancestor) != common_mount:
                  raise RuntimeError("an ancestor removed by the move crosses a mount")
          token = secrets.token_hex(16)
          for cache in (baseline, shorter):
              private_roots.admit_directory(cache)
              for name in (*CACHE_NAMES, "c", "release-gates", "leases"):
                  child = cache / name
                  private_roots.preflight_directory(child)
                  private_roots.ensure_private_directory(child)
                  private_roots.admit_directory(child)
                  if descriptor_mount(child) != common_mount:
                      raise RuntimeError("private cache child differs in mount")
              if descriptor_mount(cache) != common_mount:
                  raise RuntimeError("private cache root differs in mount")
              for path in (cache, cache / "c"):
                  info = path.lstat()
                  if info.st_uid != os.getuid() or stat.S_IMODE(info.st_mode) != 0o700:
                      raise RuntimeError("private cache or scratch owner/mode differs")
              for lease_name in LEASE_NAMES:
                  lease = Lease(cache / "leases" / lease_name, token, "scratch-depth-diagnostic")
                  lease.acquire()
                  try:
                      if not lease.acquired or lease.borrowed:
                          raise RuntimeError("diagnostic lease was not freshly acquired")
                      owner = private_roots.read_private_json(lease.path / "owner.json")
                      if owner.get("token") != token or owner.get("pid") != os.getpid():
                          raise RuntimeError("unexpected diagnostic lease owner")
                  finally:
                      lease.release()

          for name in ("t", "p"):
              private_roots.ensure_private_directory(baseline / "tmp" / name, must_create=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"XTRACE_SCRATCH_DEPTH_SHORT={shorter}\n")
          print(f"baseline_components={len(baseline.parts)} shorter_components={len(shorter.parts)}")
          PY
          then
            echo "Scratch depth prerequisite verification failed"
            exit 1
          fi
          printf '%s\n' "Owner-private roots, same mount, and real isolated leases verified." >> "$GITHUB_STEP_SUMMARY"
          grep -E '^baseline_components=[0-9]+ shorter_components=[0-9]+$' "$root/diag/root-check.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile once before the pair
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_SCRATCH_DEPTH_ROOT"
          CARGO_TARGET_DIR="$root/cargo-target" cargo test --locked -p xtrace-store --lib --all-features --no-run > "$root/diag/build.log" 2>&1
      - name: Compare scratch depths on the unchanged cardinality workload
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_SCRATCH_DEPTH_ROOT"
          export CARGO_TARGET_DIR="$root/cargo-target"
          export TMPDIR="$root/tmp/t" TMP="$root/tmp/t" TEMP="$root/tmp/t"
          export XTRACE_TEST_SCRATCH_ROOT="$root/tmp/t" XTRACE_TEST_PRIVATE_SCRATCH="$root/tmp/p"
          focused=recording_port::tests::singleton_acknowledgements_at_focused_cap_recover_with_bounded_segments_and_pages
          sparse=recording_port::tests::sparse_acknowledged_batches_hit_admission_before_becoming_unreadable
          run_one() {
            local name="$1" scratch="$2" test="$3"
            local directory="$root/diag/$name"
            mkdir -m 700 "$directory" "$directory/frag"
            if ! XTRACE_CI_PRIVATE_ROOT="$directory" XTRACE_TEST_CARDINALITY_SCRATCH="$scratch" \
              cargo test --locked -p xtrace-store --lib --all-features "$test" -- --exact > "$directory/test.log" 2>&1; then
              echo "Cardinality diagnostic failed in $name"
              return 1
            fi
            if ! grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$directory/test.log"; then
              echo "Expected one passing cardinality test in $name"
              return 1
            fi
            echo "Completed $name"
          }
          case "$WORKLOAD" in
            focused)
              run_one baseline "$root/c" "$focused"
              run_one shorter "$XTRACE_SCRATCH_DEPTH_SHORT/c" "$focused"
              ;;
            sparse)
              run_one shorter "$XTRACE_SCRATCH_DEPTH_SHORT/c" "$sparse"
              run_one baseline "$root/c" "$sparse"
              ;;
            *) exit 1 ;;
          esac
          python3 -B - "$root/diag" "$WORKLOAD" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib
          import sys
          from tools.qa.store_profiles import collect

          root = pathlib.Path(sys.argv[1])
          test = sys.argv[2]
          profile, admissions, counted_syncs = {
              "focused": ("focused-singletons", 131072, 1),
              "sparse": ("sparse", 10000, 0),
          }[test]
          baseline, shorter = (collect(root / mode / "frag")[profile]
                               for mode in ("baseline", "shorter"))
          for entry in (baseline, shorter):
              assert entry["lastReport"]["state"] == "returned"
              assert entry["workload"] == {
                  "expected_admissions": admissions, "counted_journal_syncs": counted_syncs,
              }
              assert entry["lastReport"]["completed"] == admissions

          def seconds(ns):
              return ns / 1_000_000_000

          before, after = (seconds(entry["lastReport"]["elapsed_ns"])
                           for entry in (baseline, shorter))
          print(f"JDK17 {test} fixture scratch-depth pair")
          print(f"- Baseline {before:.3f}s; shorter {after:.3f}s; paired difference "
                f"{after - before:+.3f}s ({(after - before) / before:+.2%}).")
          for phase in ("checkpoint_publish", "connection_file_admission", "root_database_admission"):
              first, second = (entry["phases"][phase] for entry in (baseline, shorter))
              print(f"- {phase}: baseline {seconds(first['total_ns']):.3f}s; "
                    f"shorter {seconds(second['total_ns']):.3f}s.")
          print("- One same-runner pair per workload. The isolated comparison does not "
                "measure floor concurrency or qualify a relocated cache.")
          PY
      - name: Encrypt private diagnostics
        if: always() && env.XTRACE_SCRATCH_DEPTH_ROOT != ''
        env:
          EVIDENCE_CERT: 
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_SCRATCH_DEPTH_ROOT"
          printf '%s' "$EVIDENCE_CERT" | base64 -d > "$root/evidence.crt"
          tar -C "$root" -cf - diag | openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER -out "$root/scratch-root-depth.enc" "$root/evidence.crt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.XTRACE_SCRATCH_DEPTH_ROOT != ''
        with:
          name: encrypted-scratch-root-depth-${{ matrix.workload }}
          path: ${{ env.XTRACE_SCRATCH_DEPTH_ROOT }}/scratch-root-depth.enc
          if-no-files-found: error
          retention-days: 1
