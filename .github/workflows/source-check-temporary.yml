name: source-check-temporary
on:
  push:
    branches: [codex/source-lines-88]
permissions:
  contents: read
jobs:
  source-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Admit private scratch
        run: |
          root="${RUNNER_TEMP:?}/xt"
          mkdir -m 700 "$root" "$root/tmp" "$root/priv"
          echo "TMPDIR=$root/tmp" >> "$GITHUB_ENV"
          echo "XTRACE_TEST_PRIVATE_SCRATCH=$root/priv" >> "$GITHUB_ENV"
      - name: Source projection tests
        run: |
          python3 -B -m tools.qa.lane_run run --suite rust --step source-projection --min-passed 1 --max-ignored 0 --out "$RUNNER_TEMP/lane-frag" -- \
            cargo test --locked -p xtrace-store source_projection_tests -- --test-threads=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-projection-summary
          path: ${{ runner.temp }}/lane-frag
          if-no-files-found: ignore
          retention-days: 1
