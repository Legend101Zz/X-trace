name: acl-directory-buffer-temporary
on:
  push:
    branches: [codex/acl-directory-buffer-78]
permissions:
  contents: read
jobs:
  jdk17-acl-buffer-pairs:
    strategy:
      fail-fast: false
      matrix:
        workload: [security, focused, sparse]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Prepare owner-private diagnostic directories
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP:?}/xp"
          [ "${#root}" -le 40 ]
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/diag" "$root/c" "$root/t" "$root/p"
          echo "XTRACE_ACL_BUFFER_MEASUREMENT_ROOT=$root" >> "$GITHUB_ENV"
      - name: Verify Linux ACL bytes, error and admission invariants
        if: matrix.workload == 'security'
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_ACL_BUFFER_MEASUREMENT_ROOT"
          export CARGO_TARGET_DIR="$root/target"
          export TMPDIR="$root/t" TMP="$root/t" TEMP="$root/t"
          export XTRACE_TEST_SCRATCH_ROOT="$root/t" XTRACE_TEST_PRIVATE_SCRATCH="$root/p"
          if ! cargo test --locked -p xtrace-private-storage --lib --all-features -- --show-output > "$root/diag/security.log" 2>&1; then
            echo "Linux ACL security suite failed"
            exit 1
          fi
          for test in linux_directory_attribute_read_distinguishes_absent_empty_bytes_and_errors \
                      linux_directory_attribute_read_preserves_oversized_error_when_supported \
                      linux_acl_read_errors_survive_link_count_recovery \
                      linux_link_count_recovery_refuses_a_changed_access_or_default_acl \
                      linux_child_mutations_cannot_hide_access_or_default_acl_edits \
                      acl_edits_between_directory_reads_fail_closed_without_an_mtime_or_mode_change; do
            grep -Eq "^test [a-z_:]+::${test} \.\.\. ok$" "$root/diag/security.log"
          done
          markers=$(grep -Ec '^oversized_attribute=(observed|unavailable)$' "$root/diag/security.log")
          test "$markers" -eq 1
          if grep -qx 'oversized_attribute=observed' "$root/diag/security.log"; then
            echo "Oversized xattr: ERANGE observed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Oversized xattr: fixture unavailable; ERANGE runtime evidence pending" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compile baseline and candidate separately before timed tests
        if: matrix.workload != 'security'
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_ACL_BUFFER_MEASUREMENT_ROOT"
          base=dd29ffa29e6c064792bfa3a8e697ad34212aad9c
          if ! (
            git merge-base --is-ancestor "$base" HEAD &&
            git worktree add --detach "$root/base" "$base" &&
            cd "$root/base" &&
            CARGO_TARGET_DIR="$root/target-base" cargo test --locked -p xtrace-store --lib --all-features --no-run
          ) > "$root/diag/build-base.log" 2>&1; then
            echo "Baseline preparation failed"
            exit 1
          fi
          if ! CARGO_TARGET_DIR="$root/target" cargo test --locked -p xtrace-store --lib --all-features --no-run > "$root/diag/build-candidate.log" 2>&1; then
            echo "Candidate preparation failed"
            exit 1
          fi
      - name: Compare baseline and candidate on the unchanged cardinality workload
        if: matrix.workload != 'security'
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_ACL_BUFFER_MEASUREMENT_ROOT"
          export TMPDIR="$root/t" TMP="$root/t" TEMP="$root/t"
          export XTRACE_TEST_SCRATCH_ROOT="$root/t" XTRACE_TEST_PRIVATE_SCRATCH="$root/p"
          export XTRACE_TEST_CARDINALITY_SCRATCH="$root/c"
          focused=recording_port::tests::singleton_acknowledgements_at_focused_cap_recover_with_bounded_segments_and_pages
          sparse=recording_port::tests::sparse_acknowledged_batches_hit_admission_before_becoming_unreadable
          run_one() {
            local variant="$1" test="$2" source="$3" target="$4"
            local directory="$root/diag/$variant"
            mkdir -m 700 "$directory" "$directory/frag"
            if ! (
              cd "$source" &&
              XTRACE_CI_PRIVATE_ROOT="$directory" CARGO_TARGET_DIR="$target" \
                cargo test --locked -p xtrace-store --lib --all-features "$test" -- --exact
            ) > "$directory/test.log" 2>&1; then
              echo "Cardinality comparison failed for $variant"
              return 1
            fi
            if ! grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$directory/test.log"; then
              echo "Expected one passing cardinality test for $variant"
              return 1
            fi
            echo "Completed $variant"
          }
          case "$WORKLOAD" in
            focused)
              run_one baseline "$focused" "$root/base" "$root/target-base"
              run_one candidate "$focused" "$GITHUB_WORKSPACE" "$root/target"
              ;;
            sparse)
              run_one candidate "$sparse" "$GITHUB_WORKSPACE" "$root/target"
              run_one baseline "$sparse" "$root/base" "$root/target-base"
              ;;
            *) exit 1 ;;
          esac
          python3 -B - "$root/diag" "$WORKLOAD" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib
          import sys
          from tools.qa.store_profiles import collect

          root = pathlib.Path(sys.argv[1])
          test = sys.argv[2]
          profile, admissions, counted_syncs = {
              "focused": ("focused-singletons", 131072, 1),
              "sparse": ("sparse", 10000, 0),
          }[test]
          baseline, candidate = (collect(root / mode / "frag")[profile]
                                 for mode in ("baseline", "candidate"))
          for entry in (baseline, candidate):
              assert entry["lastReport"]["state"] == "returned"
              assert entry["workload"] == {
                  "expected_admissions": admissions, "counted_journal_syncs": counted_syncs,
              }
          assert baseline["lastReport"]["completed"] == candidate["lastReport"]["completed"]

          def seconds(ns):
              return ns / 1_000_000_000

          base, changed = (seconds(entry["lastReport"]["elapsed_ns"])
                           for entry in (baseline, candidate))
          print(f"JDK17 {test} paired cardinality comparison")
          print(f"- Baseline {base:.3f}s; candidate {changed:.3f}s; paired difference "
                f"{changed - base:+.3f}s ({(changed - base) / base:+.2%}).")
          for phase in ("checkpoint_publish", "connection_file_admission"):
              before, after = (entry["phases"][phase] for entry in (baseline, candidate))
              print(f"- {phase}: baseline {seconds(before['total_ns']):.3f}s, "
                    f"candidate {seconds(after['total_ns']):.3f}s.")
          print("- One same-host pair per workload; the difference includes run-order variance.")
          PY
      - name: Encrypt private diagnostics
        if: always() && env.XTRACE_ACL_BUFFER_MEASUREMENT_ROOT != ''
        env:
          EVIDENCE_CERT: 
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_ACL_BUFFER_MEASUREMENT_ROOT"
          printf '%s' "$EVIDENCE_CERT" | base64 -d > "$root/evidence.crt"
          tar -C "$root" -cf - diag | openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER -out "$root/acl-directory-buffer.enc" "$root/evidence.crt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.XTRACE_ACL_BUFFER_MEASUREMENT_ROOT != ''
        with:
          name: encrypted-acl-directory-buffer-${{ matrix.workload }}
          path: ${{ env.XTRACE_ACL_BUFFER_MEASUREMENT_ROOT }}/acl-directory-buffer.enc
          if-no-files-found: error
          retention-days: 1
