name: campaigns

# Real-project campaigns (SKELETON, wave 0). Builds the candidate package, clones each upstream project at its pinned
# SHA and runs the pinned UNINSTRUMENTED baseline for real. Every step whose product feature does not exist yet is
# recorded as `not-implemented` and the final gate FAILS the job: an incomplete campaign is never green and never
# emits a receipt. No secrets are used.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate ref (branch, tag or SHA); empty means the dispatched ref
        type: string
        default: ""
      projects:
        description: Comma-separated projects, or all (petclinic, jhipster, fineract, directus, medusa, vendure)
        type: string
        default: all
  push:
    branches:
      - "ultra/campaign/**"

permissions:
  contents: read

concurrency:
  group: campaigns-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.sel.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - name: Select projects
        id: sel
        env:
          PROJECTS: ${{ inputs.projects }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 -B tools/qa/camp_select.py --repo "$GITHUB_WORKSPACE" --projects "${PROJECTS:-}" \
            --ref-name "$REF_NAME" --github-output "$GITHUB_OUTPUT"

  package:
    # The candidate package, built once with the same steps as package.yml (linux-x86_64 only).
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: Rust toolchain (stable, from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install stable --profile minimal
      - name: Build the artifact set
        run: python3 packaging/build.py --out dist --platform linux-x86_64
      - name: Verify checksums
        run: sh packaging/install.sh verify-dist dist/linux-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xtrace-candidate-linux-x86_64
          path: dist/linux-x86_64/
          if-no-files-found: error
          retention-days: 14

  campaign:
    name: campaign (${{ matrix.project }})
    needs: [select, package]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      CAMP_PROJECT: ${{ matrix.project }}
      CAMP_KIND: ${{ matrix.kind }}
      CAMP_SHA: ${{ matrix.sha }}
      CAMP_URL: ${{ matrix.url }}
      CAMP_BUILD: ${{ matrix.buildCommand }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.kind == 'java'
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: xtrace-candidate-linux-x86_64
          path: ${{ runner.temp }}/pkg
      - name: Record the candidate package
        run: |
          echo "CAMP_ROOT=$RUNNER_TEMP/camp" >> "$GITHUB_ENV"
          echo "CAMP_OUT=$RUNNER_TEMP/camp-out" >> "$GITHUB_ENV"
          CAMP_OUT="$RUNNER_TEMP/camp-out"
          mkdir -p "$CAMP_OUT"
          python3 -B tools/qa/camp_summary.py record --file "$CAMP_OUT/summary.json" --project "$CAMP_PROJECT" \
            --step candidate-package --status pass --note "built by the package job of this run"
      - name: Clone the upstream project at its pinned SHA
        run: |
          python3 -B tools/qa/camp_summary.py exec --file "$CAMP_OUT/summary.json" --project "$CAMP_PROJECT" \
            --step checkout-upstream -- sh tools/qa/camp_clone.sh "$CAMP_URL" "$CAMP_SHA" "$CAMP_ROOT/$CAMP_KIND/$CAMP_PROJECT/src"
      - name: Build the upstream project (host, no source changes)
        if: matrix.kind == 'java'
        run: |
          python3 -B tools/qa/camp_summary.py exec --file "$CAMP_OUT/summary.json" --project "$CAMP_PROJECT" \
            --step build-upstream --cwd "$CAMP_ROOT/java/$CAMP_PROJECT/src" -- bash -ec "$CAMP_BUILD"
      - name: Pinned uninstrumented baseline (host JVM, Postgres in a campaign container)
        if: matrix.kind == 'java'
        env:
          XCAMP_APP_MODE: host
          XCAMP_PLATFORM: linux/amd64
        run: |
          export XTRACE_CAMPAIGN_ROOT="$CAMP_ROOT"
          export XCAMP_JAVA="$JAVA_HOME/bin/java"
          python3 -B tools/qa/camp_summary.py exec --file "$CAMP_OUT/summary.json" --project "$CAMP_PROJECT" \
            --step baseline -- python3 -B "campaigns/java/$CAMP_PROJECT/harness/run.py" baseline
      - name: Compare with the tracked baseline fingerprints (informational)
        if: matrix.kind == 'java' && always()
        run: |
          python3 -B tools/qa/camp_compare.py --file "$CAMP_OUT/summary.json" --project "$CAMP_PROJECT" \
            --receipt "$CAMP_ROOT/java/$CAMP_PROJECT/baseline-1/receipt.json" \
            --pinned "campaigns/java/$CAMP_PROJECT/baseline-summary.json"
      - name: Node baseline is not runnable on this runner yet
        if: matrix.kind == 'node'
        run: |
          python3 -B tools/qa/camp_summary.py record --file "$CAMP_OUT/summary.json" --project "$CAMP_PROJECT" \
            --step baseline --status not-implemented \
            --note "node harness is bound to linux/arm64 Docker images; no x86_64 path yet"
      - name: Record steps whose product feature does not exist yet
        if: always()
        run: |
          for step in instrumented-scenarios browser-journeys-linear-canvas-320-736-1024 tui-pty-transcripts \
                      privacy-canary-scan overhead-measurement campaign-receipt; do
            python3 -B tools/qa/camp_summary.py record --file "$CAMP_OUT/summary.json" --project "$CAMP_PROJECT" \
              --step "$step" --status not-implemented --note "required product feature or harness stage not built yet"
          done
      - name: Collect baseline artifacts
        if: always()
        run: |
          mkdir -p "$CAMP_OUT/baseline-raw"
          cp -R "$CAMP_ROOT/$CAMP_KIND/$CAMP_PROJECT"/baseline-* "$CAMP_OUT/baseline-raw/" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: campaign-${{ matrix.project }}
          path: ${{ runner.temp }}/camp-out
          if-no-files-found: error
          retention-days: 14
      - name: Gate, an incomplete campaign is never success
        if: always()
        run: python3 -B tools/qa/camp_summary.py gate --file "$CAMP_OUT/summary.json"
