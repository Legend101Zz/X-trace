name: virtual-steps-check-temporary
on:
  push:
    branches: [codex/virtual-steps]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --prefix web/app
      - run: npm run typecheck --prefix web/app && npm test --prefix web/app
      - run: npm run build --prefix web/app && npm run embed --prefix web/app && npm run check:embedded --prefix web/app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-virtual-steps-viewer
          path: crates/xtrace-daemon/assets/ui/
          if-no-files-found: error
