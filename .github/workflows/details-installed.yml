name: Installed Details qualification and five-sample replay measurement
on:
  push:
    branches: [codex/proof-details-installed-128]
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GENERATED_PRODUCT: '10e83a00e052d7349eb3daa7e1d18e75f23696e0'
      GENERATED_TREE: 'a83afd0a1a238459541f33f723b70acbc1f71325'
      ASSEMBLED_SOURCE_SHA: 'd181b687c934301f3c1f7292ecd30aed14ca599b'
      ASSEMBLED_SOURCE_TREE: '0884b2f79490ada6f3f3874c43c2e1b3f6e540a0'
      EXPECTED_UI_MANIFEST_SHA256: 'ad7a71b74a0346feef4c1b0711c245805f436d3b2592c0a3b350568d02cd7cd5'
      INSTALLER_FIX_SHA: '1e630befb04c451ca085d3a8b0d3324525271460'
      INSTALL_SCRIPT_SHA256: '7623373412edeb406deab5bbf672d8d5653b4a363ec4aa8b850380608f2e0425'
      INSTALL_TEST_SHA256: 'c251607d61e391251eb50e62cb5ca156c89815e31890e2b1276b5f4012d603b8'
      PRODUCT: '10e83a00e052d7349eb3daa7e1d18e75f23696e0'
      PRODUCT_TREE: 'a83afd0a1a238459541f33f723b70acbc1f71325'
      REPLAY_SOURCE_BLOB: '0122d4697f75326ef9c103b9ea859542b65d0d1e'
      BENCHMARK_BLOB: '792926cceb40360ff1ed8f8e1315fbf592518b8d'
      SOURCE_WORKFLOW_SHA256: 'd2ee4f9c0ff14988d9ec578f064405c539052fe3bf3900a52ad71223efbef251'
      SOURCE_ASSETS_ARCHIVE_SHA256: '48216780c662627856905d901b1c73cb1981646b911087428170a938e987d183'
      SOURCE_ASSETS_ARCHIVE_SIZE: '163380'
      SOURCE_ASSETS_ARTIFACT_ID: '15134466602'
      VERIFIED_SOURCE_RUN_ID: '45853525422'
      VERIFIED_SOURCE_WRAPPER: 'a0694467797cd3436c68be160196001e3e2c77c7'
      RECIPIENT_DER_SHA256: 931ca5323fd14a29782acb5f1e52225f5dc5a94f4d680958de3e685514839dc4
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
        working-directory: product
    steps:
      - name: Check out qualified generated product, source and installer-fix parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the exact source-proof workflow sibling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.VERIFIED_SOURCE_WRAPPER }}
          path: source-proof
          fetch-depth: 2
          persist-credentials: false
      - name: Read exact reviewed wrapper helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: wrapper
          fetch-depth: 2
          sparse-checkout: .github/proof/details-installed
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Verify all pins and admit fresh private runner root
        id: root
        run: |
          set -euo pipefail
          umask 077
          scripts="$GITHUB_WORKSPACE/wrapper/.github/proof/details-installed"
          test "$GITHUB_REPOSITORY" = Legend101Zz/X-trace
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/codex/proof-details-installed-128
          test "$(git -C ../wrapper rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C ../wrapper show -s --format=%P HEAD)" = "$PRODUCT"
          test "$(shasum -a 256 "$scripts/SHA256SUMS" | cut -d' ' -f1)" = 3c38c78cbe8eb38b2055282ff669dec8776f30d10738eb5a84a3ca1945f70324
          (cd "$scripts" && sha256sum --check --status SHA256SUMS)
          python3 -B - <<'INVENTORY'
          import os, subprocess
          from pathlib import Path
          root=Path('../wrapper/.github/proof/details-installed')
          rows=(root/'SHA256SUMS').read_text().splitlines()
          names=[line.split('  ')[1] for line in rows]
          assert names==sorted(set(names)) and names==sorted(p.name for p in root.iterdir() if p.name!='SHA256SUMS')
          expected=sorted('A\t.github/proof/details-installed/'+name for name in [*names,'SHA256SUMS'])
          expected.append('A\t.github/workflows/details-installed.yml')
          actual=subprocess.check_output(['git','-C','../wrapper','diff','--name-status',os.environ['PRODUCT'],os.environ['GITHUB_SHA']],text=True).splitlines()
          assert actual==expected
          for name in (entry.split('\t')[1] for entry in expected):
              row=subprocess.check_output(['git','-C','../wrapper','ls-tree',os.environ['GITHUB_SHA'],'--',name],text=True)
              assert row.startswith('100644 blob ') and row.rstrip('\n').endswith('\t'+name)
          INVENTORY
          git fetch --quiet --no-tags ../source-proof "$VERIFIED_SOURCE_WRAPPER"
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test "$(git rev-parse "$ASSEMBLED_SOURCE_SHA^{tree}")" = "$ASSEMBLED_SOURCE_TREE"
          test "$(git rev-parse HEAD:web/app/scripts/browser-journey.mjs)" = "$REPLAY_SOURCE_BLOB"
          test -z "$(git status --porcelain --untracked-files=all)"
          root="$RUNNER_TEMP/xai1"
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/logs" "$root/private" "$root/safe" "$root/packages" "$root/encrypted"
          for name in spring scale; do
            mkdir -m 700 "$root/$name" "$root/$name/logs" "$root/$name/private" "$root/$name/safe"
          done
          printf '%s\n' "SHARED_ROOT=$root" "PROOF_SCRIPTS=$scripts" "TMPDIR=$root/tmp" "PLAYWRIGHT_BROWSERS_PATH=$root/chromium" >> "$GITHUB_ENV"
          printf '%s\n' 'admitted=true' >> "$GITHUB_OUTPUT"
      - name: Require exact contracts and source runs, authenticated generated files and direct child
        id: qualification
        if: steps.root.outputs.admitted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH="$PWD:$PROOF_SCRIPTS" python3 -B "$PROOF_SCRIPTS/qualification.py" > "$SHARED_ROOT/logs/qualification.stdout" 2> "$SHARED_ROOT/logs/qualification.stderr"
      - name: Build and independently verify one archive and fresh official install
        id: package
        if: steps.root.outputs.admitted == 'true' && steps.qualification.outcome == 'success'
        run: |
          set -euo pipefail
          umask 077
          rc=0
          PYTHONPATH="$PWD:$PROOF_SCRIPTS" python3 -B "$PROOF_SCRIPTS/package-driver.py" >"$SHARED_ROOT/logs/outer.stdout" 2>"$SHARED_ROOT/logs/outer.stderr" || rc=$?
          if [ "$rc" = 0 ]; then printf '%s\n' 'pass=true' >> "$GITHUB_OUTPUT"; fi
          echo "installedStagePackageExit=$rc"
          exit "$rc"
      - name: Genuine Spring recording and default Inspector Details controls
        id: spring
        if: ${{ always() && steps.root.outputs.admitted == 'true' && steps.package.outputs.pass == 'true' }}
        env:
          PROOF_ROOT: ${{ env.SHARED_ROOT }}/spring
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH="$PWD:$PROOF_SCRIPTS" python3 -B "$PROOF_SCRIPTS/spring-driver.py" >"$PROOF_ROOT/logs/outer.stdout" 2>"$PROOF_ROOT/logs/outer.stderr"
      - name: Five fresh installed viewer measurements with the retained 10k fixture
        id: scale
        timeout-minutes: 40
        if: ${{ always() && steps.root.outputs.admitted == 'true' && steps.package.outputs.pass == 'true' }}
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH="$PWD:$PROOF_SCRIPTS" python3 -B "$PROOF_SCRIPTS/scale-driver.py" >"$SHARED_ROOT/scale/logs/outer.stdout" 2>"$SHARED_ROOT/scale/logs/outer.stderr"
      - name: Encrypt the original five-sample report after validation
        id: scale_packet
        if: ${{ always() && steps.root.outputs.admitted == 'true' && steps.package.outputs.pass == 'true' }}
        env:
          RECIPIENT_CERT: |
            -----BEGIN CERTIFICATE-----
            MIIERzCCAq+gAwIBAgIUJgaIGZvHvTO1qz7A91QyCXVCBLwwDQYJKoZIhvcNAQEL
            BQAwMzExMC8GA1UEAwwoWC10cmFjZSBkZXZlbG9wbWVudCB2aWV3ZXIgdmlzdWFs
            IHJldmlldzAeFw0yNjExMjUxNzQ1MjdaFw0yNjEyMDkxNzQ1MjdaMDMxMTAvBgNV
            BAMMKFgtdHJhY2UgZGV2ZWxvcG1lbnQgdmlld2VyIHZpc3VhbCByZXZpZXcwggGi
            MA0GCSqGSIb3DQEBAQUAA4IBjwAwggGKAoIBgQDUCDMtoLNBiFxpd01HnkpFVMon
            DCZYbJiETXhyeSC/ecpMarzXEZ4ju0nd4LZwjL/A4Mx9T4JBA4pdFAQDPlnOfG6N
            J+CQToj6WgpXFWUHpJp3yqfWqRRNj2LC10+slMqtzfcMRORiIYzzco9Uavy4a4zL
            2jtcP3ShaaD6m/AsBFkCJMmZ94cJUeTgHwdDm9ERrPU0Eo1O31CWp0Oc/lmzvLFe
            LpjJkdXSGZYrfQfc1n+iSNu1OO2ARxd2gkJPyTSE8dS7Zxwzcpm9izZkIyx5Z3Xm
            l11t8C3QPDcJ4lRiTI9jF81lmxKak9eIl2PmnWNg5D19nynsboEUxfkr9IWQDYt/
            JJ36+LyBi/mRph2c7jG3IE7GqoViW+7zd6ImzoiQZajii5PPo8ZRyvVNAZ44UbsL
            E5djCSUrPH7slC5Cu+eV3YePq8+izZDSGcfwlzrzWGQRt2+kojpy4bPX/qxWB/sO
            F9C85rrfrjsWWczag8SZdrvBgXWm1d0gAofhGYUCAwEAAaNTMFEwHQYDVR0OBBYE
            FKT8KNtbCqB4oRqvV+kmEM1sK0ghMB8GA1UdIwQYMBaAFKT8KNtbCqB4oRqvV+km
            EM1sK0ghMA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggGBAH2nbGzx
            vLlE1JVO27hw10iq3kC66kTbvwM2I4MIkaPfRQ3unmLr+f0uZ5JMJpDzQU7DyN9P
            i8zsBRqGcA8cnvIC26SbNTX77RYzzEELsr7hl1N/Gjv+xls4IARMfrSKg5uZfPa0
            raN7oFbJsbh45Z0296AWQ4o9uh/DmHvEo+d1frE+LbQcV6GHQwMjHlzgSjgieFfR
            8MgJ9YxUfYnFUSdSRq2v/M2WVut9k5IaDBpFcphwUsqXbzE+maJqjGrn+wHBgqVQ
            hLPNyiQExu/6xUExTFyz4meSDRCaK6N4DJHqWa0lRPG6dhv9jAyOC7Freh2FshLk
            5ZvJRuUHdhKSA3VbAhr2grL/9f3z1QshohE13qgn25XIr1Vx88N0jJDcbgumqSWf
            KBU//gL8IFFFfL15nOhhDkGgzHnV/IKeaMJVBC7D/aW5tRUWWzESBQHJR7lvu+sR
            2eYyRl07aS451CmcdJNQg+KnIflBiYQFgPh6dAjNm2QAoH5ROQLW7Ah+TA==
            -----END CERTIFICATE-----
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH="$PWD:$PROOF_SCRIPTS" python3 -B "$PROOF_SCRIPTS/scale-packet.py" >"$SHARED_ROOT/logs/scale-packet.stdout" 2>"$SHARED_ROOT/logs/scale-packet.stderr"
      - name: Reconcile independent outcomes on the same installation
        id: finalize
        if: ${{ always() && steps.root.outputs.admitted == 'true' }}
        env:
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          SPRING_OUTCOME: ${{ steps.spring.outcome }}
          SCALE_OUTCOME: ${{ steps.scale.outcome }}
          SCALE_PACKET_OUTCOME: ${{ steps.scale_packet.outcome }}

        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH="$PWD:$PROOF_SCRIPTS" python3 -B "$PROOF_SCRIPTS/finalize.py" >"$SHARED_ROOT/logs/finalize.stdout" 2>"$SHARED_ROOT/logs/finalize.stderr"
      - name: Upload bounded installed Details receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.finalize.outputs.ready == 'true' }}
        with:
          name: details-installed-bounded
          path: ${{ env.SHARED_ROOT }}/safe/combined.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload encrypted original benchmark samples
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.scale_packet.outputs.ready == 'true' }}
        with:
          name: details-installed-original-samples-encrypted
          path: ${{ env.SHARED_ROOT }}/encrypted/scale.cms
          if-no-files-found: error
          retention-days: 1
      - name: Enforce the installed Details verdict after artifact preservation
        id: verdict
        if: ${{ always() && steps.root.outputs.admitted == 'true' }}
        env:
          QUALIFIED: ${{ steps.finalize.outputs.qualified }}
        run: test "$QUALIFIED" = true
