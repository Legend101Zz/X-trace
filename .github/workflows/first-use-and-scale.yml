          import os, subprocess
          from pathlib import Path
          root=Path('../wrapper/.github/proof/first-use-and-scale')
          rows=(root/'SHA256SUMS').read_text().splitlines()
          names=[line.split('  ')[1] for line in rows]
          assert names==sorted(set(names)) and names==sorted(p.name for p in root.iterdir() if p.name!='SHA256SUMS')
          expected=sorted('A\t.github/proof/first-use-and-scale/'+name for name in [*names,'SHA256SUMS'])
          expected.append('A\t.github/workflows/first-use-and-scale.yml')
          actual=subprocess.check_output(['git','-C','../wrapper','diff','--name-status',os.environ['PRODUCT'],os.environ['GITHUB_SHA']],text=True).splitlines()
          assert actual==expected
          for name in (entry.split('\t')[1] for entry in expected):
              row=subprocess.check_output(['git','-C','../wrapper','ls-tree',os.environ['GITHUB_SHA'],'--',name],text=True)
              assert row.startswith('100644 blob ') and row.rstrip('\n').endswith('\t'+name)
