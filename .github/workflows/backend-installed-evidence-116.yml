name: Installed Spring and Express catalog readback
on:
  push:
    branches: [diagnostic/backend-installed-evidence-116]
permissions:
  contents: read
jobs:
  installed-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: subject
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 277cd4b0cb81d223bffd14015f0e33057698940a
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          components: rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            subject/adapters/java/build.gradle.kts
            subject/adapters/java/settings.gradle.kts
            subject/adapters/java/gradle.lockfile
            subject/adapters/java/*/build.gradle.kts
            subject/adapters/java/*/gradle.lockfile
            subject/adapters/java/gradle/verification-metadata.xml
            subject/adapters/java/gradle/wrapper/gradle-wrapper.properties
      - name: Build and verify the reviewed unsigned archive
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/x116"
          mkdir -m 700 "$root" "$root/tmp" "$root/priv" "$root/extract"
          export TMPDIR="$root/tmp" XTRACE_TEST_PRIVATE_SCRATCH="$root/priv"
          test "$(git rev-parse HEAD^{tree})" = f06a1b22fd46a305f075165d3c6a7e4693beac19
          test "$(git rev-parse HEAD)" = 277cd4b0cb81d223bffd14015f0e33057698940a
          cargo fmt --all --check
          git diff --check 4c3002a5200448bdc4ab64038e726aa1dec5beae HEAD
          if ! python3 -B packaging/build.py --out "$root/dist" --work "$root/package-work" --platform linux-x86_64 >"$root/build.log" 2>&1; then
            if grep -Fq 'Could not resolve' "$root/build.log"; then
              echo 'Package build dependency resolution failed.'
            else
              echo 'Exact-head package build failed.'
            fi
            exit 1
          fi
          dist="$root/dist/linux-x86_64"
          sh packaging/install.sh verify-dist "$dist" >"$root/verify-dist.log" 2>&1
          archives=("$dist"/xtrace-*-linux-x86_64.tar.gz)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          test -f "$archive"
          python3 -B packaging/verify_package.py "$archive" --run-binary --repo . --out "$root/verify-package.json" >"$root/verify-package.log" 2>&1
          tar -xzf "$archive" -C "$root/extract" >"$root/extract.log" 2>&1
          entries=("$root"/extract/xtrace-*)
          test "${#entries[@]}" -eq 1
          prefix="$root/installed X-trace"
          sh "${entries[0]}/install.sh" --prefix "$prefix" --data-home "$root/journey/data" >"$root/install.log" 2>&1
          sh "$prefix/current/install.sh" verify --prefix "$prefix" >"$root/verify-install.log" 2>&1
          digest=$(sha256sum "$archive" | cut -d' ' -f1)
          echo "Verified unsigned Linux archive SHA-256: $digest" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify package checks and run the installed Express catalog journey
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/x116"
          export TMPDIR="$root/tmp" XTRACE_TEST_PRIVATE_SCRATCH="$root/priv"
          if ! python3 -B -m unittest discover -s packaging/test -p test_verify_package.py \
            >"$root/verifier-tests.log" 2>&1; then
            echo 'Package verifier tests failed.'
            exit 1
          fi
          grep -E '^Ran [0-9]+ tests? in [0-9.]+s$' "$root/verifier-tests.log" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -Fx OK "$root/verifier-tests.log" >> "$GITHUB_STEP_SUMMARY"
          prefix="$root/installed X-trace"
          python3 -B - "$prefix" "$GITHUB_SHA" <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          prefix = Path(sys.argv[1])
          subject = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if subject == sys.argv[2]:
              raise SystemExit("Product and diagnostic driver must be distinct")
          share = prefix / "current/share/xtrace"
          def read(path):
              return json.loads(path.read_text())
          package = read(share / "PACKAGE-MANIFEST.json")
          parser = read(share / "analyzers/node/node_modules/typescript-parser/package.json")
          name, version, license_id = (parser[key] for key in ("name", "version", "license"))
          purl = f"pkg:npm/{name}@{version}"
          if package["sourceCommit"] != subject or package["packTrust"] != "unsigned":
              raise SystemExit("Package identity verification failed")
          if not any(c.get("purl") == purl and c.get("version") == version
                     for c in read(share / "sbom.cdx.json")["components"]):
              raise SystemExit("Installed parser SBOM entry is missing")
          if not any(c.get("purl") == purl and c.get("license") == license_id
                     for c in read(share / "licenses.json")["components"]):
              raise SystemExit("Installed parser license entry is missing")
          if f"{purl}  license={license_id}" not in (share / "THIRD_PARTY_LICENSES").read_text():
              raise SystemExit("Installed parser third-party license record is missing")
          print("Installed parser metadata matches the package SBOM and license inventory.")
          PY
          mv adapters/node/packages/analyzer/dist "$root/checkout-analyzer"
          mv adapters/node/packages/adapter-core/dist "$root/checkout-node-adapter"
          mkdir -m 700 "$root/caller"
          cd "$root/caller"
          unset XTRACE_JAVA_ANALYZER XTRACE_NODE_ANALYZER XTRACE_PREFIX NODE_PATH NODE_OPTIONS
          if ! python3 -B "$GITHUB_WORKSPACE/subject/tools/qa/catalog_link_journey.py" \
            "$GITHUB_WORKSPACE/subject" "$prefix/bin/xtrace" "$root/journeys" \
            --installed-prefix "$prefix" --framework express >"$root/catalog-journey.log" 2>&1; then
            grep -E '^catalog link journey failed: [A-Za-z0-9_ -]+$' "$root/catalog-journey.log" || true
            exit 1
          fi
          grep -Fx 'installed Node admission: missing manifest, modified file and unlisted file refused' \
            "$root/catalog-journey.log" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -Fx 'installed Node scanner: missing parser refused without a catalog revision' \
            "$root/catalog-journey.log" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -Fx 'express: one stable operation, 2 linked, 5 unmatched' \
            "$root/catalog-journey.log" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify installed Spring catalog and exact reopen readback in the same prefix
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/x116"
          export TMPDIR="$root/tmp" XTRACE_TEST_PRIVATE_SCRATCH="$root/priv"
          prefix="$root/installed X-trace"
          if ! adapters/java/gradlew -p adapters/java --dependency-verification strict --no-daemon fixtureBootJar \
            >"$root/fixture.log" 2>&1; then
            echo 'Spring fixture build failed.'
            exit 1
          fi
          mkdir -m 700 "$root/spring-lib" "$root/spring-classes"
          (
            cd "$root/spring-lib"
            jar -xf "$GITHUB_WORKSPACE/subject/adapters/java/spring-fixture/build/libs/xtrace-spring-fixture.jar" BOOT-INF/lib
          ) >"$root/fixture-jar.log" 2>&1
          if ! javac --release 17 -cp "$root/spring-lib/BOOT-INF/lib/*" -d "$root/spring-classes" \
            tools/qa/fixtures/catalog-link/SpringLinkFixture.java >"$root/compile-fixture.log" 2>&1; then
            echo 'Spring journey fixture compilation failed.'
            exit 1
          fi
          mv adapters/java/static-analyzer/build/install/xtrace-java-static "$root/checkout-java-analyzer"
          export XTRACE_LINK_SPRING_CLASSPATH="$root/spring-classes:$root/spring-lib/BOOT-INF/lib/*"
          unset XTRACE_JAVA_ANALYZER XTRACE_NODE_ANALYZER XTRACE_PREFIX
          cd "$root/caller"
          if ! python3 -B "$GITHUB_WORKSPACE/subject/tools/qa/catalog_link_journey.py" \
            "$GITHUB_WORKSPACE/subject" "$prefix/bin/xtrace" "$root/journeys" \
            --installed-prefix "$prefix" --framework spring-mvc >"$root/spring-journey.log" 2>&1; then
            grep -E '^catalog link journey failed: [A-Za-z0-9_ -]+$' "$root/spring-journey.log" || true
            exit 1
          fi
          grep -Fx 'spring-mvc: one stable operation, 2 linked, 4 unmatched' \
            "$root/spring-journey.log" | tee -a "$GITHUB_STEP_SUMMARY"
          sh "$prefix/current/install.sh" verify --prefix "$prefix" >"$root/verify-after.log" 2>&1
