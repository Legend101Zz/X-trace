name: Scoped runtime catalog journey
on:
  push:
    branches: [diagnostic/catalog-runtime-link-journey-112]
permissions:
  contents: read
jobs:
  runtime-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 55779297fd2df67b9085339af59dfbb36dfd6a8d
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            adapters/java/build.gradle.kts
            adapters/java/settings.gradle.kts
            adapters/java/gradle.lockfile
            adapters/java/*/build.gradle.kts
            adapters/java/*/gradle.lockfile
            adapters/java/gradle/verification-metadata.xml
            adapters/java/gradle/wrapper/gradle-wrapper.properties
      - name: Verify Rust migration, legacy SQL and endpoint readers
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = 55779297fd2df67b9085339af59dfbb36dfd6a8d
          root="$RUNNER_TEMP/xt"
          mkdir -m 700 "$root" "$root/tmp" "$root/priv" "$root/fragments"
          export TMPDIR="$root/tmp" XTRACE_TEST_PRIVATE_SCRATCH="$root/priv"
          cargo fmt --all --check
          cargo clippy --locked -p xtrace-domain -p xtrace-application -p xtrace-store -p xtrace-cli -p xtrace-daemon --tests -- -D warnings
          python3 -B -m tools.qa.lane_run run --suite rust --step scope-normalization --min-passed 1 --max-ignored 0 --out "$root/fragments" -- \
            cargo test --locked -p xtrace-domain --lib scoped_link_normalization
          python3 -B -m tools.qa.lane_run run --suite rust --step catalog-v11 --min-passed 2 --max-ignored 0 --out "$root/fragments" -- \
            cargo test --locked -p xtrace-store --lib proposed_catalog_link
          python3 -B -m tools.qa.lane_run run --suite rust --step catalog-v9 --min-passed 6 --max-ignored 0 --out "$root/fragments" -- \
            cargo test --locked -p xtrace-store --test catalog_link_tests
          python3 -B -m tools.qa.lane_run run --suite rust --step catalog-query --min-passed 1 --max-ignored 0 --out "$root/fragments" -- \
            cargo test --locked -p xtrace-application --lib observed_endpoint_queries
          python3 -B -m tools.qa.lane_run run --suite rust --step catalog-observation --min-passed 1 --max-ignored 0 --out "$root/fragments" -- \
            cargo test --locked -p xtrace-store --lib observation
          for name in linked_replay_revalidates observed_query_validates observed_endpoint_query_rejects; do
            python3 -B -m tools.qa.lane_run run --suite rust --step "$name" --min-passed 1 --max-ignored 0 --out "$root/fragments" -- \
              cargo test --locked -p xtrace-store --lib "$name"
          done
      - name: Build the actual scanners, adapters, fixtures and CLI
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/xt"
          npm ci --prefix adapters/node >"$root/npm-ci.log" 2>&1
          npm run build --prefix adapters/node >"$root/npm-build.log" 2>&1
          if ! adapters/java/gradlew -p adapters/java --dependency-verification strict --no-daemon \
             agentDist fixtureBootJar :static-analyzer:installDist >"$root/gradle.log" 2>&1; then
            if grep -Fq 'Could not resolve' "$root/gradle.log"; then
              echo 'Gradle dependency resolution failed.'
            else
              echo 'Java agent, fixture or analyzer build failed.'
            fi
            exit 1
          fi
          cargo build --locked -p xtrace-cli >"$root/cargo-build.log" 2>&1
      - name: Verify real Express and Spring scan-to-launch-to-read
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/xt"
          export TMPDIR="$root/tmp" XTRACE_TEST_PRIVATE_SCRATCH="$root/priv"
          mkdir -m 700 "$root/spring-lib" "$root/spring-classes"
          (
            cd "$root/spring-lib"
            jar -xf "$GITHUB_WORKSPACE/adapters/java/spring-fixture/build/libs/xtrace-spring-fixture.jar" BOOT-INF/lib
          )
          javac --release 17 -cp "$root/spring-lib/BOOT-INF/lib/*" -d "$root/spring-classes" \
            tools/qa/fixtures/catalog-link/SpringLinkFixture.java
          export XTRACE_LINK_SPRING_CLASSPATH="$root/spring-classes:$root/spring-lib/BOOT-INF/lib/*"
          python3 -B tools/qa/catalog_link_journey.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/target/debug/xtrace" "$root/journeys" \
            | tee -a "$GITHUB_STEP_SUMMARY"
