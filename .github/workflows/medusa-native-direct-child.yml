name: Medusa native direct-child proof
on:
  push:
    branches: [codex/proof-medusa-native-direct-child-120-v2]
permissions:
  contents: read
concurrency:
  group: medusa-installed-120
  cancel-in-progress: false
jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MEDUSA_PRODUCT_SHA: 137c744c7afea7ac8e227acad22062d5e07789ba
      MEDUSA_PRODUCT_TREE: d59cf8da09b29af3a647c769ed3547bdf560aaaa
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Admit source and private directories
        id: root
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$MEDUSA_PRODUCT_SHA"
          git checkout --detach "$MEDUSA_PRODUCT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$MEDUSA_PRODUCT_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          owner="$(mktemp -d "$RUNNER_TEMP/medusa-owned-proof.XXXXXXXX")"
          root="$owner/proof"
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/outer" "$root/safe"
          printf '%s\n' "MEDUSA_ROOT=$root" "CARGO_TARGET_DIR=$root/target" "CARGO_TERM_COLOR=never" "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          printf '%s\n' 'admitted=true' >> "$GITHUB_OUTPUT"
      - name: Run four native cases and compile the CLI
        if: steps.root.outputs.admitted == 'true'
        run: |
          set -euo pipefail
          umask 077
          cat >"$MEDUSA_ROOT/outer/controller.py" <<'MEDUSA_CONTROLLER'
          """Qualify the four exact native cases using one fixed list and run per case."""
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time

          from tools.release.private_roots import admit_directory, atomic_write_private

          root = Path(os.environ["MEDUSA_ROOT"])
          admit_directory(root)
          sys.path.insert(0, str(Path("campaigns/node/medusa/harness").resolve()))
          from installed_process import contain_children, verify_children_gone

          suites = {
              "direct-child": {
                  "term-descendant": "node::tests::termination_reaps_direct_child_and_leaves_same_group_descendant_unsignaled",
                  "already-exited": "node::tests::termination_of_an_exited_direct_child_still_reaps",
              },
              "native-preflight": {
                  "bounded-version": "node::tests::native_version_probe_accepts_bounded_node_version_output",
                  "inherited-pipes": "node::tests::native_version_probe_bounds_pipe_drain_when_detached_descendant_holds_pipes",
              },
          }
          stages = [
              name + "-" + action
              for cases in suites.values() for name in cases for action in ("list", "test")
          ] + ["cli-check"]
          receipt = {
              "schemaVersion": 1, "kind": "medusa-native-direct-child-120", "status": "failed",
              "sourceSha": os.environ["MEDUSA_PRODUCT_SHA"], "sourceTree": os.environ["MEDUSA_PRODUCT_TREE"],
              "wrapperSha": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "stages": {name: {"command": "unreached", "exitCode": None, "cleanup": "unreached", "proof": None}
                         for name in stages},
          }


          def save():
              atomic_write_private(root / "safe/receipt.json", (json.dumps(receipt, sort_keys=True) + "\n").encode())


          def run(name, argv, deadline, judge=None):
              row = receipt["stages"][name]
              stdout = root / "outer" / (name + ".stdout")
              stderr = stdout.with_suffix(".stderr")
              seconds = deadline - time.monotonic()
              if seconds <= 0:
                  row["command"] = "deadline"
                  save()
                  return False
              try:
                  with stdout.open("xb") as out, stderr.open("xb") as err:
                      child = subprocess.Popen(argv, stdin=subprocess.DEVNULL, stdout=out, stderr=err)
                      try:
                          row["exitCode"] = child.wait(timeout=max(0, deadline - time.monotonic()))
                          row["command"] = "exited"
                      except subprocess.TimeoutExpired:
                          row["command"] = "deadline"
                          if child.poll() is None:
                              child.kill()
                          try:
                              child.wait(timeout=5)
                          except subprocess.TimeoutExpired:
                              row["command"] = "unreaped"
              except OSError:
                  row["command"] = "spawn-or-io"
              finally:
                  row["cleanup"] = "failed"
                  save()
                  try:
                      verify_children_gone()
                  except TimeoutError:
                      pass
                  else:
                      row["cleanup"] = "passed"
                      save()
              if judge is not None:
                  row["proof"] = "missing-or-oversize"
                  if stdout.is_file() and 0 < stdout.stat().st_size <= 65536:
                      row["proof"] = judge(stdout.read_text(encoding="utf-8", errors="replace"))
                  save()
              return (row["command"] == "exited" and row["exitCode"] == 0 and row["cleanup"] == "passed"
                      and (judge is None or row["proof"] == "verified"))


          def listed(output, test):
              identities = re.findall(r"^([A-Za-z0-9_:]+): (?:test|benchmark)$", output, re.M)
              return "verified" if identities == [test] else "exact-test-list-mismatch"


          def executed(output):
              summaries = re.findall(
                  r"^test result: ([A-Za-z]+)\. (\d+) passed; (\d+) failed; (\d+) ignored;"
                  r" (\d+) measured; \d+ filtered out(?:;|\b)", output, re.M,
              )
              return "verified" if summaries == [("ok", "1", "0", "0", "0")] else "one-test-summary-mismatch"


          save()
          contain_children()
          for cases in suites.values():
              deadline = time.monotonic() + 900
              for name, test in cases.items():
                  selector = ["cargo", "test", "--locked", "-p", "xtrace-runtime", "--lib", test, "--", "--exact"]
                  if not run(name + "-list", selector + ["--list", "--format=terse"], deadline,
                             lambda output: listed(output, test)):
                      sys.exit(1)
                  if not run(name + "-test", selector + ["--format=terse", "--color=never", "--test-threads=1"],
                             deadline, executed):
                      sys.exit(1)
          if not run("cli-check", ["cargo", "check", "--locked", "-p", "xtrace-cli"], time.monotonic() + 900):
              sys.exit(1)
          receipt["status"] = "passed"
          save()
          MEDUSA_CONTROLLER
          printf '%s  %s\n' 'ed1851c3485fdeae4c33250860c657ba759e040b5c0123d9f60b7b504794f6cf' "$MEDUSA_ROOT/outer/controller.py" | sha256sum --check --status
          PYTHONPATH="$PWD" python3 -B "$MEDUSA_ROOT/outer/controller.py" >"$MEDUSA_ROOT/outer/controller.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.root.outputs.admitted == 'true'
        with:
          name: medusa-120-native-direct-child-counts
          path: ${{ env.MEDUSA_ROOT }}/safe/receipt.json
          if-no-files-found: error
          retention-days: 7
