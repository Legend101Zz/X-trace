name: Installed Spring replay proof
on:
  push:
    branches: [codex/proof-installed-replay-118-package-diagnostic]
permissions:
  contents: read
jobs:
  installed-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PRODUCT: c4093cec4a56a38c10e8ffa12d2622de2a694ece
      PRODUCT_TREE: 52f073d06c564cc7fbdef3e1ca5c1f09a7c52eca
      EXPECTED_UI_MANIFEST_SHA256: be69d6fb982a55b865e8591cb041e4ff17e5fb1489914a4b6461e0b925376250
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
        working-directory: product
    steps:
      - name: Check out exact product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT }}
          path: product
          persist-credentials: false
      - name: Read the reviewed proof scripts from the exact wrapper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: wrapper
          sparse-checkout: .github/proof
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Admit private scratch and verify exact trees and scripts
        id: root
        run: |
          set -euo pipefail
          umask 077
          [[ "$PRODUCT" =~ ^[0-9a-f]{40}$ && "$PRODUCT_TREE" =~ ^[0-9a-f]{40}$ && "$EXPECTED_UI_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test "$(git -C ../wrapper rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          scripts="$GITHUB_WORKSPACE/wrapper/.github/proof"
          (
            cd "$scripts"
            sha256sum --check --status <<'SUMS'
          49c4c0330429bce9d042fdf4a0c2a9fd04ae06c589e186b724eeeb932b8adb27  installed-replay-118-baseline-driver.py
          a8ff14672d6538aa95be473c34ff6942293bfe9f4eb4f2d5ca524279e7134c23  installed-replay-118-baseline-browser.mjs
          8f132e73164fca95a4d87242f7dd0a0cc146ff87b664c136d2ba52654d76e8c6  installed-replay-118-package-diagnostic.py
          SUMS
          )
          root="$RUNNER_TEMP/xr118"
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/logs" "$root/private" "$root/safe" "$root/shots" "$root/shots/existing"
          printf '%s\n' "PROOF_ROOT=$root" "PROOF_SCRIPTS=$scripts" "PLAYWRIGHT_BROWSERS_PATH=$root/chromium" >> "$GITHUB_ENV"
          printf '%s\n' 'admitted=true' >> "$GITHUB_OUTPUT"
      - name: Build verify install and run the genuine Spring replay privately
        id: proof
        if: steps.root.outputs.admitted == 'true'
        run: |
          set -euo pipefail
          umask 077
          rc=0
          PYTHONPATH="$PWD" python3 -B "$PROOF_SCRIPTS/installed-replay-118-baseline-driver.py" \
            >"$PROOF_ROOT/logs/outer.stdout" 2>"$PROOF_ROOT/logs/outer.stderr" || rc=$?
          echo "Installed Spring replay exit $rc"
          exit "$rc"
      - name: Retain bounded package failure tails for the existing recipient
        id: package-diagnostic
        if: ${{ !cancelled() && steps.proof.outcome == 'failure' && steps.root.outputs.admitted == 'true' }}
        env:
