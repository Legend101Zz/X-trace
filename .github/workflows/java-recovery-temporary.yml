name: java-recovery-temporary
on:
  push:
    branches: [codex/java-recovery-78]
permissions:
  contents: read
jobs:
  java-strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - name: Strict Java gate
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private"
          set +e
          (cd adapters/java && ./gradlew --no-daemon --dependency-verification strict clean test installDist agentDist fixtureBootJar) > "$RUNNER_TEMP/private/java-strict.log" 2>&1
          result=$?
          set -e
          echo "Strict Java gate exit: $result"
          exit "$result"
      - name: Encrypt diagnostics
        if: always()
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private"
          echo "" | base64 -d > "$RUNNER_TEMP/recipient.crt"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/private.tar" private
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/private.tar" -outform DER -out "$RUNNER_TEMP/java-recovery.enc" "$RUNNER_TEMP/recipient.crt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: encrypted-java-recovery
          path: ${{ runner.temp }}/java-recovery.enc
          if-no-files-found: error
          retention-days: 1
