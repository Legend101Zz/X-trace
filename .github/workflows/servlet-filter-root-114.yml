name: Installed servlet filter refusal
on:
  push:
    branches: [diagnostic/servlet-filter-root-114]
permissions:
  contents: read
jobs:
  refusal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: subject
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 41754087e2ea2d73e5d8470113a3a093e1b6685e
          path: subject
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            subject/adapters/java/build.gradle.kts
            subject/adapters/java/settings.gradle.kts
            subject/adapters/java/gradle.lockfile
            subject/adapters/java/*/build.gradle.kts
            subject/adapters/java/*/gradle.lockfile
            subject/adapters/java/gradle/verification-metadata.xml
            subject/adapters/java/gradle/wrapper/gradle-wrapper.properties
      - name: Build and verify the reviewed unsigned archive
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/x114"
          mkdir -m 700 "$root" "$root/tmp" "$root/priv" "$root/extract"
          export TMPDIR="$root/tmp" XTRACE_TEST_PRIVATE_SCRATCH="$root/priv"
          test "$(git rev-parse HEAD)" = 41754087e2ea2d73e5d8470113a3a093e1b6685e
          if ! python3 -B packaging/build.py --out "$root/dist" --work "$root/package-work" --platform linux-x86_64 >"$root/build.log" 2>&1; then
            if grep -Fq 'Could not resolve' "$root/build.log"; then
              echo 'Package build dependency resolution failed.'
            else
              echo 'Exact-head package build failed.'
            fi
            exit 1
          fi
          dist="$root/dist/linux-x86_64"
          sh packaging/install.sh verify-dist "$dist" >"$root/verify-dist.log"
          archives=("$dist"/xtrace-*-linux-x86_64.tar.gz)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          test -f "$archive"
          python3 -B packaging/verify_package.py "$archive" --run-binary --repo . --out "$root/verify-package.json" >"$root/verify-package.log"
          tar -xzf "$archive" -C "$root/extract"
          entries=("$root"/extract/xtrace-*)
          test "${#entries[@]}" -eq 1
          prefix="$root/installed X-trace"
          sh "${entries[0]}/install.sh" --prefix "$prefix" --data-home "$root/journey/data" >"$root/install.log"
          sh "$prefix/current/install.sh" verify --prefix "$prefix" >"$root/verify-install.log"
          digest=$(sha256sum "$archive" | cut -d' ' -f1)
          echo "Verified unsigned Linux archive SHA-256: $digest" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the real Spring fixture and check Java probes
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/x114"
          export TMPDIR="$root/tmp" XTRACE_TEST_PRIVATE_SCRATCH="$root/priv"
          if ! adapters/java/gradlew -p adapters/java --dependency-verification strict --no-daemon \
            fixtureBootJar :agent-bootstrap:test --tests '*SpringMvcBridgeTest' \
            :agent-runtime:test --tests '*ServletBoundaryInstrumentationTest' \
            >"$root/fixture.log" 2>&1; then
            if grep -Fq 'Could not resolve' "$root/fixture.log"; then
              echo 'Java dependency resolution failed.'
            else
              echo 'Spring fixture build or focused Java tests failed.'
            fi
            exit 1
          fi
          echo 'Real Spring Boot fixture and focused bridge/servlet instrumentation tests passed.'
      - name: Exercise real Spring requests through the verified installation
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/x114"
          export TMPDIR="$root/tmp" XTRACE_TEST_PRIVATE_SCRATCH="$root/priv"
          export XTRACE_TEST_JAVA_INSTALLED_PREFIX="$root/installed X-trace"
          cargo fmt --all --check
          git diff --check HEAD^ HEAD
          if cargo test --locked -p xtrace-cli --test java_redirect_source_journey -- --test-threads=1 \
            >"$root/journey.log" 2>&1; then
            rc=0
          else
            rc=$?
          fi
          grep -E '^test [a-z_]+ \.\.\. (ok|FAILED)$|^test result: (ok|FAILED)\.' "$root/journey.log" \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          if (( rc )); then
            grep -E "^thread '[a-z_]+' .*panicked at crates/[a-z_-]+/tests/[a-z_]+\.rs:[0-9]+:[0-9]+:$" "$root/journey.log" || true
            grep -Eo '^error\[E[0-9]+\]' "$root/journey.log" | sort -u || true
            exit "$rc"
          fi
          grep -Eq '^test filter_refusal_with_servlet_and_completed_async_controls_keeps_one_route_less_recording \.\.\. ok$' "$root/journey.log"
          grep -Eq '^test filter_send_error_remains_provisional_through_container_redispatch \.\.\. ok$' "$root/journey.log"
