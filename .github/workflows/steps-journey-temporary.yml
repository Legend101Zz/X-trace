name: steps-journey-temporary
on:
  push:
    branches: [codex/replay-steps-86]
permissions:
  contents: read
jobs:
  spring-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/xtrace-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Build fixture and install browser
        run: |
          python3 -B -m tools.qa.lane_run run --suite rust --step prelude-build --out "$RUNNER_TEMP/lane-frag" -- bash -ec '
            npm ci --prefix web/app
            (cd web/app && npx playwright install --with-deps chromium)
            (cd adapters/java && ./gradlew --dependency-verification strict clean testClasses installDist agentDist fixtureBootJar)
          '
      - name: Admit private scratch
        run: |
          root="${RUNNER_TEMP:?}/xt"
          mkdir -m 700 "$root" "$root/tmp" "$root/priv"
          echo "TMPDIR=$root/tmp" >> "$GITHUB_ENV"
          echo "XTRACE_TEST_PRIVATE_SCRATCH=$root/priv" >> "$GITHUB_ENV"
      - name: Real Spring packaged viewer journey
        run: |
          python3 -B -m tools.qa.lane_run run --suite rust --step spring-journey --min-passed 9 --max-ignored 0 --out "$RUNNER_TEMP/lane-frag" -- \
            cargo test --locked -p xtrace-cli --test java_run_spring -- --test-threads=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: steps-journey-summary
          path: ${{ runner.temp }}/lane-frag
          if-no-files-found: ignore
          retention-days: 1
