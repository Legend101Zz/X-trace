name: settings-journey-temporary
on:
  push:
    branches: [codex/viewer-settings-108]
permissions:
  contents: read
jobs:
  focused-spring:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/xtrace-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - run: npm ci --prefix web/app
      - run: npm run typecheck --prefix web/app && npm test --prefix web/app
      - run: npm run build --prefix web/app && npm run embed --prefix web/app && npm run check:embedded --prefix web/app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-settings-viewer
          path: crates/xtrace-daemon/assets/ui/
          if-no-files-found: error
      - name: Build fixture and install browser
        run: |
          python3 -B -m tools.qa.lane_run run --suite rust --step prelude-build --out "$RUNNER_TEMP/lane-frag" -- bash -ec '
            (cd web/app && npx playwright install --with-deps chromium)
            (cd adapters/java && ./gradlew --dependency-verification strict clean testClasses installDist agentDist fixtureBootJar)
          '
      - name: Admit private scratch
        run: |
          root="${RUNNER_TEMP:?}/xt"
          mkdir -m 700 "$root" "$root/tmp" "$root/priv"
          echo "TMPDIR=$root/tmp" >> "$GITHUB_ENV"
          echo "XTRACE_TEST_PRIVATE_SCRATCH=$root/priv" >> "$GITHUB_ENV"
      - name: Prepare private frame directory
        run: mkdir -m 700 "$RUNNER_TEMP/focused-frames" "$RUNNER_TEMP/inspector-frames"
      - name: Real Spring inspector journeys
        env:
          XTRACE_FOCUSED_SCREENSHOT_DIR: ${{ runner.temp }}/focused-frames
          XTRACE_BROWSER_SCREENSHOT_DIR: ${{ runner.temp }}/inspector-frames
        run: |
          python3 -B -m tools.qa.lane_run run --suite rust --step standard-settings --min-passed 1 --max-ignored 0 --out "$RUNNER_TEMP/lane-frag" -- \
            cargo test --locked -p xtrace-cli --test java_run_spring run_launches_spring_fixture_captures_selected_root_and_forwards_shutdown -- --exact
          python3 -B -m tools.qa.lane_run run --suite rust --step focused-settings --min-passed 1 --max-ignored 0 --out "$RUNNER_TEMP/lane-frag" -- \
            cargo test --locked -p xtrace-cli --test java_run_spring focused_spring_viewer_highlights_a_recorded_line_and_local -- --exact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: settings-journey-summary
          path: ${{ runner.temp }}/lane-frag
          if-no-files-found: ignore
          retention-days: 1
      - name: Encrypt private diagnostics and frames
        if: always()
        env:
          EVIDENCE_CERT: 
        run: |
          set -eu
          printf '%s' "$EVIDENCE_CERT" | base64 -d > "$RUNNER_TEMP/evidence.crt"
          mkdir -p "$RUNNER_TEMP/focused-frames" "$RUNNER_TEMP/inspector-frames" "$RUNNER_TEMP/xl"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/private-evidence.tar" focused-frames inspector-frames xl
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/private-evidence.tar" -outform DER -out "$RUNNER_TEMP/private-evidence.enc" "$RUNNER_TEMP/evidence.crt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: encrypted-settings-evidence
          path: ${{ runner.temp }}/private-evidence.enc
          if-no-files-found: error
          retention-days: 1
