name: Vendure installed ordinary paired proof
on:
  push:
    branches: [codex/proof-vendure-installed-ordinary-125]
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PRODUCT: '0b34e21ee318b3e46f3d1a81317a1f6478b34866'
      PRODUCT_TREE: 'c398e5cbd8a49a7778cd10fda14703506a9293e7'
      PRODUCT_PARENT: 'bf043bc5d2590b9d0b0cece31a5f1f45663b33b0'
      PATCH_SHA256: 'cabc6b9e40e3ba14ac8c95fed9c8fda842ec2970dfaedfe9193125c77822df3d'
      FOCUSED_RUN_ID: '45840791562'
      FOCUSED_RECEIPT_SHA256: '03097e721b3d07e716a86a5b1bc0b86e9df4980e405e96432be33f9ffb72c2bb'
      FOCUSED_EVIDENCE: ''
      XCAMP_PLATFORM: linux/amd64
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Admit exact product and workflow
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = 'Legend101Zz/X-trace'
          test "$GITHUB_REF" = 'refs/heads/codex/proof-vendure-installed-ordinary-125'
          test "$GITHUB_EVENT_NAME" = push && test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$PRODUCT"
          test "$(git show -s --format=%P "$PRODUCT")" = "$PRODUCT_PARENT"
          test "$(git rev-parse "$PRODUCT^{tree}")" = "$PRODUCT_TREE"
          workflow='.github/workflows/vendure-installed-ordinary.yml'
          test "$(git diff --name-status --no-renames "$PRODUCT" HEAD)" = $'A\t'"$workflow"
          test "$(git ls-tree HEAD -- "$workflow" | cut -d' ' -f1)" = 100644
          test "$(git diff --no-ext-diff --no-textconv --no-color --binary --full-index "$PRODUCT_PARENT" "$PRODUCT" | sha256sum | cut -d' ' -f1)" = "$PATCH_SHA256"
          python3 -B - <<'PYCODE'
          import base64,subprocess
          data=base64.b64decode('',validate=True)
          p=subprocess.run(['python3','-B','-c',data.decode('utf8')],check=False)
          raise SystemExit(p.returncode)
          PYCODE
          git checkout --detach --quiet "$PRODUCT"
          test -z "$(git status --porcelain --untracked-files=all)"
          proof="$RUNNER_TEMP/vendure-installed-ordinary-125"
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$proof"
          mkdir -m 700 "$proof/logs" "$proof/safe" "$proof/stages" "$proof/preparation-parent" "$proof/image-context" "$proof/npm-pack"
          printf '%s\n' "PROOF=$proof" "TMPDIR=$proof/tmp" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 17
      - name: Build candidate package privately
        id: package
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'running\n' >"$PROOF/stages/package-toolchain"
          if rustup show active-toolchain >"$PROOF/logs/rust-toolchain" 2>&1 || rustup toolchain install stable --profile minimal >>"$PROOF/logs/rust-toolchain" 2>&1; then
            printf 'success\n' >"$PROOF/stages/package-toolchain"
          else
            rc=$?; printf 'failure\n' >"$PROOF/stages/package-toolchain"; exit "$rc"
          fi
          printf 'running\n' >"$PROOF/stages/package-build"
          if python3 -B packaging/build.py --out "$PROOF/dist" --platform linux-x86_64 >"$PROOF/logs/package.stdout" 2>"$PROOF/logs/package.stderr"; then
            printf 'success\n' >"$PROOF/stages/package-build"
          else
            rc=$?; printf 'failure\n' >"$PROOF/stages/package-build"; exit "$rc"
          fi
      - name: Set up campaign Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        id: node24
        if: ${{ steps.package.outcome == 'success' }}
        with:
          node-version: 24.21.0
      - name: Prepare once and run the genuine two-leg installed pair
        id: campaign
        timeout-minutes: 90
        if: ${{ steps.package.outcome == 'success' && steps.node24.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(node -p process.versions.node)" = '24.21.0'
          test -z "$(git status --porcelain --untracked-files=all)"
          export XTRACE_VENDURE_PREPARATION_PARENT="$PROOF/preparation-parent"
          stage() {
            local name="$1"; shift
            printf 'running\n' >"$PROOF/stages/$name"
            if "$@" >"$PROOF/logs/$name.stdout" 2>"$PROOF/logs/$name.stderr"; then
              printf 'success\n' >"$PROOF/stages/$name"
            else
              local rc=$?
              printf 'failure\n' >"$PROOF/stages/$name"
              return "$rc"
            fi
          }
          image() {
            cp campaigns/node/vendure/harness/paired-image.Dockerfile "$PROOF/image-context/Dockerfile" || return
            cp web/app/package.json web/app/package-lock.json "$PROOF/image-context/" || return
            docker build --platform linux/amd64 --build-arg NODE_VERSION=24.21.0 --iidfile "$XTRACE_VENDURE_PREPARATION_PARENT/vendure-image.id" "$PROOF/image-context"
          }
          assets() {
            local version
            version=$(python3 -B -c 'import json;print(json.load(open("campaigns/node/vendure/campaign.json"))["starter"]["package"]["version"])') || return
            (cd "$PROOF/npm-pack" && npm pack "@vendure/create@$version" --silent) || return
            python3 -B campaigns/node/vendure/harness/seed_assets.py retain "$PROOF/npm-pack/vendure-create-$version.tgz" "$XTRACE_VENDURE_PREPARATION_PARENT/preparation/create-assets.tgz" || return
            python3 -B campaigns/node/vendure/harness/seed_assets.py prepare "$XTRACE_VENDURE_PREPARATION_PARENT/preparation/create-assets.tgz" "$XTRACE_VENDURE_PREPARATION_PARENT/preparation/create-assets"
          }
          pair() {
            python3 -B - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['PROOF'])
          data={'repo':os.environ['GITHUB_WORKSPACE'], 'workspaceParent':str(root/'preparation-parent'),
                'outDir':str(root/'pair'), 'archive':str(root/'dist/linux-x86_64/xtrace-0.0.1-linux-x86_64.tar.gz'),
                'sourceCommit':os.environ['PRODUCT']}
          with (root/'pair-config.json').open('x') as f: json.dump(data,f)
          PY
            local rc=$?
            if [ "$rc" -ne 0 ]; then return "$rc"; fi
            node campaigns/node/vendure/harness/installed-pair.mjs "$PROOF/pair-config.json"
          }
          stage image image
          stage create node campaigns/node/vendure/harness/run.mjs create
          stage assets assets
          stage build node campaigns/node/vendure/harness/run.mjs build
          stage seed node campaigns/node/vendure/harness/run.mjs seed
          stage pair pair
      - name: Project reached observations without private content
        id: projection
        if: ${{ always() && steps.admission.outcome == 'success' }}
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
          NODE24_OUTCOME: ${{ steps.node24.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'PY'
          import base64, os, subprocess
          data=base64.b64decode('',validate=True)
          p=subprocess.run(['python3','-B','-c',data.decode('utf8')],check=False)
          raise SystemExit(p.returncode)
          PY
      - name: Upload bounded ordinary receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.projection.outputs.ready == 'true' }}
        with:
          name: vendure-installed-ordinary-v8-receipt
          path: ${{ env.PROOF }}/safe/receipt.json
          if-no-files-found: error
          retention-days: 7
