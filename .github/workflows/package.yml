name: package

# Unsigned release-candidate packaging. Produces archives + checksums + SBOM + licenses per platform and runs a
# reproducibility double-build. No secrets are used; signing/notarization is an owner-held step (packaging/sign-*.sh).
on:
  push:
    branches:
      - "slice/v001-**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  package:
    name: package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: Rust toolchain (stable, from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install stable --profile minimal
      - name: Tool versions
        run: |
          rustc --version; cargo --version; node --version; java -version; python3 --version; openssl version
      - name: Packaging tool unit checks
        run: python3 -B -m unittest discover -s tools/supply_chain -p 'test_*.py'
      - name: Build, then rebuild twice from clean exports and compare (reproducibility)
        run: python3 packaging/repro_check.py --out "$RUNNER_TEMP/repro" --platform "${{ matrix.platform }}"
      - name: Build the artifact set
        run: python3 packaging/build.py --out dist --platform "${{ matrix.platform }}" --work "$RUNNER_TEMP/repro/build-x/work"
      - name: Verify checksums and fresh-profile install/upgrade/uninstall
        run: |
          set -eu
          sh packaging/install.sh verify-dist "dist/${{ matrix.platform }}"
          sh packaging/test/install_test.sh "dist/${{ matrix.platform }}"
      - name: S0b DIAGNOSTIC - which archive members differ from the repro build
        run: |
          python3 - "dist/${{ matrix.platform }}" "$RUNNER_TEMP/repro/build-a/dist/${{ matrix.platform }}" <<'PY'
          import glob, hashlib, sys, tarfile, re
          def members(d):
              (a,) = glob.glob(d + "/xtrace-*.tar.gz")
              out = {}
              with tarfile.open(a) as tf:
                  for m in tf.getmembers():
                      data = tf.extractfile(m).read() if m.isfile() else b""
                      out[m.name] = (m.mode, m.size, hashlib.sha256(data).hexdigest(), data)
              return out
          mine, theirs = members(sys.argv[1]), members(sys.argv[2])
          print("only-in-checkout:", sorted(set(mine) - set(theirs)))
          print("only-in-repro:", sorted(set(theirs) - set(mine)))
          for name in sorted(set(mine) & set(theirs)):
              a, b = mine[name], theirs[name]
              if a[:3] != b[:3]:
                  print("DIFF", name, "checkout", a[:3], "repro", b[:3])
                  pa = set(re.findall(rb"/[A-Za-z0-9_./+-]{6,}", a[3])); pb = set(re.findall(rb"/[A-Za-z0-9_./+-]{6,}", b[3]))
                  print("  path-like only in checkout:", sorted(pa - pb)[:40])
                  print("  path-like only in repro:", sorted(pb - pa)[:40])
          PY
          echo "TMPDIR=$TMPDIR"; ls -ld /var /tmp "$TMPDIR" || true
          set +e
          mkdir -p "$RUNNER_TEMP/cmpA" "$RUNNER_TEMP/cmpB"
          tar -xzf dist/${{ matrix.platform }}/xtrace-*.tar.gz -C "$RUNNER_TEMP/cmpA"
          tar -xzf "$RUNNER_TEMP"/repro/build-a/dist/${{ matrix.platform }}/xtrace-*.tar.gz -C "$RUNNER_TEMP/cmpB"
          A=$(ls "$RUNNER_TEMP"/cmpA/*/bin/xtrace); B=$(ls "$RUNNER_TEMP"/cmpB/*/bin/xtrace)
          echo "differing byte count: $(cmp -l "$A" "$B" | wc -l)"; cmp -l "$A" "$B" | head -5; cmp -l "$A" "$B" | tail -3
          echo "--- uuid checkout"; otool -l "$A" | grep -A2 LC_UUID; echo "--- uuid repro"; otool -l "$B" | grep -A2 LC_UUID
          echo "--- codesign checkout"; codesign -dvvv "$A" 2>&1 | grep -E 'CodeDirectory|Hash|Identifier|flags|CDHash'
          echo "--- codesign repro"; codesign -dvvv "$B" 2>&1 | grep -E 'CodeDirectory|Hash|Identifier|flags|CDHash'
          echo "--- segments checkout"; otool -l "$A" | grep -E 'segname|sectname|fileoff|filesize' | paste - - - - | head -40 > /tmp/segA; echo "--- segments repro"; otool -l "$B" | grep -E 'segname|sectname|fileoff|filesize' | paste - - - - | head -40 > /tmp/segB; diff /tmp/segA /tmp/segB && echo "segment layout identical"
          python3 - "$A" "$B" <<'PY2'
          import sys
          a, b = (open(f, "rb").read() for f in sys.argv[1:3])
          diffs = [i for i in range(min(len(a), len(b))) if a[i] != b[i]]
          ranges = []
          for i in diffs:
              if ranges and i <= ranges[-1][1] + 64: ranges[-1][1] = i
              else: ranges.append([i, i])
          print("diff ranges (start,end,len):", [(s, e, e - s + 1) for s, e in ranges][:30], "total ranges", len(ranges))
          PY2
      - name: Compare archive hash with the reproducibility build
        run: |
          python3 - "dist/${{ matrix.platform }}" "$RUNNER_TEMP/repro/repro.json" <<'PY'
          import glob, hashlib, json, sys
          (archive,) = glob.glob(sys.argv[1] + "/xtrace-*.tar.gz")
          mine = hashlib.sha256(open(archive, "rb").read()).hexdigest()
          r = json.load(open(sys.argv[2]))
          assert r["reproducible"], r
          theirs = [v for k, v in r["buildA"].items() if k.endswith(".tar.gz")][0]
          assert theirs == mine, (theirs, mine)
          print("reproducible; archive sha256", mine)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtrace-unsigned-${{ matrix.platform }}
          path: |
            dist/${{ matrix.platform }}/
            ${{ runner.temp }}/repro/repro.json
          if-no-files-found: error
          retention-days: 30
