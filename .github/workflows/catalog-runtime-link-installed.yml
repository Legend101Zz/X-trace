name: Installed scoped catalog journey
on:
  push:
    branches: [diagnostic/catalog-runtime-link-installed-112]
permissions:
  contents: read
jobs:
  installed-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f14f42bf1096595ebf2d4c79c9d8849f78f69810
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          components: rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            adapters/java/build.gradle.kts
            adapters/java/settings.gradle.kts
            adapters/java/gradle.lockfile
            adapters/java/*/build.gradle.kts
            adapters/java/*/gradle.lockfile
            adapters/java/gradle/verification-metadata.xml
            adapters/java/gradle/wrapper/gradle-wrapper.properties
      - name: Check migration compatibility and build the verified Linux archive
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/x112"
          mkdir -m 700 "$root" "$root/tmp" "$root/priv" "$root/fragments"
          export TMPDIR="$root/tmp" XTRACE_TEST_PRIVATE_SCRATCH="$root/priv"
          test "$(git rev-parse HEAD)" = f14f42bf1096595ebf2d4c79c9d8849f78f69810
          cargo fmt --all --check
          python3 -B -m tools.qa.lane_run run --suite rust --step registered-v11 --min-passed 2 --max-ignored 0 --out "$root/fragments" -- \
            cargo test --locked -p xtrace-store --lib proposed_catalog_link
          python3 -B -m tools.qa.lane_run run --suite rust --step historical-catalog --min-passed 6 --max-ignored 0 --out "$root/fragments" -- \
            cargo test --locked -p xtrace-store --test catalog_link_tests
          if ! python3 -B packaging/build.py --out "$root/dist" --work "$root/package-work" --platform linux-x86_64 >"$root/build.log" 2>&1; then
            if grep -Fq 'Could not resolve' "$root/build.log"; then
              echo 'Package build dependency resolution failed.'
            else
              echo 'Exact-head package build failed.'
            fi
            exit 1
          fi
          npm run check:api --prefix web/app
      - name: Install exact archive and verify the Spring catalog journey
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/x112"
          export TMPDIR="$root/tmp" XTRACE_TEST_PRIVATE_SCRATCH="$root/priv"
          dist="$root/dist/linux-x86_64"
          stage=distribution
          trap 's=$?; if [ "$s" -ne 0 ]; then echo "Installed catalog stage failed: $stage"; fi' EXIT
          sh packaging/install.sh verify-dist "$dist" > "$root/verify-dist.log"
          archives=("$dist"/xtrace-*-linux-x86_64.tar.gz)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          test -f "$archive"
          python3 -B packaging/verify_package.py "$archive" --run-binary --repo . --out "$root/verify-package.json" > "$root/verify-package.log"
          stage=installer
          mkdir -m 700 "$root/extract" "$root/caller" "$root/spring-lib" "$root/spring-classes"
          tar -xzf "$archive" -C "$root/extract"
          entries=("$root"/extract/xtrace-*)
          test "${#entries[@]}" -eq 1
          prefix="$root/installed X-trace"
          sh "${entries[0]}/install.sh" --prefix "$prefix" --data-home "$root/data" > "$root/install.log"
          sh "$prefix/current/install.sh" verify --prefix "$prefix" > "$root/verify-install.log"
          test "$(realpath "$prefix/bin/xtrace")" = "$(realpath "$prefix/current/bin/xtrace")"
          test -x "$prefix/current/share/xtrace/analyzers/java/bin/xtrace-java-static"
          python3 -B - "$prefix/current/share/xtrace/PACKAGE-MANIFEST.json" <<'PY'
          from pathlib import Path
          import json, sys
          manifest = json.loads(Path(sys.argv[1]).read_text())
          if manifest["sourceCommit"] != "f14f42bf1096595ebf2d4c79c9d8849f78f69810" or manifest["packTrust"] != "unsigned":
              raise SystemExit("Unexpected package identity")
          PY
          stage=fixture
          if ! adapters/java/gradlew -p adapters/java --dependency-verification strict --no-daemon fixtureBootJar >"$root/fixture.log" 2>&1; then
            echo 'Spring fixture build failed.'
            exit 1
          fi
          (
            cd "$root/spring-lib"
            jar -xf "$GITHUB_WORKSPACE/adapters/java/spring-fixture/build/libs/xtrace-spring-fixture.jar" BOOT-INF/lib
          )
          javac --release 17 -cp "$root/spring-lib/BOOT-INF/lib/*" -d "$root/spring-classes" \
            tools/qa/fixtures/catalog-link/SpringLinkFixture.java
          export XTRACE_LINK_SPRING_CLASSPATH="$root/spring-classes:$root/spring-lib/BOOT-INF/lib/*"
          mv adapters/java/static-analyzer/build/install/xtrace-java-static "$root/checkout-analyzer"
          unset XTRACE_JAVA_ANALYZER XTRACE_NODE_ANALYZER XTRACE_PREFIX
          cd "$root/caller"
          stage=journey
          python3 -B "$GITHUB_WORKSPACE/tools/qa/catalog_link_journey.py" "$GITHUB_WORKSPACE" "$prefix/bin/xtrace" "$root/journeys" --installed-prefix "$prefix" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          digest=$(sha256sum "$archive" | cut -d' ' -f1)
          echo "Verified unsigned Linux archive SHA-256: $digest" | tee -a "$GITHUB_STEP_SUMMARY"
