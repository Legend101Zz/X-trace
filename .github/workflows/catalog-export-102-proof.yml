name: catalog-export-102-proof

on:
  push:
    branches: [codex/export-catalog-102-proof]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROBE_SOURCE: 8048159458ae9d93b664ce96e2269bd7a3a6470c
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PROBE_SOURCE }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Verify exact source and admit private scratch
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$PROBE_SOURCE"
          root="${RUNNER_TEMP:?}/xf"
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/frag"
          echo "XTRACE_CI_PRIVATE_ROOT=$root" >> "$GITHUB_ENV"
          printf '{"sourceSha":"%s","fullFloor":false,"releaseAcceptance":false}\n' \
            "$PROBE_SOURCE" > "$root/frag/probe-source.json"
      - name: Identify the failing lint or compilation check
        run: |
          python3 -B - <<'PYTHON'
          import json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ["XTRACE_CI_PRIVATE_ROOT"])
          tracked = set(subprocess.check_output(["git","ls-files"],text=True).splitlines())
          checks = [
            ("format", ["cargo","fmt","--all","--check"]),
            ("export", ["cargo","clippy","--locked","--all-features","-p","xtrace-export","--all-targets","--message-format=json","--","-D","warnings"]),
            ("store", ["cargo","clippy","--locked","--all-features","-p","xtrace-store","--lib","--message-format=json","--","-D","warnings"]),
            ("cli", ["cargo","clippy","--locked","--all-features","-p","xtrace-cli","--test","export_journey","--message-format=json","--","-D","warnings"]),
          ]
          rows=[]
          for label,argv in checks:
              log = root/(label+".jsonl")
              with log.open("wb") as out, (root/(label+".stderr")).open("wb") as err:
                  result=subprocess.run(argv,stdout=out,stderr=err)
              entries=[]
              with log.open(errors="replace") as inp:
                  for line in inp:
                      try: item=json.loads(line)
                      except ValueError: continue
                      if not isinstance(item,dict) or item.get("reason")!="compiler-message": continue
                      msg=item["message"]
                      if msg.get("level") not in ("error","warning"): continue
                      code=(msg.get("code") or {}).get("code") or "uncategorized"
                      if not re.fullmatch(r"(?:clippy::[a-z0-9_]+|[A-Za-z][A-Za-z0-9_]{0,63})",code): code="uncategorized"
                      for span in msg.get("spans",[]):
                          file=span.get("file_name","")
                          if span.get("is_primary") and file in tracked and type(span.get("line_start")) is int:
                              entries.append([code,file,span["line_start"]])
              row={"check":label,"exit":result.returncode,"compilerLocations":entries[:48]}
              rows.append(row)
              print(json.dumps(row))
          (root/"frag"/"lint.json").write_text(json.dumps(rows))
          raise SystemExit(int(any(r["exit"] for r in rows)))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && env.XTRACE_PRIVATE_ROOT_ADMITTED == '1' }}
        with:
          name: catalog-export-lint-locations
          path: ${{ env.XTRACE_CI_PRIVATE_ROOT }}/frag/*.json
          if-no-files-found: error
          retention-days: 14
