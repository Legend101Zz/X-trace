name: focused-object-io-temporary
on:
  push:
    branches: [codex/focused-object-io-diagnostic]
permissions:
  contents: read
jobs:
  singleton-acknowledgement:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Prepare private diagnostic root
        run: |
          umask 077
          root="${RUNNER_TEMP:?}/xt"
          mkdir -m 700 "$root" "$root/c" "$root/tmp" "$root/priv" "$root/diagnostic"
          {
            echo "TMPDIR=$root/tmp"
            echo "XTRACE_TEST_PRIVATE_SCRATCH=$root/priv"
            echo "XTRACE_TEST_CARDINALITY_SCRATCH=$root/c"
            echo "XTRACE_OBJECT_DIAGNOSTIC_ROOT=$root"
          } >> "$GITHUB_ENV"
      - name: Verify diagnostic attribution before running the workload
        run: |
          set -eu
          umask 077
          root="$XTRACE_OBJECT_DIAGNOSTIC_ROOT/diagnostic"
          cargo test --locked -p xtrace-store --lib \
            recording_store::object_diagnostic::tests \
            -- --nocapture > "$root/diagnostic-unit.log" 2>&1
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$root/diagnostic-unit.log"
          cargo test --locked -p xtrace-store --lib \
            recording_port::tests::journal_sync_errors_prevent_acknowledgement_and_report_original_io_facts \
            -- --exact --nocapture > "$root/correlated-io.log" 2>&1
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$root/correlated-io.log"
      - name: Run the unchanged focused singleton test
        run: |
          set -eu
          umask 077
          root="$XTRACE_OBJECT_DIAGNOSTIC_ROOT"
          status=0
          {
            echo 'scratch capacity before test'
            stat -f -c 'available_blocks=%a free_inodes=%d block_size=%S' "$root/c"
          } > "$root/diagnostic/capacity.txt"
          cargo test --locked -p xtrace-store --lib             recording_port::tests::singleton_acknowledgements_at_focused_cap_recover_with_bounded_segments_and_pages             -- --exact --nocapture > "$root/diagnostic/singleton.log" 2>&1 || status=$?
          {
            echo 'scratch capacity after test cleanup'
            stat -f -c 'available_blocks=%a free_inodes=%d block_size=%S' "$root/c"
          } >> "$root/diagnostic/capacity.txt"
          if [ "$status" -eq 0 ] && ! grep -q 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$root/diagnostic/singleton.log"; then
            status=1
          fi
          echo "Focused singleton diagnostic exit: $status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Encrypt raw diagnostic logs
        if: always() && env.XTRACE_OBJECT_DIAGNOSTIC_ROOT != ''
        env:
          EVIDENCE_CERT: 
        run: |
          set -eu
          umask 077
          root="$XTRACE_OBJECT_DIAGNOSTIC_ROOT"
          printf '%s' "$EVIDENCE_CERT" | base64 -d > "$root/evidence.crt"
          tar -C "$root" -cf "$root/singleton-diagnostic.tar" diagnostic
          openssl cms -encrypt -binary -aes-256-cbc             -in "$root/singleton-diagnostic.tar" -outform DER             -out "$RUNNER_TEMP/singleton-diagnostic.enc" "$root/evidence.crt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.XTRACE_OBJECT_DIAGNOSTIC_ROOT != ''
        with:
          name: encrypted-singleton-diagnostic
          path: ${{ runner.temp }}/singleton-diagnostic.enc
          if-no-files-found: error
          retention-days: 1
