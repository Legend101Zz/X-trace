name: segment-sql-profile-temporary
on:
  push:
    branches: [codex/sparse-segment-sql-profile-78]
permissions:
  contents: read
jobs:
  jdk17-sparse-segment-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Prepare the admitted floor-depth scratch layout
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP:?}/xf"
          [ "${#root}" -le 40 ]
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/diag" "$root/diag/frag" "$root/c" "$root/tmp/t" "$root/tmp/p"
          echo "XTRACE_SEGMENT_SQL_ROOT=$root" >> "$GITHUB_ENV"
      - name: Observe SQL phases in one unchanged sparse cardinality test
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_SEGMENT_SQL_ROOT"
          export CARGO_TARGET_DIR="$root/cargo-target"
          export TMPDIR="$root/tmp/t" TMP="$root/tmp/t" TEMP="$root/tmp/t"
          export XTRACE_TEST_SCRATCH_ROOT="$root/tmp/t" XTRACE_TEST_PRIVATE_SCRATCH="$root/tmp/p"
          export XTRACE_TEST_CARDINALITY_SCRATCH="$root/c"
          export XTRACE_CI_PRIVATE_ROOT="$root/diag" XTRACE_SEGMENT_SQL_DETAIL=1
          unset XTRACE_CHECKPOINT_PROFILE_DETAIL XTRACE_CHECKPOINT_PREPARE_DETAIL
          sparse=recording_port::tests::sparse_acknowledged_batches_hit_admission_before_becoming_unreadable
          if ! cargo test --locked -p xtrace-store --lib --all-features "$sparse" -- --exact > "$root/diag/test.log" 2>&1; then
            echo "Sparse segment SQL observation failed"
            exit 1
          fi
          grep -Fxq "test $sparse ... ok" "$root/diag/test.log"
          grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$root/diag/test.log"
          python3 -B - "$root/diag/frag" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib
          import sys

          from tools.qa.store_profiles import collect

          profiles = collect(pathlib.Path(sys.argv[1]))
          assert set(profiles) == {"sparse"}
          report = profiles["sparse"]
          assert report["workload"] == {"expected_admissions": 10000, "counted_journal_syncs": 0}
          complete = report["lastReport"]
          assert complete["state"] == "returned" and complete["completed"] == 10000
          assert complete["elapsed_ns"] > 0 and "linuxAclProbes" not in report
          names = {
              "segment_sql_begin": "SQLite transaction begin",
              "segment_sql_segment_insert": "Segment row insertion",
              "segment_sql_frame_index_insert": "Frame index validation and insertion",
              "segment_sql_commit": "SQLite commit",
          }
          optional = {
              "segment_sql_rollback": "Rollback",
              "segment_sql_conflict": "Existing segment lookup after conflict",
          }
          reference = {
              "segment_sql_transaction": "Transaction wrapper and remaining bookkeeping",
              "connection_file_admission": "Connection file admission across the workload",
          }
          phases = report["phases"]
          assert names.keys() <= phases.keys() and reference.keys() <= phases.keys()
          assert {name for name in phases if name.startswith("segment_sql_")} <= names.keys() | optional.keys() | reference.keys()
          print("Sparse segment transaction observation (JDK17)")
          print("- Exact existing test passed with 10,000 admissions and ordinary sync behavior.")
          print(f"- Workload profile elapsed: {complete['elapsed_ns'] / 1e9:.3f}s.")
          for name, label in {**names, **optional, **reference}.items():
              if name not in phases:
                  print(f"- {label}: unobserved.")
                  continue
              phase = phases[name]
              assert 0 < phase["spans"] <= 1_000_000
              assert 0 < phase["max_ns"] <= phase["total_ns"] <= complete["elapsed_ns"]
              print(f"- {label}: {phase['total_ns'] / 1e9:.3f}s exclusive, {phase['spans']} spans.")
          print("- SQLite commit time can include durable WAL work; this does not isolate its constituents.")
          print("- One instrumented observation. No paired speedup, profiler overhead, release-floor "
                "proof, or historical object-I/O cause established.")
          PY
      - name: Encrypt private diagnostics
        if: always() && env.XTRACE_SEGMENT_SQL_ROOT != ''
        env:
          EVIDENCE_CERT: 
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_SEGMENT_SQL_ROOT"
          printf '%s' "$EVIDENCE_CERT" | base64 -d > "$root/evidence.crt"
          tar -C "$root" -cf - diag | openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER -out "$root/segment-sql-profile.enc" "$root/evidence.crt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.XTRACE_SEGMENT_SQL_ROOT != ''
        with:
          name: encrypted-segment-sql-profile
          path: ${{ env.XTRACE_SEGMENT_SQL_ROOT }}/segment-sql-profile.enc
          if-no-files-found: error
          retention-days: 1
