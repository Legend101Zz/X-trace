name: Medusa installed cleanup guard proof
on:
  push:
    branches: [codex/proof-medusa-cleanup-guard-120]
permissions:
  contents: read
concurrency:
  group: medusa-installed-120
  cancel-in-progress: false
jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MEDUSA_PRODUCT_SHA: 4c68e216566bafebe109b2ca476d1b85738f5a75
      MEDUSA_PRODUCT_TREE: 047bca545d15670c5e1652d7d551e2949a5dd443
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Admit source and private directories
        id: root
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$MEDUSA_PRODUCT_SHA"
          git checkout --detach "$MEDUSA_PRODUCT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$MEDUSA_PRODUCT_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          owner="$(mktemp -d "$RUNNER_TEMP/medusa-owned-proof.XXXXXXXX")"
          root="$owner/proof"
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/outer" "$root/safe"
          printf '%s\n' "MEDUSA_ROOT=$root" >> "$GITHUB_ENV"
          printf '%s\n' 'admitted=true' >> "$GITHUB_OUTPUT"
      - name: Run the three installed lifecycle checks
        if: steps.root.outputs.admitted == 'true'
        run: |
          set -euo pipefail
          umask 077
          cat >"$MEDUSA_ROOT/outer/controller.py" <<'MEDUSA_CONTROLLER'
          """Run the named lifecycle suite and project only finite counts."""
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          from tools.qa.unittest_summary import read_result, summarize
          from tools.release.private_roots import admit_directory, atomic_write_private

          root = Path(os.environ["MEDUSA_ROOT"])
          admit_directory(root)
          harness = Path("campaigns/node/medusa/harness")
          sys.path.insert(0, str(harness.resolve()))
          from installed_process import contain_children, verify_children_gone

          suites = {"installed-lifecycle": ("test_installed_lifecycle.py", 3)}
          receipt = {
              "schemaVersion": 1, "kind": "medusa-cleanup-guard-120", "status": "failed",
              "sourceSha": os.environ["MEDUSA_PRODUCT_SHA"], "sourceTree": os.environ["MEDUSA_PRODUCT_TREE"],
              "wrapperSha": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "suites": {key: {"command": "unreached", "exitCode": None, "cleanup": "unreached",
                               "counts": None} for key in suites},
          }


          def save():
              atomic_write_private(root / "safe/receipt.json", (json.dumps(receipt, sort_keys=True) + "\n").encode())


          def run(name, pattern, expected):
              row = receipt["suites"][name]
              path = root / "outer" / (name + ".json")
              try:
                  with (root / "outer" / (name + ".log")).open("xb") as log:
                      child = subprocess.Popen(
                          [sys.executable, "-B", "-m", "tools.qa.unittest_run", "--result", str(path),
                           "discover", "-s", str(harness), "-p", pattern],
                          stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT)
                      try:
                          code = child.wait(timeout=30)
                          row["command"] = "exited"
                          row["exitCode"] = code
                      except subprocess.TimeoutExpired:
                          row["command"] = "deadline"
                          if child.poll() is None:
                              child.kill()
                          try:
                              child.wait(timeout=5)
                          except subprocess.TimeoutExpired:
                              row["command"] = "unreaped"
              except OSError:
                  row["command"] = "spawn-or-io"
              finally:
                  row["cleanup"] = "failed"
                  save()
                  try:
                      verify_children_gone()
                  except TimeoutError:
                      pass
                  else:
                      row["cleanup"] = "passed"
                      save()
              try:
                  if path.stat().st_size > 16384:
                      return False
                  result = read_result(path)
                  summarize(result)
                  counts = result["counts"]
                  if any(value > 64 for value in counts.values()):
                      return False
                  row["counts"] = counts
                  save()
              except (OSError, ValueError):
                  return False
              return (row["command"] == "exited" and row["exitCode"] == 0 and row["cleanup"] == "passed"
                      and counts["testsRun"] == expected
                      and all(value == 0 for key, value in counts.items() if key != "testsRun"))


          save()
          contain_children()
          for suite, (pattern, expected) in suites.items():
              if not run(suite, pattern, expected):
                  sys.exit(1)
          receipt["status"] = "passed"
          save()
          MEDUSA_CONTROLLER
          printf '%s  %s\n' 'ab977747641c448a245107233d661211b8549631a2cf9da5af059f13941dc67e' "$MEDUSA_ROOT/outer/controller.py" | sha256sum --check --status
          PYTHONPATH="$PWD" python3 -B "$MEDUSA_ROOT/outer/controller.py" >"$MEDUSA_ROOT/outer/controller.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.root.outputs.admitted == 'true'
        with:
          name: medusa-120-cleanup-guard-counts
          path: ${{ env.MEDUSA_ROOT }}/safe/receipt.json
          if-no-files-found: error
          retention-days: 7
