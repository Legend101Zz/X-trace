            XA860/O98Mb3uR8NR0OQA1PrCc/uH9fA5EsdHgsp+YpB1yj8D0blbweXRYAAZb44
            9zPHIrkfduzmeqBodJUg2XbXKYDg1PC+tFva5NWTYrp7CPY1xYcffaYb/RpPc2C1
            O1PP7MpyuY/LH4bxtMd5Mjcz2qNw295S7RZAnoP9lU3R8af99OuSkhPgHz/x/jCW
            7J5+uR/ZKMNP+o/7mPe55yXNuuyVH2v6mnf9nONqeHZPLxJWzAgqkF4zrUrA66YO
            qwt3G2O2KErAwo5wT7n5u1BiJzTrU1oIvEoCR43oyiFlOHIJ3WxBLCgDb6frqMAt
            XM0u/CD69DpfF4vMEsgraAxrGCQ81Qgj5knjCWPYZuT/bCjYa7zdX9ARDw==
            -----END CERTIFICATE-----
        if: always()
        run: |
          set -euo pipefail
          umask 077
          python3 -B campaigns/java/jhipster/harness/encrypt_diagnostic.py \
            --private-root "$RUNNER_TEMP/jhipster-proof-private/run" \
            --encrypted-out "$RUNNER_TEMP/jhipster-proof-private/encrypted"
      - name: Scan observed sinks and write the bounded public result
        if: always()
        run: |
          set -euo pipefail
          umask 077
          python3 -B campaigns/java/jhipster/harness/public_result.py \
            --private-root "$RUNNER_TEMP/jhipster-proof-private/run" \
            --public-out "$RUNNER_TEMP/jhipster-proof-public"
      - name: Verify reached installed workloads and terminal diagnostics
        if: ${{ !cancelled() && (steps.campaign.outcome == 'success' || steps.campaign.outcome == 'failure') }}
        env:
          PACKAGE_SHA256: ${{ steps.identity.outputs.package-sha256 }}
        run: |
          set -euo pipefail
          umask 077
          helper="$RUNNER_TEMP/jhipster-proof-private/verify-terminal.py"
          cat > "$helper" <<'DIAGNOSTICS'
          """Verify the pinned campaign's public summary against its private CLI inventory."""
          import os
          from pathlib import Path

          from campaigns.java.jhipster.harness import public_result as result


          def verify():
              root = Path(os.environ["RUNNER_TEMP"])
              private = root / "jhipster-proof-private/run"
              summary, status = result.read_object(root / "jhipster-proof-public/summary.json")
              if status != "present" or not isinstance(summary, dict):
                  raise SystemExit("bounded-receipt-unavailable")
              if (summary.get("schema") != "xtrace-jhipster-installed-public/1"
                      or summary.get("project") != "jhipster" or summary.get("nonRelease") is not True
                      or summary.get("releaseAcceptance") is not False or summary.get("publication") != "passed"
                      or summary.get("sourceCommit") != os.environ["PRODUCT"]
                      or summary.get("packageSha256") != os.environ["PACKAGE_SHA256"]
                      or summary.get("packageVerification") != "passed"
                      or summary.get("privateRoot") != "available" or not result.root_admitted(private)):
                  raise SystemExit("installed-proof-identity-or-publication-unavailable")
              expected = list(result.SCENARIOS)
              for leg in ("baseline", "instrumented"):
                  receipt = summary[leg]
                  rows = receipt["scenarios"]
                  if (receipt["status"] != "present" or len(rows) != 8
                          or [(r["id"], r["expectedRequests"], r["expectedChecks"]) for r in rows] != expected
                          or any(r["workload"] != "passed" or r["observedRequests"] != r["expectedRequests"]
                                 or r["checksPassed"] != r["observedChecks"] or r["observedChecks"] != r["expectedChecks"]
                                 for r in rows)):
                      raise SystemExit("full-workload-unreached-or-failed")
                  if sum(r["observedRequests"] for r in rows) != 77 or sum(r["observedChecks"] for r in rows) != 39:
                      raise SystemExit("workload-total-mismatch")
              rows = summary["instrumented"]["scenarios"]
              if any(r["fingerprintMatchesBaseline"] != "passed" for r in rows):
                  raise SystemExit("instrumented-baseline-fingerprint-mismatch")
              boundary = summary.get("boundaryDiagnostics")
              if (not isinstance(boundary, dict) or boundary.get("schemaVersion") != 2
                      or len(boundary["phases"]) != 3
                      or result.boundary_diagnostics.projection(
                          {k: v for k, v in boundary.items() if k != "firstUnverifiedPhase"}) != boundary):
                  raise SystemExit("boundary-v2-diagnostics-unavailable")
              phases = {phase["name"]: phase["status"] for phase in summary["phases"]}
              if phases.get("collect-sinks") not in ("passed", "failed"):
                  raise SystemExit("cli-collection-unreached")
              raw, status = result.read_object(private / "sinks/cli-status.json")
              cli = summary["cli"].get("diagnostics")
              if (status != "present" or not isinstance(raw, dict) or raw.get("schema") != "xtrace-jhipster-cli-sinks/3"
                      or not isinstance(cli, dict) or result.cli_diagnostics(raw) != cli):
                  raise SystemExit("current-cli-diagnostics-unavailable")
              failure = cli["firstFailure"]
              incomplete = isinstance(failure, dict) and failure["stage"] == "detail" and failure["reason"] == "incomplete-evidence"
              if incomplete:
                  comparison = cli.get("firstIncomplete")
                  if not isinstance(comparison, dict) or set(comparison) != {
                          "cli", "api", "apiRead", "cliReadScope", "observationPhases", "sameReadScope",
                          "sharedKnownCategories", "provenance"}:
                      raise SystemExit("first-incomplete-diagnostics-unavailable")
                  pair = comparison["provenance"]
                  if (set(pair) != {"cli", "api"} or not result.collect_sinks.partial_provenance.valid(pair["cli"])
                          or comparison["apiRead"] != "complete-read"
                          or not result.collect_sinks.partial_provenance.valid(pair["api"])):
                      raise SystemExit("paired-detail-provenance-unavailable")
              elif "firstIncomplete" in cli:
                  raise SystemExit("first-incomplete-diagnostics-without-failure")
              evidence = summary["recordingEvidence"]["scenarios"]
              if (summary.get("recordingJudgement") != "observed"
                      or [r["id"] for r in evidence] != [r["id"] for r in rows]
                      or any(r["recordingVerdict"] not in ("passed", "failed") or r["recordingVerdict"] != s["recording"]
                             for r, s in zip(evidence, rows))):
                  raise SystemExit("per-scenario-recording-judgments-incomplete")
              if any(r["recordingVerdict"] != "passed" for r in evidence):
                  raise SystemExit("scenario-recording-failures-observed")
              print("Verified both full workloads, eight recording verdicts and current terminal diagnostics")


          if __name__ == "__main__":
              try:
                  verify()
              except (KeyError, OSError, TypeError, ValueError, AttributeError, RecursionError):
                  raise SystemExit("installed-diagnostic-shape-invalid") from None
          DIAGNOSTICS
          test "$(sha256sum "$helper" | cut -d ' ' -f 1)" = 'aa028098d10a87764583d7fb58e4812609b415495394be193580023dd014d422'
          PYTHONPATH="$GITHUB_WORKSPACE" python3 -B "$helper"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: jhipster-installed-public-result
          path: ${{ runner.temp }}/jhipster-proof-public/summary.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && steps.diagnostic.outputs.ready == 'true' }}
        with:
          name: jhipster-pre-receipt-encrypted-stderr
          path: ${{ runner.temp }}/jhipster-proof-private/encrypted/failure-stderr.cms
          if-no-files-found: error
          retention-days: 1
