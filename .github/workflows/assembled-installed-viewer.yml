# Private, unexecuted development proof. Fill every reviewed/verified placeholder only after exact source proof and embed verification.
name: Assembled genuinely installed viewer proof
on:
  push:
    branches: [codex/proof-installed-tour-reveal-118]
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PRODUCT: d0581314cc4ecfc90ec6483ea3809fb0e0e4c2a7
      PRODUCT_TREE: 0f2aa64d21ceb8f0414e758556a0588c13c09dec
