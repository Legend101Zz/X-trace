        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Verify all pins and admit fresh private runner root
        id: root
        run: |
          set -euo pipefail
          umask 077
          scripts="$GITHUB_WORKSPACE/wrapper/.github/proof/assembled-installed"
          test "$(git -C ../wrapper rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C ../wrapper show -s --format=%P HEAD)" = "$PRODUCT"
          test "$(shasum -a 256 "$scripts/SHA256SUMS" | cut -d' ' -f1)" = 48a092fa1ddedcbc660beb867c63158097322b74a47a72b242b7f54b1cc0d3e8
          (cd "$scripts" && sha256sum --check --status SHA256SUMS)
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test "$(git rev-parse "$ASSEMBLED_SOURCE_SHA^{tree}")" = "$ASSEMBLED_SOURCE_TREE"
          test "$(git rev-parse HEAD:web/app/scripts/browser-journey.mjs)" = "$REPLAY_SOURCE_BLOB"
          test "$(git rev-parse HEAD:web/app/scripts/replay-tools-journey.mjs)" = "$REPLAY_TOOLS_BLOB"
          test "$(git rev-parse HEAD:web/app/scripts/installed-export-journey.mjs)" = "$JOURNEY_BLOB"
          test -z "$(git status --porcelain --untracked-files=all)"
          root="$RUNNER_TEMP/xai1"
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/logs" "$root/private" "$root/safe" "$root/packages" "$root/encrypted"
          for name in replay tour export; do
            mkdir -m 700 "$root/$name" "$root/$name/logs" "$root/$name/private" "$root/$name/safe" "$root/$name/shots"
          done
          mkdir -m 700 "$root/replay/shots/existing" "$root/replay/shots/compact-open"
          printf '%s\n' "SHARED_ROOT=$root" "PROOF_SCRIPTS=$scripts" "TMPDIR=$root/tmp" "PLAYWRIGHT_BROWSERS_PATH=$root/chromium" >> "$GITHUB_ENV"
          printf '%s\n' 'admitted=true' >> "$GITHUB_OUTPUT"
      - name: Reject cross-stage success and unknown export receipt fields
        if: steps.root.outputs.admitted == 'true'
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH="$PWD:$PROOF_SCRIPTS" python3 -B "$PROOF_SCRIPTS/export-receipt-regressions.py" >"$SHARED_ROOT/logs/export-admission.stdout" 2>"$SHARED_ROOT/logs/export-admission.stderr"
          echo 'exportReceiptAdmissionRegressions=2'
      - name: Build and independently verify one archive and fresh official install
        id: package
        if: steps.root.outputs.admitted == 'true'
        run: |
          set -euo pipefail
          umask 077
          rc=0
          PYTHONPATH="$PWD:$PROOF_SCRIPTS" python3 -B "$PROOF_SCRIPTS/package-driver.py" >"$SHARED_ROOT/logs/outer.stdout" 2>"$SHARED_ROOT/logs/outer.stderr" || rc=$?
