        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_SOURCE_RUN_ID" |
            jq -e --arg sha "$VERIFIED_SOURCE_WRAPPER" --arg id "$VERIFIED_SOURCE_RUN_ID" '
