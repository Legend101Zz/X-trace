name: acl-probe-measurement-temporary
on:
  push:
    branches: [codex/acl-probe-measurement]
permissions:
  contents: read
jobs:
  linux-file-acl:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Prepare private measurement root
        run: |
          umask 077
          root="${RUNNER_TEMP:?}/acl-probe"
          mkdir -m 700 "$root" "$root/fixture" "$root/diagnostic"
          echo "XTRACE_ACL_MEASUREMENT_ROOT=$root" >> "$GITHUB_ENV"
      - name: Verify equivalence and measure paired file ACL operations
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_ACL_MEASUREMENT_ROOT"
          export CARGO_TARGET_DIR="$root/target"
          export XTRACE_ACL_PROBE_SCRATCH="$root/fixture"
          cargo build --locked -p xtrace-private-storage --message-format=json             > "$root/diagnostic/cargo.jsonl" 2> "$root/diagnostic/cargo.log"
          python3 -B - "$root" > "$root/diagnostic/compile.log" 2>&1 <<'PY'
          import json, pathlib, subprocess, sys, tomllib
          root = pathlib.Path(sys.argv[1])
          pin, = [pkg["version"] for pkg in tomllib.loads(pathlib.Path("Cargo.lock").read_text())["package"] if pkg["name"] == "rustix"]
          artifacts = set()
          for line in (root / "diagnostic/cargo.jsonl").read_text().splitlines():
              receipt = json.loads(line)
              if receipt["reason"] == "compiler-artifact" and receipt["target"]["name"] == "rustix":
                  assert receipt["package_id"].rsplit("#", 1)[-1] == "rustix@" + pin
                  artifacts.update(path for path in receipt["filenames"] if path.endswith(".rlib"))
          artifact, = artifacts
          subprocess.run(["rustc", "--edition=2024", "-C", "opt-level=0", "-C", "debuginfo=1",
                          "-L", f"dependency={pathlib.Path(artifact).parent}", "--extern", f"rustix={artifact}",
                          "tools/qa/fixtures/linux_acl_probe_measurement.rs", "-o", root / "acl-probe"], check=True)
          PY
          "$root/acl-probe" > "$root/diagnostic/measurement.log" 2>&1
          python3 -B - "$root/diagnostic/measurement.log" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import collections, pathlib, re, statistics, sys
          rows = collections.defaultdict(list)
          decisions = []
          raw = pathlib.Path(sys.argv[1]).read_text().splitlines()
          assert raw[-1] == "acl_probe_measurement_complete"
          for line in raw[:-1]:
              row = re.fullmatch(r"timing fixture=(named_absent|descriptor_absent|named_present|descriptor_present) pair=([1-5]) calls=(20000) baseline_ns=(\d+) size_only_ns=(\d+)", line)
              if row:
                  fixture, pair, calls, baseline, size_only = row.groups()
                  rows[fixture].append((int(pair), (int(baseline) - int(size_only)) / int(calls)))
              else:
                  assert re.fullmatch(r"decisions [a-z_= ]+(?: errno=-?\d+)?", line)
                  decisions.append(line)
          assert {"named_absent", "descriptor_absent"} <= rows.keys()
          print("Standalone Linux ACL presence measurement")
          print("")
          for label, samples in sorted(rows.items()):
              assert [pair for pair, _ in samples] == [1, 2, 3, 4, 5]
              deltas = [delta for _, delta in samples]
              print(f"- {label}: median baseline minus size-only {statistics.median(deltas):.1f} ns/call; "
                    f"paired range {min(deltas):.1f} to {max(deltas):.1f} ns/call")
          for line in decisions:
              print(f"- {line}")
          print("- Not an end-to-end floor measurement.")
          PY
      - name: Encrypt raw measurement diagnostics
        if: always() && env.XTRACE_ACL_MEASUREMENT_ROOT != ''
        env:
          EVIDENCE_CERT: 
        run: |
          set -eu
          umask 077
          root="$XTRACE_ACL_MEASUREMENT_ROOT"
          printf '%s' "$EVIDENCE_CERT" | base64 -d > "$root/evidence.crt"
          tar -C "$root" -cf "$root/acl-probe-diagnostic.tar" diagnostic
          openssl cms -encrypt -binary -aes-256-cbc -in "$root/acl-probe-diagnostic.tar"             -outform DER -out "$RUNNER_TEMP/acl-probe-diagnostic.enc" "$root/evidence.crt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.XTRACE_ACL_MEASUREMENT_ROOT != ''
        with:
          name: encrypted-acl-probe-diagnostic
          path: ${{ runner.temp }}/acl-probe-diagnostic.enc
          if-no-files-found: error
          retention-days: 1
