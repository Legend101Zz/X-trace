        run: |
          set -euo pipefail
          umask 077
          python3 -B "$PROOF_SCRIPTS/run-plan.py" > "$RUNNER_TEMP/xp121/logs/outer.stdout" 2> "$RUNNER_TEMP/xp121/logs/outer.stderr"
      - name: Admit the atomic count packet against the qualified source and current run
        id: atomic_counts
        if: ${{ always() && steps.admit.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          python3 -B "$PROOF_SCRIPTS/installed.py" --admit-public-report atomic >"$RUNNER_TEMP/xp121/logs/admit-atomic.stdout" 2>"$RUNNER_TEMP/xp121/logs/admit-atomic.stderr"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.atomic_counts.outcome == 'success' }}
        with:
          name: installed-exercise-atomic-counts
          path: ${{ runner.temp }}/xp121/public/atomic/counts.json
          if-no-files-found: error
          retention-days: 7
      - name: Admit the browser count packet against the qualified source and current run
        id: browser_counts
        if: ${{ always() && steps.admit.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
