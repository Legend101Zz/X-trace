# Private development proof; bind only after exact source qualification and asset authentication.
name: Installed owner Plan same-capture lifecycle
on:
  push:
    branches: [codex/proof-combined-focus-plan-installed-121]
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      ASSEMBLED_SOURCE_SHA: 'db94d2e197543b0fa35b214023e49c108a6a2fae'
      ASSEMBLED_SOURCE_TREE: 'e9536d80a3e6ac8438e5e02ad85b776771233f5d'
      EXPECTED_UI_MANIFEST_SHA256: '41b2e878d6822df3df5355ffe7ecf3c4ac988bb7177911b5ebc0c3b544db4854'
      INSTALLER_FIX_SHA: '1e630befb04c451ca085d3a8b0d3324525271460'
      INSTALL_SCRIPT_SHA256: '7623373412edeb406deab5bbf672d8d5653b4a363ec4aa8b850380608f2e0425'
      INSTALL_TEST_SHA256: 'c251607d61e391251eb50e62cb5ca156c89815e31890e2b1276b5f4012d603b8'
      JOURNEY_BLOB: '3cb043bdaa47b1a88d220d21ff56d3119256c184'
      PRODUCT: 'cd850fb9324189f05e0bae1c7f701b518b6d4769'
      PRODUCT_TREE: 'e91d0ca7e9c51050dcb5c429e835f111634110e4'
      REPLAY_PLAYBACK_BLOB: '6fe9ed6edd9cc96fe6a216628d2c36f586e87594'
      REPLAY_REPORT_BLOB: '24466b1e4d57ade43142d028355029f498e471f4'
      REPLAY_SOURCE_BLOB: '68ea032a08544c8e72f26e0237a997f460939b2b'
      REPLAY_TOOLS_BLOB: '31129b34c31f0b67ec91fe6e73bae0b46098ea21'
      SOURCE_ASSETS_ARCHIVE_SHA256: '8075fcc8923a234f2bba9adc3952099d3f3f945364797cee8d36cce7fcf46fce'
      SOURCE_ASSETS_ARCHIVE_SIZE: '161035'
      SOURCE_ASSETS_ARTIFACT_ID: '15108288204'
      SOURCE_COUNTS_ARCHIVE_SHA256: 'b71c50deeb641c8937421230aa73ac368793b84bf37f20ceff3c88ab3b9b4677'
      SOURCE_COUNTS_ARCHIVE_SIZE: '1828'
      SOURCE_COUNTS_ARTIFACT_ID: '15107583633'
      TOUR_SOURCE_BLOB: '22455772a1808651649a1351ac7e1a14726c0a78'
      VERIFIED_SOURCE_RUN_ID: '45802927180'
      VERIFIED_SOURCE_WRAPPER: '3c7f1d0f036330ce5f6db0fdc9c57ada1261d041'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
        working-directory: product
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: wrapper
          sparse-checkout: .github/proof/combined-focus-plan-121
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
      - name: Verify closed wrapper helpers and admit original private fixture scratch
        id: admit
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test "$(git -C ../wrapper rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C ../wrapper show -s --format=%P HEAD)" = "$PRODUCT"
          scripts="$GITHUB_WORKSPACE/wrapper/.github/proof/combined-focus-plan-121"
          test "$(sha256sum "$scripts/SHA256SUMS" | cut -d' ' -f1)" = '2078eb04f320727b64a4820479852a6f04799beafc853b8d9d6c1ecdaf890481'
          (cd "$scripts" && sha256sum --check --status SHA256SUMS)
          python3 -B - <<'INVENTORY'
          import os, subprocess
          base='.github/proof/combined-focus-plan-121/'
          names=['SHA256SUMS','test_receipt.py']+['plan-helpers/'+name for name in (
              'installed.py','owner-plan-browser.mjs','owner_plan.py','qualification.py','run-plan.py')]
          paths=sorted([base+name for name in names]+['.github/workflows/combined-focus-plan-installed.yml'])
          def git(*args):
              return subprocess.check_output(['git','-C','../wrapper',*args],text=True).splitlines()
          assert os.environ['GITHUB_EVENT_NAME']=='push' and os.environ['GITHUB_REF']=='refs/heads/codex/proof-combined-focus-plan-installed-121'
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert git('diff','--name-status',os.environ['PRODUCT'],os.environ['GITHUB_SHA'])==['A\t'+name for name in paths]
          entries=git('ls-tree','-r','HEAD','--',*paths)
          assert len(entries)==len(paths) and all(row.startswith('100644 blob ') for row in entries)
          INVENTORY
          root="$RUNNER_TEMP/xp121"
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/private" "$root/public" "$root/logs"
          printf '%s\n' "PROOF_SCRIPTS=$scripts/plan-helpers" "TMPDIR=$root/tmp" "XTRACE_TEST_PRIVATE_SCRATCH=$root/private" "PLAYWRIGHT_BROWSERS_PATH=$root/chromium" >> "$GITHUB_ENV"
      - name: Require all five focus receipt cases with closed pass counts
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'FOCUS'
          import importlib.util, os, unittest
          from pathlib import Path
          path=Path(os.environ['PROOF_SCRIPTS']).parent/'test_receipt.py'
          spec=importlib.util.spec_from_file_location('test_receipt',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          expected={
              'test_fixed_focus_failure_is_admitted_without_values',
              'test_unknown_nested_or_top_level_private_fields_are_refused',
              'test_roles_subchecks_states_locations_and_flags_are_closed',
              'test_diagnostics_cannot_turn_partial_checks_into_success',
              'test_unavailable_snapshot_remains_explicit_failure_evidence'}
          test_names=unittest.defaultTestLoader.getTestCaseNames(module.FocusReceipt)
          if len(test_names)!=5 or set(test_names)!=expected:
              raise SystemExit('focus receipt case inventory failed')
          suite=unittest.defaultTestLoader.loadTestsFromModule(module)
          if suite.countTestCases()!=5:
              raise SystemExit('focus receipt module inventory failed')
          with (Path(os.environ['RUNNER_TEMP'])/'xp121/logs/focus-cases.private').open('x') as log:
              result=unittest.TextTestRunner(stream=log,verbosity=2).run(suite)
          if (result.testsRun!=5 or not result.wasSuccessful() or result.skipped or
                  result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit('focus receipt case failed')
          print('Five of five focus receipt cases passed.')
          FOCUS
      - name: Require exact contracts and source runs, authenticated generated files and direct child
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 -B "$PROOF_SCRIPTS/qualification.py" > "$RUNNER_TEMP/xp121/logs/qualification.stdout" 2> "$RUNNER_TEMP/xp121/logs/qualification.stderr"
      - name: Prepare only pinned owner browser dependencies
        run: |
          set -euo pipefail
          umask 077
          timeout 3000 npm ci --prefix web/app --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/xp121/logs/browser-install.stdout" 2> "$RUNNER_TEMP/xp121/logs/browser-install.stderr"
          (cd web/app && timeout 3000 npm exec -- playwright install chromium) > "$RUNNER_TEMP/xp121/logs/chromium.stdout" 2> "$RUNNER_TEMP/xp121/logs/chromium.stderr"
