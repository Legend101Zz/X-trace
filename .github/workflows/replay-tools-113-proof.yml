# Development proof only. Replace 451928bc6bc9b4ec7cb38d368ce31798d58e2c2d and 54 after exact-source review.
# The scoped source-built Spring journey is not an installed-package or release acceptance claim.
name: Replay loaded Tools source-built Spring proof
on:
  push:
    branches: [codex/proof-replay-tools-113]
permissions:
  contents: read
jobs:
  viewer-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRODUCT: 451928bc6bc9b4ec7cb38d368ce31798d58e2c2d
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Admit fresh private scratch and exact source
        id: root
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'PY'
          import os, pathlib, re, subprocess
          from tools.release import ci_floor
          from tools.release.private_roots import ensure_private_directory
          sha = os.environ['PRODUCT']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == sha
          assert not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'])
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'xt113'
          assert len(str(root)) <= 40
          ci_floor._prepare_private_root(type('Args', (), {'root': str(root)})())
          for name in ('logs', 'fragments', 'safe', 'shots', 'generated', 'cache', 'receipts'):
              ensure_private_directory(root / name, must_create=True)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'PROOF_ROOT={root}\nPLAYWRIGHT_BROWSERS_PATH={root}/cache/chromium\nPROOF_RECEIPT_ID={os.urandom(32).hex()}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('admitted=true\n')
          PY
      - name: Check named suites build embed and run genuine Spring browser journey privately
        id: proof
        if: steps.root.outputs.admitted == 'true'
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess, sys
          from tools.release.private_roots import admit_directory, atomic_write_private
          root = pathlib.Path(os.environ['PROOF_ROOT'])
          admit_directory(root)
          os.umask(0o077)
          repo = pathlib.Path.cwd()
          env = dict(os.environ)
          for key in ('XTRACE_JAVA_ANALYZER', 'XTRACE_NODE_ANALYZER', 'XTRACE_JAVA_PACK', 'XTRACE_JAVA_AGENT', 'JAVA_TOOL_OPTIONS', 'JDK_JAVA_OPTIONS', '_JAVA_OPTIONS'):
              env.pop(key, None)
          env['XTRACE_BROWSER_SCREENSHOT_DIR'] = str(root/'shots')
          env['XTRACE_REPLAY_TOOLS_REPORT'] = str(root/'receipts/jumps.private.json')
          env['XTRACE_REPLAY_TOOLS_SOURCE_SHA'] = env['PRODUCT']
          env['XTRACE_REPLAY_TOOLS_RECEIPT_ID'] = env['PROOF_RECEIPT_ID']
          env['npm_config_cache'] = str(root/'cache/npm')
          stages = ('source-check', 'web-install', 'web-api', 'web-types', 'browser-syntax', 'tools-unit', 'contrast', 'web-build', 'web-embed', 'embedded-parity', 'generated-assets', 'java-build', 'adapter-verify', 'chromium-install', 'source-scope', 'spring-browser')
          report = {'schemaVersion': 1, 'kind': 'source-built-spring-replay-tools-proof', 'sourceSha': os.environ['PRODUCT'], 'releaseAcceptance': False, 'installedPackage': False, 'fullFloor': False, 'status': 'fail', 'stage': 'source-check', 'exitCode': 1, 'countsComplete': False, 'stages': []}
          atomic_write_private(root/'safe/counts.json', (json.dumps(report, sort_keys=True)+'\n').encode())
          def checkpoint():
              atomic_write_private(root/'safe/counts.json', (json.dumps(report, sort_keys=True)+'\n').encode())
          def command(label, args, cwd=repo, timeout=3000):
              assert label in stages
              report.update(stage=label, exitCode=1)
              checkpoint()
              number = len(report['stages']) + 1
              with (root/'logs'/f'{number}.stdout').open('xb') as out, (root/'logs'/f'{number}.stderr').open('xb') as err:
                  try:
                      result = subprocess.run(args, cwd=cwd, env=env, stdout=out, stderr=err, timeout=timeout, check=False)
                      code = result.returncode
                  except subprocess.TimeoutExpired:
                      code = 124
              report['stages'].append({'stage': label, 'exitCode': code, 'timedOut': code == 124})
              report['exitCode'] = code
              checkpoint()
              if code:
                  raise RuntimeError('stage-failed')
          def fragment(name, expected, key, stage):
              # A zero-exit command is not a passing count/schema validation.
              report.update(stage=stage, exitCode=1)
              checkpoint()
              path = root/'fragments'/name
              assert not path.is_symlink() and path.is_file() and path.stat().st_size <= 65536
              value = json.loads(path.read_bytes())
              safe = {key: value.get(key) for key in ('passed', 'failed', 'ignored')}
              assert all(type(v) is int and 0 <= v <= 100000 for v in safe.values())
              report[key] = safe
              checkpoint()
              assert value.get('status') == 'pass' and value.get('exitCode') == 0
              assert safe == {'passed': expected, 'failed': 0, 'ignored': 0}
              report['exitCode'] = 0
              checkpoint()
          generated = ('index.html', 'app.js', 'index.css', 'fonts/chivo-latin-400-normal.woff2', 'fonts/chivo-latin-600-normal.woff2', 'fonts/azeret-mono-latin-400-normal.woff2', 'assets.sha256')
          try:
              command('source-check', ['git', 'diff', '--exit-code', 'HEAD'])
              command('web-install', ['npm', 'ci', '--ignore-scripts', '--no-audit', '--no-fund'], cwd=repo/'web/app')
              command('web-api', ['npm', 'run', 'check:api'], cwd=repo/'web/app')
              command('web-types', ['npm', 'run', 'typecheck'], cwd=repo/'web/app')
              command('browser-syntax', ['node', '--check', 'scripts/browser-journey.mjs'], cwd=repo/'web/app')
              command('browser-syntax', ['node', '--check', 'scripts/replay-tools-journey.mjs'], cwd=repo/'web/app')
              command('browser-syntax', ['node', '--check', 'scripts/replay-tools-report.mjs'], cwd=repo/'web/app')
              command('browser-syntax', ['node', '--check', 'scripts/replay-tools-report.test.mjs'], cwd=repo/'web/app')
              command('browser-syntax', ['node', '--check', 'scripts/replay-window-journey.mjs'], cwd=repo/'web/app')
              unit_files = ['src/replay/loaded-tools.test.ts', 'src/features/events/ReplayTools.test.tsx', 'src/features/events/StepsList.test.tsx', 'src/features/shell/ViewerSettings.test.tsx', 'src/main.replay.test.tsx', 'scripts/replay-tools-report.test.mjs']
              lane = ['python3', '-B', '-m', 'tools.qa.lane_run', 'run', '--out', str(root/'fragments'), '--private-log-dir', str(root/'logs'), '--max-ignored', '0']
              command('tools-unit', lane + ['--suite', 'web', '--variant', '22', '--step', 'tools-unit', '--min-passed', '54', '--', 'npm', 'exec', '--prefix', 'web/app', '--', 'vitest', 'run', '--root', 'web/app', *unit_files], timeout=3060)
              fragment('web__22__tools-unit.json', 54, 'unit', 'tools-unit-count-validation')
              command('contrast', ['node', 'scripts/check-contrast.mjs'], cwd=repo/'web/app')
              command('web-build', ['npm', 'run', 'build'], cwd=repo/'web/app')
              command('web-embed', ['npm', 'run', 'embed'], cwd=repo/'web/app')
              command('embedded-parity', ['npm', 'run', 'check:embedded'], cwd=repo/'web/app')
              report.update(stage='generated-assets', exitCode=1)
              checkpoint()
              source = repo/'crates/xtrace-daemon/assets/ui'
              assert (source/'assets.sha256').stat().st_size <= 65536
              manifest = (source/'assets.sha256').read_text()
              lines = manifest.splitlines()
              assert len(lines) == 6
              digests = {}
              for line in lines:
                  digest, name = line.split('  ')
                  assert re.fullmatch('[0-9a-f]{64}', digest)
                  mapped = name.removeprefix('assets/')
                  assert mapped in generated[:-1] and mapped not in digests
                  assert (source/mapped).is_file() and not (source/mapped).is_symlink() and (source/mapped).stat().st_size <= 20*1024*1024
                  data = (source/mapped).read_bytes()
                  assert len(data) <= 20*1024*1024 and hashlib.sha256(data).hexdigest() == digest
                  digests[mapped] = digest
              assert set(digests) == set(generated[:-1])
              for name in generated:
                  original = source/name
                  assert original.is_file() and not original.is_symlink() and original.stat().st_size <= 20*1024*1024
                  target = root/'generated'/name
                  target.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  shutil.copyfile(original, target)
              report['generatedAssetCount'] = len(generated)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write('assets-ready=true\n')
              report['stages'].append({'stage': 'generated-assets', 'exitCode': 0, 'timedOut': False})
              checkpoint()
              command('java-build', ['./gradlew', '--no-daemon', '--dependency-verification', 'strict', 'clean', 'installDist', 'agentDist', 'fixtureBootJar'], cwd=repo/'adapters/java')
              report.update(stage='adapter-verify', exitCode=1)
              checkpoint()
              adapter_paths = ('adapters/java/agent-bootstrap/build/agent-dist/xtrace-java-agent.jar', 'adapters/java/spring-fixture/build/libs/xtrace-spring-fixture.jar')
              assert all((repo/name).is_file() and not (repo/name).is_symlink() and (repo/name).stat().st_size > 0 for name in adapter_paths)
              agent = repo/'adapters/java/agent-bootstrap/build/agent-dist'
              agent_manifest = agent/'manifest.sha256'
              assert agent_manifest.is_file() and not agent_manifest.is_symlink() and agent_manifest.stat().st_size <= 65536
              agent_members = set()
              for line in agent_manifest.read_text().splitlines():
                  digest, name = line.split('  ')
                  parts = pathlib.PurePosixPath(name).parts
                  assert re.fullmatch('[0-9a-f]{64}', digest) and parts and not name.startswith('/') and all(part not in ('.','..') for part in parts)
                  assert name not in agent_members and name.endswith('.jar')
                  member = agent/name
                  assert member.is_file() and not member.is_symlink() and member.stat().st_size <= 256*1024*1024
                  assert all(not (agent/pathlib.Path(*parts[:i])).is_symlink() for i in range(1,len(parts)))
                  with member.open('rb') as stream:
                      assert hashlib.file_digest(stream, 'sha256').hexdigest() == digest
                  agent_members.add(name)
              assert 2 <= len(agent_members) <= 128 and 'xtrace-java-agent.jar' in agent_members and any(name.startswith('runtime/') for name in agent_members)
              report['adapterArtifactCount'] = len(adapter_paths)
              report['verifiedAgentJarCount'] = len(agent_members)
              report['stages'].append({'stage': 'adapter-verify', 'exitCode': 0, 'timedOut': False})
              checkpoint()
              # Hosted Ubuntu already supplies Chromium libraries; no privileged dependency installer.
              command('chromium-install', ['npm', 'exec', '--', 'playwright', 'install', 'chromium'], cwd=repo/'web/app')
              report.update(stage='source-scope', exitCode=1)
              checkpoint()
              dirty = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], env=env, text=True).splitlines()
              assert set(dirty) <= {'crates/xtrace-daemon/assets/ui/'+name for name in generated}
              assert not subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], env=env)
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], env=env, text=True).strip() == env['PRODUCT']
              report['stages'].append({'stage': 'source-scope', 'exitCode': 0, 'timedOut': False})
              checkpoint()
              # Keep lane_run's existing 3000s command limit, readiness and browser limits unchanged.
              command('spring-browser', lane + ['--suite', 'rust', '--variant', '17', '--step', 'spring-browser', '--min-passed', '1', '--ci-diagnostics', '--', 'cargo', 'test', '--locked', '--all-features', '--features', 'xtrace-private-storage/ci-diagnostics', '-p', 'xtrace-cli', '--test', 'java_run_spring', 'run_launches_spring_fixture_captures_selected_root_and_forwards_shutdown', '--', '--exact', '--nocapture'], timeout=3060)
              fragment('rust__17__spring-browser.json', 1, 'spring', 'spring-count-validation')
              report.update(status='awaiting-browser-receipt', stage='jump-receipt-validation', exitCode=0, countsComplete=False)
          except Exception:
              report.update(status='fail', exitCode=report['exitCode'] or 1, countsComplete=False)
              # Never publish exception text, argv, logs, trace values or diagnostic files.
          checkpoint()
          sys.exit(0 if report['status'] == 'awaiting-browser-receipt' else 1)
          PY
      - name: Project bounded progress and encrypt allowlisted viewport frames
        id: visual
        if: ${{ always() && steps.root.outputs.admitted == 'true' }}
        env:
          # Public certificate only; supplied from the existing qualified viewer visual recipient.
          RECIPIENT_CERT: |
