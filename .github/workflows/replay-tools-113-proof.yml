        run: |
          python3 -B - <<'PY'
          import hashlib, io, json, os, pathlib, stat, struct, subprocess, tarfile
          from tools.release.private_roots import admit_directory, atomic_write_private, read_private_json
          root = pathlib.Path(os.environ['PROOF_ROOT'])
          admit_directory(root)
          os.umask(0o077)
          safe = root/'safe/counts.json'
          if safe.is_symlink() or not safe.is_file() or safe.stat().st_size > 65536:
              raise SystemExit(1)
          report = json.loads(safe.read_bytes())
          assert report.get('sourceSha') == os.environ['PRODUCT']
          def project_jumps():
              value = read_private_json(root/'receipts/jumps.private.json', maximum_bytes=65536, maximum_nodes=4096, maximum_commas=4096)
              assert set(value) == {'schemaVersion', 'kind', 'sourceSha', 'receiptId', 'status', 'stage', 'failureStage', 'viewports'}
              assert value['schemaVersion'] == 1 and type(value['schemaVersion']) is int and value['kind'] == 'spring-replay-tools-jumps'
              assert value['sourceSha'] == os.environ['PRODUCT'] and value['receiptId'] == os.environ['PROOF_RECEIPT_ID']
              stages = {'before-tools', 'viewport', 'jump-observation', 'jump-activation', 'jump-absence', 'viewport-complete', 'complete'}
              assert value['status'] in ('running', 'pass', 'fail') and value['stage'] in stages
              assert value['failureStage'] is None or value['failureStage'] in stages
              assert (value['status'] == 'fail') == (value['failureStage'] is not None)
              expected = [(w,h,p) for w,h in ((320,640),(736,900),(1024,768),(1280,900),(1440,900)) for p in ('fine','coarse')]
              assert isinstance(value['viewports'], list) and len(value['viewports']) == 10
              kinds = ('gap', 'exception', 'database', 'http')
              directions = ('next', 'previous')
              cells, inventory = [], {}
              summary = {kind: {direction: {'activated': 0, 'absenceReasonChecked': 0} for direction in directions} for kind in kinds}
              for cell, identity in zip(value['viewports'], expected):
                  assert isinstance(cell, dict) and set(cell) == {'width','height','pointer','status','jumps'}
                  assert type(cell['width']) is int and type(cell['height']) is int and (cell['width'],cell['height'],cell['pointer']) == identity
                  assert cell['status'] in ('not-started','running','pass','fail')
                  rows = cell['jumps']
                  assert isinstance(rows, list) and len(rows) <= 4
                  assert cell['status'] != 'not-started' or not rows
                  assert cell['status'] != 'pass' or len(rows) == 4
                  rebuilt = []
                  for index, row in enumerate(rows):
                      assert isinstance(row, dict) and set(row) == {'kind','observedCount','next','previous'}
                      kind, count = row['kind'], row['observedCount']
                      assert kind == kinds[index] and type(count) is int and 0 <= count <= 100000
                      checked = {'kind': kind, 'observedCount': count}
                      for direction in directions:
                          outcome = row[direction]
                          assert isinstance(outcome, dict) and set(outcome) == {'targetAvailable','activated','absenceReasonChecked'}
                          available, activated, absent = (outcome[key] for key in ('targetAvailable','activated','absenceReasonChecked'))
                          assert type(available) is bool and type(activated) is int and type(absent) is int
                          assert activated in (0,1) and absent in (0,1) and activated + absent <= 1
                          assert (not activated or available) and (not absent or not available)
                          assert cell['status'] != 'pass' or activated + absent == 1
                          checked[direction] = {'targetAvailable': available, 'activated': activated, 'absenceReasonChecked': absent}
                          summary[kind][direction]['activated'] += activated
                          summary[kind][direction]['absenceReasonChecked'] += absent
                      targets = (checked['next']['targetAvailable'], checked['previous']['targetAvailable'])
                      assert any(targets) == (count > 0) and (count <= 1 or all(targets))
                      fact = (count, targets)
                      assert kind not in inventory or inventory[kind] == fact
                      inventory[kind] = fact
                      rebuilt.append(checked)
                  cells.append({'width': identity[0], 'height': identity[1], 'pointer': identity[2], 'status': cell['status'], 'jumps': rebuilt})
              complete = value['status'] == 'pass' and value['stage'] == 'complete' and all(cell['status'] == 'pass' for cell in cells)
              assert value['status'] != 'pass' or complete
              return {'status': value['status'], 'stage': value['stage'], 'failureStage': value['failureStage'], 'receiptId': os.environ['PROOF_RECEIPT_ID'], 'viewports': cells, 'summary': summary}, complete
          jump_complete = False
          try:
              report['jumpCoverage'], jump_complete = project_jumps()
              report['jumpReceipt'] = 'validated'
          except FileNotFoundError:
              report['jumpReceipt'] = 'unavailable'
          except Exception:
              report['jumpReceipt'] = 'invalid-or-unavailable'
          if report.get('status') == 'awaiting-browser-receipt':
              if jump_complete:
                  report.update(status='pass', stage='complete', exitCode=0, countsComplete=True)
              else:
                  report.update(status='fail', stage='jump-receipt-validation', exitCode=1, countsComplete=False)
          shots = root/'shots'
          admit_directory(shots)
          widths = ((320,640), (736,900), (1024,768), (1280,900), (1440,900))
          phases = ('filter', 'goto', 'jump', 'tools')
          selected, progress = [], []
          # Exactly forty viewport files can leave this job, only as recipient-encrypted bytes.
          # A present frame means capture reached, never that later assertions passed.
          for width, height in widths:
              for pointer in ('fine', 'coarse'):
                  captured = 0
                  for phase in phases:
                      name = f'viewer-replay-{phase}-{pointer}-{width}-viewport.png'
                      path = shots/name
                      try:
                          info = path.lstat()
                      except FileNotFoundError:
                          continue
                      assert stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid() and stat.S_IMODE(info.st_mode) == 0o600 and info.st_nlink == 1 and 33 <= info.st_size <= 20*1024*1024
                      with path.open('rb') as stream:
                          data = stream.read(20*1024*1024+1)
                      assert len(data) <= 20*1024*1024 and data[:8] == b'\x89PNG\r\n\x1a\n'
                      assert data[12:16] == b'IHDR' and struct.unpack('>II', data[16:24]) == (width,height)
                      selected.append((name,data))
                      captured += 1
                  progress.append({'width': width, 'height': height, 'pointer': pointer, 'capturedStages': captured, 'expectedStages': 4, 'assertionsPassed': report.get('status') == 'pass' and captured == 4})
          assert len(selected) <= 40
          report['viewports'] = progress
          report['encryptedViewportCount'] = 0
          report['jumpCoverageMeaning'] = 'activated counts require selected-target assertions; absenceReasonChecked never credits a matching target'
          if report.get('status') == 'pass' and len(selected) != 40:
              report.update(status='fail', stage='viewport-coverage', exitCode=1, countsComplete=False)
          if selected:
              payload = io.BytesIO()
              with tarfile.open(fileobj=payload, mode='w:gz') as archive:
                  for name,data in selected:
                      info = tarfile.TarInfo(name)
                      info.size, info.mode, info.mtime = len(data), 0o600, 0
                      archive.addfile(info, io.BytesIO(data))
              cert = root/'recipient.pem'
              atomic_write_private(cert, os.environ['RECIPIENT_CERT'].encode())
              encrypted = root/'encrypted'
              encrypted.mkdir(mode=0o700)
              with (root/'logs/encryption.stderr').open('xb') as err:
                  result = subprocess.run(['openssl', 'cms', '-encrypt', '-binary', '-aes-256-gcm', '-outform', 'DER', '-out', str(encrypted/'visuals.cms'), str(cert)], input=payload.getvalue(), stdout=subprocess.DEVNULL, stderr=err, check=False, timeout=60)
              if result.returncode:
