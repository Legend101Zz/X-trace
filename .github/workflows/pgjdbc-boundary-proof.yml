name: PostgreSQL JDBC boundary proof
on:
  push:
    branches: [diagnostic/pgjdbc-boundary-20261125]
permissions:
  contents: read
jobs:
  pgjdbc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 43b54225b660139c914b7a358e6dde1402f2c945
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
          cache-dependency-path: |
            adapters/java/build.gradle.kts
            adapters/java/settings.gradle.kts
            adapters/java/gradle.lockfile
            adapters/java/*/build.gradle.kts
            adapters/java/*/gradle.lockfile
            adapters/java/gradle/verification-metadata.xml
            adapters/java/gradle/wrapper/gradle-wrapper.properties
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Build exact subject and run Java bridge and runtime tests
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/pg-proof"
          mkdir -m 700 "$root" "$root/tmp" "$root/priv" "$root/classes" "$root/lib"
          test "$(git rev-parse HEAD)" = 43b54225b660139c914b7a358e6dde1402f2c945
          if ! adapters/java/gradlew -p adapters/java --dependency-verification strict --no-daemon \
            "-Porg.gradle.java.installations.paths=$JAVA_HOME_17_X64" \
            :agent-bootstrap:test :agent-runtime:test agentDist fixtureBootJar >"$root/gradle.log" 2>&1; then
            if grep -Fq 'Could not resolve' "$root/gradle.log"; then
              echo 'Gradle dependency resolution failed.'
            elif grep -Fq 'There were failing tests' "$root/gradle.log"; then
              echo 'Java bridge or runtime test failed.'
            else
              echo 'Java compilation or fixture packaging failed.'
            fi
            python3 -B - "$root/gradle.log" <<'PY'
          from pathlib import Path
          import re
          import sys
          with Path(sys.argv[1]).open("rb") as stream:
              data = stream.read(1048577)
          if len(data) <= 1048576:
              for label, pattern in {
                  "maven-central": rb"https://repo\.maven\.apache\.org/",
                  "gradle-plugin-portal": rb"https://plugins\.gradle\.org/",
                  "http-5xx": rb"Received status code 5[0-9][0-9]\b",
                  "connection-timeout": rb"timed out|TimeoutException",
                  "dependency-verification": rb"Dependency verification failed",
                  "compile-test-java": rb"> Task :[a-z-]+:compileTestJava FAILED",
              }.items():
                  if re.search(pattern, data):
                      print("Gradle failure signal:", label)
          PY
            exit 1
          fi
          python3 -B - "$GITHUB_STEP_SUMMARY" <<'PY'
          from pathlib import Path
          import sys
          from xml.etree import ElementTree
          with open(sys.argv[1], 'a') as summary:
              for module in ('agent-bootstrap', 'agent-runtime'):
                  results = Path(f'adapters/java/{module}/build/test-results/test').glob('TEST-*.xml')
                  totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
                  for path in results:
                      counters = ElementTree.parse(path).getroot().attrib
                      for key in totals:
                          totals[key] += int(counters.get(key, 0))
                  if totals['tests'] <= 0 or totals['failures'] or totals['errors'] or totals['skipped']:
                      raise SystemExit('Test counters did not show a clean executed suite')
                  line = f'{module}: {totals["tests"]} tests, zero failed or skipped.'
                  print(line)
                  print(line, file=summary)
          PY
          if ! cargo build --locked -p xtrace-cli >"$root/cargo.log" 2>&1; then
            echo 'Locked xtrace-cli build failed.'
            exit 1
          fi
      - name: Run actual PostgreSQL 18.3, pinned pgjdbc and instrumented Spring MVC
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/pg-proof"
          export TMPDIR="$root/tmp" XTRACE_TEST_PRIVATE_SCRATCH="$root/priv"
          fixture="$GITHUB_WORKSPACE/adapters/java/agent-runtime/src/test/fixtures/pgjdbc"
          driver="$root/postgresql.jar"
          curl --silent --show-error --fail --location --max-time 60 \
            -o "$driver" https://jdbc.postgresql.org/download/postgresql-42.7.13.jar
          cd "$root"
          echo '6e0e4cc2d8cae902084f8a2b18728b073a6fd9d1f87c9d8bff8f298c18185b93  postgresql.jar' | sha256sum --check --status
          cd "$root/lib"
          jar -xf "$GITHUB_WORKSPACE/adapters/java/spring-fixture/build/libs/xtrace-spring-fixture.jar" BOOT-INF/lib
          cp "$driver" BOOT-INF/lib/
          if ! javac --release 17 -cp 'BOOT-INF/lib/*' -d "$root/classes" "$fixture/PgJdbcFixture.java" >"$root/fixture-build.log" 2>&1; then
            echo 'PostgreSQL Spring fixture compilation failed.'
            exit 1
          fi
          python3 -B "$fixture/probe.py" "$root" "$GITHUB_WORKSPACE/target/debug/xtrace" \
            "$GITHUB_WORKSPACE/adapters/java/agent-bootstrap/build/agent-dist/xtrace-java-agent.jar" \
            "$root/classes:$root/lib/BOOT-INF/lib/*" | tee -a "$GITHUB_STEP_SUMMARY"
