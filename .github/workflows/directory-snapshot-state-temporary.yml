name: directory-snapshot-state-temporary
on:
  push:
    branches: [codex/directory-snapshot-state-126]
permissions:
  contents: read
jobs:
  linux-admission-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Prepare the private floor-depth fixture
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP:?}/xf"
          [ "${#root}" -le 40 ]
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/diag" "$root/c" "$root/c/recording-port-000000" "$root/tmp/t" "$root/tmp/p"
          echo "XTRACE_SNAPSHOT_STATE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Verify existing Linux security and race regressions
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_SNAPSHOT_STATE_ROOT"
          export CARGO_TARGET_DIR="$root/target-candidate"
          export TMPDIR="$root/tmp/t" TMP="$root/tmp/t" TEMP="$root/tmp/t"
          export XTRACE_TEST_PRIVATE_SCRATCH="$root/tmp/p"
          log="$root/diag/security.log"
          if ! cargo test --locked -p xtrace-private-storage --lib --all-features > "$log" 2>&1; then
            echo "Linux admission security suite failed"
            exit 1
          fi
          for test in acl_edits_between_directory_reads_fail_closed_without_an_mtime_or_mode_change \
                      linux_link_count_change_requires_stable_acl_evidence_even_with_equal_mtime \
                      linux_acl_read_errors_survive_link_count_recovery \
                      linux_child_mutations_require_fresh_stable_acl_evidence \
                      linux_link_count_recovery_refuses_a_changed_access_or_default_acl \
                      linux_child_mutations_cannot_hide_access_or_default_acl_edits \
                      ancestor_replacement_with_symlink_invalidates_existing_capability; do
            grep -Eq "^test [a-z_:]+::${test} \.\.\. ok$" "$log"
          done
      - name: Build the same microbenchmark against the exact baseline and candidate
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_SNAPSHOT_STATE_ROOT"
          if ! (
            base=dd29ffa29e6c064792bfa3a8e697ad34212aad9c
            git merge-base --is-ancestor "$base" HEAD &&
            git worktree add --detach "$root/base" "$base"
          ) > "$root/diag/baseline-setup.log" 2>&1; then
            echo "Exact baseline preparation failed"
            exit 1
          fi
          harness="$GITHUB_WORKSPACE/tools/qa/fixtures/directory_snapshot_state_measurement.rs"
          example=crates/xtrace-private-storage/examples/directory_snapshot_state_measurement.rs
          test ! -e "$root/base/$example"
          test ! -e "$GITHUB_WORKSPACE/$example"
          trap 'rm -f -- "$root/base/$example" "$GITHUB_WORKSPACE/$example"' EXIT
          for variant in baseline candidate; do
            case "$variant" in baseline) source="$root/base";; candidate) source="$GITHUB_WORKSPACE";; esac
            mkdir -p "$(dirname "$source/$example")"
            cp "$harness" "$source/$example"
            if ! (
              cd "$source" && CARGO_TARGET_DIR="$root/target-$variant" cargo build --locked \
                -p xtrace-private-storage --all-features --example directory_snapshot_state_measurement
            ) > "$root/diag/build-$variant.log" 2>&1; then
              echo "Admission measurement build failed for $variant"
              exit 1
            fi
          done
      - name: Compare four same-runner pairs at the identical fixture path
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_SNAPSHOT_STATE_ROOT"
          export XTRACE_SNAPSHOT_STATE_FIXTURE="$root/c/recording-port-000000"
          run_one() {
            local pair="$1" variant="$2"
            if ! "$root/target-$variant/debug/examples/directory_snapshot_state_measurement" \
              > "$root/diag/$pair-$variant.txt" 2> "$root/diag/$pair-$variant.err"; then
              echo "Admission measurement failed for pair $pair $variant"
              return 1
            fi
          }
          for pair in 1 2 3 4; do
            if (( pair % 2 == 1 )); then
              run_one "$pair" baseline
              run_one "$pair" candidate
            else
              run_one "$pair" candidate
              run_one "$pair" baseline
            fi
          done
          python3 -B - "$root/diag" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib
          import re
          import statistics
          import sys

          root = pathlib.Path(sys.argv[1])
          def read(pair, variant):
              match = re.fullmatch(r"completed=50000 elapsed_ns=([0-9]{1,20})\n",
                                   (root / f"{pair}-{variant}.txt").read_text())
              assert match
              elapsed = int(match[1])
              assert elapsed > 0
              return elapsed

          pairs = [(read(pair, "baseline"), read(pair, "candidate")) for pair in range(1, 5)]
          deltas = [(baseline - candidate) / 50_000 for baseline, candidate in pairs]
          fractions = [(baseline - candidate) / baseline for baseline, candidate in pairs]
          print("Linux admitted-root revalidation, 50,000 successful operations per trial")
          print(f"- Median baseline minus candidate: {statistics.median(deltas):.1f}ns per revalidation "
                f"(paired range {min(deltas):.1f} to {max(deltas):.1f}ns).")
          print(f"- Median paired relative change: {statistics.median(fractions):+.2%} savings.")
          print("- One runner, an identical admitted fixture, and alternating order. "
                "No cardinality workloads or floor gates were run.")
          PY
      - name: Encrypt private diagnostics
        if: always() && env.XTRACE_SNAPSHOT_STATE_ROOT != ''
        env:
          EVIDENCE_CERT: 
        run: |
          set -euo pipefail
          umask 077
          root="$XTRACE_SNAPSHOT_STATE_ROOT"
          printf '%s' "$EVIDENCE_CERT" | base64 -d > "$root/evidence.crt"
          tar -C "$root" -cf - diag | openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER -out "$root/directory-snapshot-state.enc" "$root/evidence.crt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.XTRACE_SNAPSHOT_STATE_ROOT != ''
        with:
          name: encrypted-directory-snapshot-state
          path: ${{ env.XTRACE_SNAPSHOT_STATE_ROOT }}/directory-snapshot-state.enc
          if-no-files-found: error
          retention-days: 1
