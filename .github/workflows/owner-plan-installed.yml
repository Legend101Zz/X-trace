    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: wrapper
          sparse-checkout: .github/proof/owner-plan-installed-121
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
      - name: Verify closed wrapper helpers and admit original private fixture scratch
        id: admit
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test "$(git -C ../wrapper rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C ../wrapper show -s --format=%P HEAD)" = "$PRODUCT"
          scripts="$GITHUB_WORKSPACE/wrapper/.github/proof/owner-plan-installed-121"
          test "$(sha256sum "$scripts/SHA256SUMS" | cut -d' ' -f1)" = 'd76f2040e122ff4d7c3cbc1662a60f262ce0f34f06c50dc084e2457f3b879d0a'
          (cd "$scripts" && sha256sum --check --status SHA256SUMS)
          python3 -B - <<'INVENTORY'
          import os, subprocess
          expected=['A\t.github/proof/owner-plan-installed-121/SHA256SUMS', 'A\t.github/proof/owner-plan-installed-121/installed.py', 'A\t.github/proof/owner-plan-installed-121/owner-plan-browser.mjs', 'A\t.github/proof/owner-plan-installed-121/owner_plan.py', 'A\t.github/proof/owner-plan-installed-121/qualification.py', 'A\t.github/proof/owner-plan-installed-121/run-plan.py', 'A\t.github/workflows/owner-plan-installed.yml']
          actual=subprocess.check_output(['git','-C','../wrapper','diff','--name-status',os.environ['PRODUCT'],os.environ['GITHUB_SHA']],text=True).splitlines()
          assert actual==expected
          INVENTORY
          root="$RUNNER_TEMP/xp121"
          python3 -B -m tools.release.ci_floor prepare-private-root --root "$root"
          mkdir -m 700 "$root/private" "$root/public" "$root/logs"
          printf '%s\n' "PROOF_SCRIPTS=$scripts" "TMPDIR=$root/tmp" "XTRACE_TEST_PRIVATE_SCRATCH=$root/private" "PLAYWRIGHT_BROWSERS_PATH=$root/chromium" >> "$GITHUB_ENV"
      - name: Require exact contracts and source runs, authenticated generated files and direct child
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 -B "$PROOF_SCRIPTS/qualification.py" > "$RUNNER_TEMP/xp121/logs/qualification.stdout" 2> "$RUNNER_TEMP/xp121/logs/qualification.stderr"
      - name: Prepare only pinned owner browser dependencies
        run: |
          set -euo pipefail
          umask 077
          timeout 3000 npm ci --prefix web/app --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/xp121/logs/browser-install.stdout" 2> "$RUNNER_TEMP/xp121/logs/browser-install.stderr"
          (cd web/app && timeout 3000 npm exec -- playwright install chromium) > "$RUNNER_TEMP/xp121/logs/chromium.stdout" 2> "$RUNNER_TEMP/xp121/logs/chromium.stderr"
